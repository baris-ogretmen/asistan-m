 çalışması hazırla. Cevap anahtarı ekle."}, {"e": "Kelime Dağarcığı", "t": "flashcard", "m": "3. sınıf için 10 yeni kelimeyi anlamı ve örnek cümlesiyle tanıtan bilgi kartları hazırla."}, {"e": "Ses Çalışması", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "R sesini doğru çıkaramayan bir öğrenci için başta, ortada ve sonda R sesi geçen kelimelerle artikülasyon çalışması hazırla."}]}, {"grup": "🔢 Matematik", "items": [{"e": "Problem Kurma", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "4. sınıf için verilen işlemden problem kurdurma çalışması hazırla. 6 işlem ver, her biri için problem yazdır."}, {"e": "Ritmik Sayma", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "2. sınıf için 2'şer, 5'er ve 10'ar ritmik sayma çalışması hazırla. Boşluk doldurmalı olsun."}, {"e": "Saat Okuma", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "3. sınıf için tam, buçuk ve çeyrek saatleri okuma ve yazma çalışması hazırla."}, {"e": "Para & Alışveriş", "t": "fatura", "m": "3. sınıf için market alışverişi üzerinden para hesabı yaptıran fiş/fatura çalışması hazırla."}, {"e": "İşlem Şeridi", "t": "makine", "m": "2. sınıf için kuralı verilen dönüşüm makinesiyle toplama-çıkarma alıştırması hazırla."}, {"e": "Hata Dedektifi", "t": "hatali", "m": "5. sınıf kesirler konusunda kasten hatalı çözülmüş bir işlem ver; öğrenci hatayı bulup doğrusunu yazsın."}, {"e": "Ölçme (Uzunluk)", "t": "tablo", "m": "4. sınıf için uzunluk ölçme birimleri dönüşüm tablosu ve alıştırmaları hazırla. Cevap anahtarı ekle."}]}, {"grup": "🔬 Fen & Sosyal", "items": [{"e": "Deney Raporu", "t": "recete", "m": "5. sınıf fen bilimleri için basit bir deneyin malzeme listesi, adımları ve gözlem-sonuç bölümü olan deney raporu şablonu hazırla."}, {"e": "Kavram Haritası", "t": "zihin", "m": "6. sınıf fen bilimleri 'maddenin hâlleri' konusu için merkez kavram ve yan kavramlardan oluşan zihin haritası çalışması hazırla."}, {"e": "Zaman Şeridi", "t": "sirala", "m": "4. sınıf sosyal bilgiler için Kurtuluş Savaşı olaylarını karışık verip zaman şeridine sıralatan çalışma hazırla."}, {"e": "Karşılaştırma (Venn)", "t": "venn", "m": "5. sınıf fen için 'bitki hücresi ve hayvan hücresi' karşılaştırmalı Venn şeması çalışması hazırla."}, {"e": "İnfografik Özet", "t": "gorsel_veri", "m": "6. sınıf için 'geri dönüşüm' konulu, sayısal verilerle desteklenmiş infografik tarzı özet materyali hazırla."}]}, {"grup": "🏫 Sınıf Yönetimi", "items": [{"e": "Sınıf Kuralları Afişi", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "İlkokul 1. sınıf için olumlu dille yazılmış, 6 maddelik görsel sınıf kuralları afişi hazırla."}, {"e": "Davranış Takip Çizelgesi", "t": "tablo", "m": "Bir öğrencinin haftalık hedef davranışlarını gün gün takip edebileceğim çizelge hazırla. Değerlendirme ölçütleri net olsun."}, {"e": "Ödül / Pekiştireç Tablosu", "t": "tombala", "m": "Sınıf içi olumlu davranışları pekiştirmek için çocukların seçebileceği ödül görevlerinden oluşan tombala kartı hazırla."}, {"e": "Nöbet & Görev Çizelgesi", "t": "tablo", "m": "Sınıf içi haftalık görev dağılımı çizelgesi hazırla: tahta, çiçek, sıra düzeni gibi görevler olsun."}]}, {"grup": "👨‍👩‍👧 Veli & Ev", "items": [{"e": "Ev Çalışma Programı", "t": "tablo", "m": "3. sınıf öğrencisi için hafta içi akşamlarına uygun, 30 dakikayı geçmeyen ev çalışma programı çizelgesi hazırla."}, {"e": "Okuma Takip Çizelgesi", "t": "tablo", "m": "Her gün 15 dakika okuma yapan bir öğrenci için veli imzalı aylık okuma takip çizelgesi hazırla."}, {"e": "Veli Bilgilendirme Notu", "t": "okuma", "m": "Velilere çocuklarının ekran süresini yönetmeleri için pratik önerileri olan kısa bir bilgilendirme notu hazırla."}, {"e": "Tatil Etkinlik Paketi", "t": "tombala", "m": "Ara tatilde ailece yapılabilecek, ekran gerektirmeyen eğitici etkinliklerden oluşan tombala kartı hazırla."}]}, {"grup": "🌍 İngilizce & Değerler", "items": [{"e": "İngilizce Kelime Kartı", "t": "flashcard", "m": "4. sınıf İngilizce 'animals' ünitesi için ön yüzde İngilizce kelime, arka yüzde Türkçe karşılığı ve örnek cümle olan kartlar hazırla."}, {"e": "İngilizce Boşluk Doldurma", "t": "bosluk", "m": "5. sınıf İngilizce present simple konusundan 10 cümlelik boşluk doldurma çalışması hazırla. Cevap anahtarı ekle."}, {"e": "Değerler Eğitimi", "t": "okuma", "m": "İlkokul için 'yardımlaşma' değerini işleyen kısa bir öykü ve ardından 3 tartışma sorusu hazırla."}]}, {"grup": "📑 Denemeler · LGS", "items": [{"e": "LGS Türkçe Denemesi", "t": "deneme_sinavi", "m": "LGS formatında, yeni nesil ve paragraf ağırlıklı 20 soruluk Türkçe deneme sınavı hazırla. Sözcükte anlam, cümlede anlam, paragraf, sözel mantık ve dil bilgisi dengeli dağılsın. Her sorunun sonunda cevap anahtarı ve kısa çözüm olsun."}, {"e": "LGS Matematik Denemesi", "t": "deneme_sinavi", "m": "LGS formatında yeni nesil 20 soruluk Matematik deneme sınavı hazırla. Gerçek yaşam problemleri, grafik/tablo yorumlama, çarpanlar-katlar, cebirsel ifadeler, geometri dengeli olsun. Cevap anahtarı ve çözümlü olsun."}, {"e": "LGS Fen Bilimleri Denemesi", "t": "deneme_sinavi", "m": "LGS formatında yeni nesil 20 soruluk Fen Bilimleri deneme sınavı hazırla (8. sınıf müfredatı: DNA, basınç, madde, elektrik, periyodik sistem vb.). Deney/grafik yorumlama içersin. Cevap anahtarı ve çözümlü olsun."}, {"e": "LGS İnkılap Tarihi Denemesi", "t": "deneme_sinavi", "m": "LGS formatında 10 soruluk T.C. İnkılap Tarihi ve Atatürkçülük deneme sınavı hazırla. Cevap anahtarı ve kısa açıklama olsun."}, {"e": "LGS Din Kültürü Denemesi", "t": "deneme_sinavi", "m": "LGS formatında 10 soruluk Din Kültürü ve Ahlak Bilgisi deneme sınavı hazırla. Cevap anahtarlı ve açıklamalı olsun."}, {"e": "LGS İngilizce Denemesi", "t": "deneme_sinavi", "m": "LGS formatında 10 soruluk İngilizce deneme sınavı hazırla (8. sınıf üniteleri). Cevap anahtarlı olsun."}, {"e": "LGS Karma Genel Deneme", "t": "deneme_sinavi", "m": "LGS sınavının birebir sözel + sayısal bölüm dağılımına uygun kapsamlı bir genel deneme hazırla (Türkçe, İnkılap, Din, İngilizce + Matematik, Fen). Cevap anahtarı ve çözümleri en sonda toplu olsun."}]}, {"grup": "📑 Denemeler · TYT", "items": [{"e": "TYT Türkçe Denemesi", "t": "deneme_sinavi", "m": "TYT formatında 20 soruluk Türkçe deneme hazırla (sözcük/cümle/paragraf anlam, dil bilgisi, yazım-noktalama). Cevap anahtarı ve çözümlü olsun."}, {"e": "TYT Temel Matematik Denemesi", "t": "deneme_sinavi", "m": "TYT formatında 20 soruluk Temel Matematik deneme hazırla (sayılar, problemler, cebir, geometri). Cevap anahtarlı ve çözümlü olsun."}, {"e": "TYT Fen Bilimleri Denemesi", "t": "deneme_sinavi", "m": "TYT formatında Fizik-Kimya-Biyoloji dengeli 20 soruluk Fen deneme hazırla. Cevap anahtarlı ve açıklamalı olsun."}, {"e": "TYT Sosyal Bilimler Denemesi", "t": "deneme_sinavi", "m": "TYT formatında Tarih-Coğrafya-Felsefe-Din dengeli 20 soruluk Sosyal Bilimler deneme hazırla. Cevap anahtarlı olsun."}, {"e": "TYT Genel Deneme", "t": "deneme_sinavi", "m": "TYT'nin gerçek oturum yapısına uygun kapsamlı genel deneme hazırla (Türkçe, Sosyal, Matematik, Fen). Cevap anahtarı ve çözümler en sonda toplu olsun."}]}, {"grup": "📑 Denemeler · AYT", "items": [{"e": "AYT Matematik Denemesi", "t": "deneme_sinavi", "m": "AYT formatında zor 20 soruluk Matematik deneme hazırla (fonksiyonlar, türev, integral, limit, trigonometri). Cevap anahtarlı ve çözümlü olsun."}, {"e": "AYT Fizik Denemesi", "t": "deneme_sinavi", "m": "AYT formatında 14 soruluk Fizik deneme hazırla. Cevap anahtarlı ve açıklamalı olsun."}, {"e": "AYT Kimya Denemesi", "t": "deneme_sinavi", "m": "AYT formatında 13 soruluk Kimya deneme hazırla. Cevap anahtarlı olsun."}, {"e": "AYT Biyoloji Denemesi", "t": "deneme_sinavi", "m": "AYT formatında 13 soruluk Biyoloji deneme hazırla. Cevap anahtarlı olsun."}, {"e": "AYT Edebiyat Denemesi", "t": "deneme_sinavi", "m": "AYT formatında 24 soruluk Türk Dili ve Edebiyatı deneme hazırla. Cevap anahtarlı ve açıklamalı olsun."}, {"e": "AYT Tarih-Coğrafya Denemesi", "t": "deneme_sinavi", "m": "AYT formatında Tarih ve Coğrafya dengeli 20 soruluk deneme hazırla. Cevap anahtarlı olsun."}]}, {"grup": "📑 Denemeler · KPSS", "items": [{"e": "KPSS Genel Yetenek", "t": "deneme_sinavi", "m": "KPSS formatında Türkçe ve Matematik (Genel Yetenek) dengeli 30 soruluk deneme hazırla. Cevap anahtarlı ve çözümlü olsun."}, {"e": "KPSS Genel Kültür", "t": "deneme_sinavi", "m": "KPSS formatında Tarih, Coğrafya, Vatandaşlık ve Güncel Bilgiler (Genel Kültür) dengeli 30 soruluk deneme hazırla. Cevap anahtarlı olsun."}, {"e": "KPSS Eğitim Bilimleri", "t": "deneme_sinavi", "m": "KPSS Eğitim Bilimleri formatında 30 soruluk deneme hazırla (Öğrenme, Gelişim, ÖYT, Ölçme-Değerlendirme, Rehberlik). Cevap anahtarlı ve açıklamalı olsun."}, {"e": "KPSS Mevzuat (ÖMK/657)", "t": "deneme_sinavi", "m": "KPSS Eğitim Bilimleri mevzuat bölümü için 15 soruluk deneme hazırla (1739, 657, Öğretmenlik Meslek Kanunu). Güncel ve cevap anahtarlı olsun."}, {"e": "KPSS Genel Deneme", "t": "deneme_sinavi", "m": "KPSS'nin gerçek oturum yapısına uygun kapsamlı genel deneme hazırla (Genel Yetenek + Genel Kültür). Cevap anahtarı ve çözümler en sonda toplu olsun."}]}, {"grup": "📑 Denemeler · ÖABT & AGS", "items": [{"e": "ÖABT Okul Öncesi Denemesi", "t": "deneme_sinavi", "m": "Okul Öncesi Öğretmenliği ÖABT formatında (30 Alan Bilgisi + 20 Alan Eğitimi = 50 soru mantığında) kapsamlı deneme hazırla. Gelişim, EÇE yaklaşımları, oyun, çocuk edebiyatı, alan eğitimi konuları dengeli olsun. Cevap anahtarı ve çözümler en sonda toplu olsun."}, {"e": "ÖABT Sınıf Öğretmenliği", "t": "deneme_sinavi", "m": "Sınıf Öğretmenliği ÖABT formatında kapsamlı deneme hazırla (Türkçe/İlk okuma yazma, Matematik, Fen, Sosyal, Alan eğitimi). Cevap anahtarlı ve çözümlü olsun."}, {"e": "AGS Eğitim Bilimleri", "t": "deneme_sinavi", "m": "AGS (Akademi Giriş Sınavı) formatında 30 soruluk Eğitim Bilimleri denemesi hazırla. Güncel, cevap anahtarlı ve açıklamalı olsun."}, {"e": "AGS Genel Yetenek-Kültür", "t": "deneme_sinavi", "m": "AGS formatında Sözel-Sayısal Yetenek, Tarih, Coğrafya, Vatandaşlık dengeli 30 soruluk deneme hazırla. Cevap anahtarlı olsun."}]}, {"grup": "📑 Denemeler · EKPSS & Özel", "items": [{"e": "EKPSS Genel Yetenek", "t": "deneme_sinavi", "m": "EKPSS (Engelli KPSS) formatında, sade ve anlaşılır dilde Genel Yetenek (Türkçe-Matematik) 20 soruluk deneme hazırla. Cevap anahtarlı ve çözümlü olsun."}, {"e": "EKPSS Genel Kültür", "t": "deneme_sinavi", "m": "EKPSS formatında Genel Kültür 20 soruluk deneme hazırla (Tarih, Coğrafya, Vatandaşlık, güncel). Sade dilde, cevap anahtarlı olsun."}, {"e": "EKPSS Genel Deneme", "t": "deneme_sinavi", "m": "EKPSS'nin yapısına uygun kapsamlı genel deneme hazırla (Genel Yetenek + Genel Kültür), sade ve erişilebilir dilde. Cevap anahtarı toplu olsun."}, {"e": "Bursluluk (İOKBS) Denemesi", "t": "deneme_sinavi", "m": "İOKBS (Bursluluk) sınavı formatında seçilen sınıf düzeyi için Türkçe, Matematik, Fen, Sosyal dengeli deneme hazırla. Cevap anahtarlı olsun."}]}, {"grup": "🤖 Robotik & Kodlama", "items": [{"e": "Scratch Blok Kodlama", "t": "blok_kodlama", "m": "Belirtilen sınıf düzeyi için Scratch tarzı blok kodlama görevleri hazırla: karakteri hareket ettirme, döngü, koşul ve olay blokları içeren adım adım proje yönergeleri olsun. Görevin sonunda öğrencinin ekleyeceği bir 'yaratıcı görev' olsun."}, {"e": "Kod.org Etkinliği", "t": "kodlama_etkinlik", "m": "Kod.org tarzı, bloklarla labirent/algoritma çözme etkinliği hazırla. Adım adım yönlendirme (ileri, dön, tekrarla) ve giderek zorlaşan seviyeler olsun."}, {"e": "Algoritma & Akış Şeması", "t": "algoritma", "m": "Öğrencilere algoritma mantığını öğreten bir çalışma hazırla: günlük hayattan bir işi (diş fırçalama, sandviç yapma) adım adım algoritmaya ve basit akış şemasına dökme etkinlikleri olsun."}, {"e": "mBlock / Arduino Başlangıç", "t": "robotik_arduino", "m": "Ortaokul için mBlock/Arduino başlangıç etkinliği hazırla: LED yakma, buton okuma, sensör ile mesafe ölçme gibi basit robotik görevleri adım adım anlat. Malzeme listesi ve güvenlik notu ekle."}, {"e": "Robotik Proje Fikirleri", "t": "robotik_proje", "m": "Seçilen yaş grubuna uygun, sınıfta uygulanabilir 5 robotik/STEM proje fikri hazırla. Her proje için amaç, malzeme, adımlar ve kazanım yaz."}, {"e": "Python Başlangıç (Çocuk)", "t": "python_baslangic", "m": "Çocuklar için Python'a giriş çalışması hazırla: print, değişken, basit döngü ve koşul konularını eğlenceli örneklerle anlat. Her konunun sonunda küçük bir alıştırma olsun."}, {"e": "Kodlama Kavramları Testi", "t": "test", "m": "Bilişim/kodlama kavramları (döngü, koşul, değişken, algoritma, hata ayıklama) üzerine seçilen düzeye uygun 10 soruluk test hazırla. Cevap anahtarlı olsun."}, {"e": "Robotik Etkinlik Planı", "t": "etkinlik_plani", "m": "Bir ders saatlik robotik/kodlama etkinlik planı hazırla: kazanımlar, giriş-etkinlik-değerlendirme aşamaları, kullanılacak malzeme ve süreler olsun."}]}, {"grup": "♟️ Satranç", "items": [{"e": "Satranç Taşları & Kurallar", "t": "satranc_temel", "m": "Satranca yeni başlayan çocuklar için taşların hareketlerini, satranç tahtası kurulumunu ve temel kuralları görsellerle (emoji/şema) anlatan bir çalışma hazırla. Sonunda 5 kısa 'doğru-yanlış' sorusu olsun."}, {"e": "Satranç Mat Problemleri", "t": "satranc_mat", "m": "Seçilen seviyeye uygun 'tek hamlede mat' ve 'iki hamlede mat' problemleri hazırla. Her problemin altına çözümü (doğru hamle) yaz. Tahta konumunu metin/koordinatla tarif et."}, {"e": "Satranç Açılış Bilgisi", "t": "satranc_acilis", "m": "Yeni başlayanlar için temel satranç açılış prensiplerini (merkez kontrolü, taş geliştirme, şah güvenliği, rok) örneklerle anlatan bir çalışma hazırla."}, {"e": "Satranç Taktikleri", "t": "satranc_taktik", "m": "Çatal, şiş, çıkma, açmaz gibi temel satranç taktiklerini örnek pozisyonlarla anlatan bir çalışma hazırla. Her taktik için bir uygulama sorusu ve çözümü olsun."}, {"e": "Satranç Etkinlik/Turnuva", "t": "satranc_etkinlik", "m": "Sınıf içi satranç etkinliği/mini turnuva planı hazırla: eşleştirme sistemi, süre, puanlama, adil oyun kuralları ve satranç görgü kuralları olsun."}]}, {"grup": "🧠 Akıl & Zeka Oyunları", "items": [{"e": "Mantık Bulmacaları", "t": "mantik_bulmaca", "m": "Seçilen yaş grubuna uygun mantık bulmacaları hazırla (kim-nerede-ne türü çıkarım tabloları, sıralama bulmacaları). Her bulmacanın çözümü sonda olsun."}, {"e": "Sudoku & Sayı Bulmaca", "t": "sudoku", "m": "Seçilen zorlukta Sudoku ve sayı yerleştirme bulmacaları hazırla (4x4, 6x6 veya 9x9). Çözüm anahtarı ekle."}, {"e": "Tangram & Görsel Zeka", "t": "gorsel_zeka", "m": "Görsel zekâ ve dikkat etkinlikleri hazırla: tangram şekilleri, farkı bul, örüntü tamamlama, döndürülmüş şekli bulma görevleri olsun."}, {"e": "Kutu Kapatmaca / Nim", "t": "strateji_oyun", "m": "Sınıfta oynanabilecek strateji ve akıl oyunlarını (Nim, kutu kapatmaca, sıra sayı) kurallarıyla anlat ve stratejik ipuçları ver."}, {"e": "Zeka Soruları (Isınma)", "t": "zeka_sorulari", "m": "Derse ısınma için seçilen yaş grubuna uygun 10 eğlenceli zekâ/muhakeme sorusu hazırla. Cevaplar ve kısa açıklamalar sonda olsun."}, {"e": "Mangala / Akıl Oyunu", "t": "akil_oyun", "m": "Mangala gibi geleneksel akıl oyunlarının kurallarını ve temel stratejilerini öğreten bir çalışma hazırla; sınıfta uygulama yönergesi ekle."}, {"e": "Dikkat & Hafıza Egzersizi", "t": "dikkat_hafiza", "m": "Bilişsel beceri geliştiren dikkat ve hafıza egzersizleri hazırla: sayı/şekil dizisi hatırlama, dikkat tarama, eşleştirme ve odaklanma görevleri olsun."}]}, {"grup": "🎓 Yapay Zeka & Dijital Beceri", "items": [{"e": "Yapay Zeka Nedir? (Çocuk)", "t": "yapay_zeka_giris", "m": "Çocuklara yapay zekânın ne olduğunu günlük örneklerle (sesli asistan, öneri sistemleri, görüntü tanıma) anlatan eğlenceli bir çalışma hazırla. Sonunda 5 kısa soru olsun."}, {"e": "YZ Etik & Güvenli Kullanım", "t": "yapay_zeka_etik", "m": "Öğrenciler için yapay zekâyı etik ve güvenli kullanma çalışması hazırla: doğru bilgi kontrolü, mahremiyet, telif, önyargı konularını yaş düzeyine uygun anlat."}, {"e": "Makine Öğrenmesi (Basit)", "t": "makine_ogrenmesi", "m": "Makine öğrenmesinin temel mantığını (örneklerle öğrenme, sınıflandırma) çocukların anlayacağı sadelikte, sınıf içi etkinlikle anlat (ör. elle veri toplayıp tahmin oyunu)."}, {"e": "Yapay Zeka ile Görsel/Metin", "t": "yapay_zeka_uygulama", "m": "Öğretmenin sınıfta yapay zekâ araçlarını nasıl kullanabileceğine dair pratik bir rehber hazırla (görsel üretme, metin özetleme, soru üretme) ve örnek komutlar ver."}, {"e": "Dijital Vatandaşlık", "t": "dijital_vatandaslik", "m": "Dijital vatandaşlık çalışması hazırla: siber zorbalık, güvenli şifre, ekran süresi, dijital ayak izi konularını yaş düzeyine uygun etkinliklerle anlat."}, {"e": "Kodsuz Yapay Zeka Projesi", "t": "yapay_zeka_proje", "m": "Ortaokul/lise için kodsuz yapay zekâ proje fikirleri hazırla (Teachable Machine tarzı): amaç, adımlar, kazanım ve sunum önerisi olsun."}]}, {"grup": "🔬 STEM & Bilim Deneyleri", "items": [{"e": "Basit Bilim Deneyi", "t": "bilim_deneyi", "m": "Sınıfta güvenle yapılabilecek, evde bulunan malzemelerle basit bir bilim deneyi hazırla: hipotez, malzeme, adımlar, gözlem tablosu ve 'neden oldu?' açıklaması olsun."}, {"e": "STEM Tasarım Görevi", "t": "stem_tasarim", "m": "Mühendislik tasarım süreci içeren bir STEM görevi hazırla (köprü, kule, su geçirmez kap vb.): problem, kriterler, malzeme, tasarla-test et-geliştir adımları olsun."}, {"e": "Doğa & Gözlem Etkinliği", "t": "doga_gozlem", "m": "Doğa gözlemi ve bilimsel süreç becerisi geliştiren bir etkinlik hazırla: gözlem, kayıt, sınıflama ve çıkarım görevleri olsun."}]}, {"grup": "💚 Rehberlik & Sosyal-Duygusal", "items": [{"e": "Duygu Düzenleme", "t": "duygu_duzenleme", "m": "Sosyal-duygusal öğrenme için duygu düzenleme çalışması hazırla: duyguyu fark etme, sakinleşme teknikleri (nefes, sayma), uygun ifade etme etkinlikleri olsun."}, {"e": "Öfke Kontrolü", "t": "ofke_kontrol", "m": "Çocuklar için öfke kontrolü çalışması hazırla: öfke belirtilerini tanıma, dur-düşün-hareket et tekniği, senaryolar ve baş etme kartları olsun."}, {"e": "Arkadaşlık & Empati", "t": "empati", "m": "Arkadaşlık becerileri ve empati geliştiren etkinlikler hazırla: bakış açısı alma, paylaşma, uzlaşma senaryoları ve rol oyunları olsun."}, {"e": "Sınav Kaygısı ile Baş Etme", "t": "sinav_kaygisi", "m": "Öğrenciler için sınav kaygısıyla baş etme çalışması hazırla: kaygıyı tanıma, gevşeme teknikleri, olumlu iç konuşma ve çalışma planı önerileri olsun."}, {"e": "Motivasyon & Hedef", "t": "motivasyon_hedef", "m": "Öğrenci motivasyonu ve hedef belirleme çalışması hazırla: SMART hedef, küçük adımlar, ödül sistemi ve öz-değerlendirme olsun."}, {"e": "Meslek Tanıtımı", "t": "meslek_tanitim", "m": "Kariyer/meslek farkındalığı etkinliği hazırla: ilgi-yetenek eşleştirme, meslek tanıtımı ve 'ben büyüyünce' çalışması olsun."}]}, {"grup": "🎨 Sanat & Müzik & Drama", "items": [{"e": "Yaratıcı Drama Etkinliği", "t": "drama_etkinlik", "m": "Yaratıcı drama etkinliği hazırla: ısınma, canlandırma (doğaçlama, rol oynama), değerlendirme aşamalarıyla; belirtilen tema üzerine kurgulanmış olsun."}, {"e": "Müzik & Ritim", "t": "muzik_ritim", "m": "Okul öncesi/ilkokul için müzik ve ritim etkinliği hazırla: beden perküsyonu, basit ritim kalıpları ve şarkı eşliğinde hareket önerileri olsun."}, {"e": "Görsel Sanatlar Projesi", "t": "gorsel_sanat", "m": "Belirtilen tema için görsel sanatlar projesi hazırla: teknik (kolaj, baskı, boyama), malzeme, adımlar ve sanatsal kazanımlar olsun."}, {"e": "Boyama & El Becerisi", "t": "boyama_elbeceri", "m": "Okul öncesi için ince motor gelişimi destekleyen boyama, kesme-yapıştırma ve el becerisi etkinlikleri hazırla."}]}, {"grup": "🏃 Beden & Oyun", "items": [{"e": "Sınıf İçi Hareket Molası", "t": "hareket_molasi", "m": "Ders arasında 5 dakikalık, dar alanda uygulanabilir enerji atma / hareket molası etkinlikleri hazırla."}, {"e": "Temel Hareket Oyunları", "t": "hareket_oyun", "m": "Belirtilen yaş grubu için temel hareket becerilerini (koşma, sıçrama, denge, atma-tutma) geliştiren oyunlar hazırla; kurallar ve güvenlik notu olsun."}, {"e": "Kaynaştırma Oyunları", "t": "kaynastirma_oyun", "m": "Sınıfa uyum ve grup kaynaşması için isim öğrenme, güven ve iş birliği oyunları hazırla."}]}, {"grup": "📅 Öğretmen Pratik Araçlar", "items": [{"e": "Günlük Ders Planı", "t": "ders_plani", "m": "Belirtilen konu ve sınıf için bir ders saatlik plan hazırla: kazanımlar, giriş-gelişme-sonuç, yöntem-teknik, materyal, ölçme ve süreler olsun."}, {"e": "Kazanım Değerlendirme", "t": "kazanim_degerlendirme", "m": "Belirtilen kazanım için hızlı değerlendirme aracı hazırla: 5 soruluk kontrol testi ve kazanımın ölçülüp ölçülmediğini gösteren rubrik olsun."}, {"e": "Veli Toplantı Notu", "t": "veli_toplanti", "m": "Veli toplantısı için gündem ve konuşma notu hazırla: sınıfın genel durumu, öğrenci gelişimi, ev desteği önerileri ve iş birliği maddeleri olsun."}, {"e": "Ödül/Pekiştireç Sistemi", "t": "odul_sistem", "m": "Sınıf için olumlu davranışı pekiştiren bir ödül/token sistemi hazırla: hedef davranışlar, puanlama, ödüller ve takip çizelgesi olsun."}, {"e": "Sınıf Kuralları & Rutin", "t": "sinif_kurallari", "m": "Sınıf kuralları ve günlük rutin çalışması hazırla: olumlu dille yazılmış kurallar, görsel destek önerisi ve uygulama yönergesi olsun."}, {"e": "Aylık Konu Planı", "t": "aylik_plan", "m": "Belirtilen ders ve sınıf için bir aylık konu/ünite planı hazırla: haftalara bölünmüş kazanımlar, etkinlikler ve değerlendirme önerileri olsun."}]}, {"grup": "🖼️ Görsel Materyaller (SVG)", "items": [{"e": "Satranç Tahtası (Görsel)", "t": "zengin_metin", "m": "Satranç tahtasını ve tüm taşların başlangıç dizilimini RENKLİ İNLİNE SVG olarak çiz. 8x8 kareli tahta, açık-koyu kareler, kenarlarda a-h harfleri ve 1-8 rakamları, taşlar Unicode satranç sembolleriyle yerleştirilmiş olsun. Altına kısa bir 'taşların dizilimi' açıklaması ekle."}, {"e": "Satranç Mat Bulmacası (Görsel)", "t": "zengin_metin", "m": "Seçilen seviyeye uygun 'tek hamlede mat' satranç bulmacası hazırla. Pozisyonu RENKLİ İNLİNE SVG satranç tahtası olarak çiz (sadece ilgili taşlar dizili), altına 'Beyaz oynar ve mat eder' talimatı yaz ve en sonda çözümü (doğru hamle) ayrı bir kutuda ver."}, {"e": "Scratch Blok Şeması (Görsel)", "t": "zengin_metin", "m": "Belirtilen basit Scratch projesinin blok dizilimini RENKLİ İNLİNE SVG olarak çiz: her blok yuvarlatılmış renkli dikdörtgen (Olaylar=sarı, Hareket=mavi, Kontrol=turuncu, Görünüm=mor) ve içinde blok metni olsun; bloklar alt alta birbirine geçmiş gibi görünsün. Altına ne yaptığını adım adım açıkla."}, {"e": "Geometrik Şekiller (Görsel)", "t": "zengin_metin", "m": "Belirtilen konu için geometrik şekilleri RENKLİ İNLİNE SVG olarak çiz (üçgen, kare, dikdörtgen, daire, açılar vb.), her şeklin adını ve özelliğini yanına yaz. Ölçülü ve net olsun, çalışma kâğıdı gibi."}, {"e": "Saat Öğreniyorum (Görsel)", "t": "zengin_metin", "m": "Saati öğreten çalışma hazırla: birkaç analog saati RENKLİ İNLİNE SVG olarak farklı saatleri gösterecek şekilde çiz, altlarına 'saat kaç?' boşluğu bırak. En sonda cevapları ver."}, {"e": "Kesir Modeli (Görsel)", "t": "zengin_metin", "m": "Kesirleri görselleştiren çalışma hazırla: pizza/pasta/çubuk modellerini RENKLİ İNLİNE SVG ile parçalara bölünmüş olarak çiz (1/2, 1/3, 1/4, 3/4 vb.), her modelin altına kesri yaz. Eşleştirme veya boyama görevi ekle."}, {"e": "Harita/Diyagram (Görsel)", "t": "zengin_metin", "m": "Belirtilen konu için basit bir diyagram/şema/harita RENKLİ İNLİNE SVG olarak çiz (ör. su döngüsü, bitki kısımları, besin zinciri, akış şeması). Etiketleri <text> ile yerleştir, okları <line>/<polygon> ile göster."}, {"e": "Sayı Doğrusu (Görsel)", "t": "zengin_metin", "m": "Belirtilen aralık için sayı doğrusunu RENKLİ İNLİNE SVG olarak çiz, üzerinde işaretlenecek noktalar/işlemler için boşluk bırak. Altına 2-3 alıştırma ekle ve cevaplarını en sonda ver."}]}, {"grup": "🃏 Etkileşimli & Kesme-Yapıştır", "items": [{"e": "Flashcard Seti (Kes-Kullan)", "t": "flashcard_grid", "m": "Belirtilen konu için kesilip kullanılabilecek çalışma kartları (flashcard) hazırla: her kartın ön yüzünde kavram/soru, arka yüzünde cevap olsun. En az 10 kart üret."}, {"e": "Tombala Kartı", "t": "tombala_grid", "m": "Belirtilen konu için tombala/bingo kartı hazırla: 5x5 ızgarada kavramlar/kelimeler/sayılar olsun. Öğretmenin okuyacağı çağrı listesi de ekle."}, {"e": "Domino/Eşleştirme Kartları", "t": "eslestirme_tablosu", "m": "Belirtilen konu için kesilip eşleştirilecek kart çiftleri hazırla (soru-cevap, kavram-tanım, kelime-görsel). Karışık sırayla ver, cevap anahtarı ekle."}, {"e": "Zar/Çark Oyunu", "t": "zengin_metin", "m": "Belirtilen konu için sınıfta oynanacak zar veya çark oyunu hazırla: RENKLİ İNLİNE SVG ile bir oyun tahtası/çark çiz, her kareye görev/soru yaz, kuralları açıkla."}]}, {"grup": "📋 Kurumsal & Yönetim", "items": [{"e": "Öğrenci Gelişim Raporu", "t": "zengin_metin", "m": "Bir öğrenci için dönemlik gelişim raporu şablonu hazırla: akademik, sosyal-duygusal, davranışsal alanlar; güçlü yönler, gelişim alanları ve ev önerileri bölümleri olsun. Kurumsal ve profesyonel görünsün."}, {"e": "BEP (Bireyselleştirilmiş Plan)", "t": "zengin_metin", "m": "Özel eğitim öğrencisi için BEP (Bireyselleştirilmiş Eğitim Planı) taslağı hazırla: mevcut performans, uzun-kısa vadeli amaçlar, öğretim yöntemleri, değerlendirme ölçütleri bölümleriyle. Tablo halinde düzenli olsun."}, {"e": "Veli Bilgilendirme Mektubu", "t": "zengin_metin", "m": "Belirtilen konuda velilere gönderilecek resmi ve sıcak bir bilgilendirme mektubu hazırla. Kurumsal antet alanı, tarih, hitap ve imza bölümü olsun."}, {"e": "Etkinlik/Gezi İzin Formu", "t": "zengin_metin", "m": "Okul gezisi/etkinliği için veli izin formu hazırla: etkinlik bilgisi, tarih-saat, ücret, sorumlu öğretmen, veli onay ve imza bölümleriyle."}, {"e": "Sertifika/Başarı Belgesi", "t": "sertifika", "m": "Belirtilen öğrenci ve başarı için şık bir başarı/katılım sertifikası hazırla. Süslü çerçeve, tebrik metni, tarih ve imza alanı olsun."}, {"e": "Ödev Takip Çizelgesi", "t": "gorsel_veri", "m": "Haftalık ödev/görev takip çizelgesi hazırla: günler sütunda, dersler/görevler satırda, işaretlenecek kutular olsun."}]}, {"grup": "🎉 Belirli Gün & Hafta", "items": [{"e": "23 Nisan Etkinliği", "t": "zengin_metin", "m": "23 Nisan Ulusal Egemenlik ve Çocuk Bayramı için etkinlik/çalışma kâğıdı hazırla: kısa bilgi, boyama/görsel öğe (SVG bayrak vb.), etkinlik ve sorular olsun."}, {"e": "29 Ekim Cumhuriyet", "t": "zengin_metin", "m": "29 Ekim Cumhuriyet Bayramı için yaş düzeyine uygun etkinlik hazırla: kısa bilgi, görsel öğe, etkinlik ve değerlendirme soruları olsun."}, {"e": "10 Kasım Atatürk", "t": "zengin_metin", "m": "10 Kasım Atatürk'ü Anma için saygılı ve yaş düzeyine uygun bir çalışma hazırla: Atatürk'ün hayatından kesitler, etkinlik ve anlamlı sorular olsun."}, {"e": "Yeni Yıl / Kış Etkinliği", "t": "zengin_metin", "m": "Yeni yıl/kış temalı eğlenceli bir etkinlik kâğıdı hazırla: görsel öğeler (kar tanesi SVG vb.), boyama, bulmaca ve yaratıcı yazma görevi olsun."}, {"e": "Dünya/Çevre Günü", "t": "zengin_metin", "m": "Çevre/Dünya günü için farkındalık etkinliği hazırla: kısa bilgi, geri dönüşüm/doğa temalı görsel, etkinlik ve 'ben ne yapabilirim' bölümü olsun."}]}, {"grup": "🌍 Yabancı Dil (İngilizce)", "items": [{"e": "İngilizce Kelime Kartları", "t": "flashcard_grid", "m": "Belirtilen konu (renkler, hayvanlar, meyveler vb.) için İngilizce-Türkçe kelime kartları hazırla: ön yüz İngilizce+emoji, arka yüz Türkçe. En az 10 kart."}, {"e": "İngilizce Boşluk Doldurma", "t": "standart_soru", "m": "Belirtilen konu/gramer için İngilizce boşluk doldurma alıştırması hazırla. Cevap anahtarlı olsun."}, {"e": "İngilizce Diyalog", "t": "okuma_parcasi", "m": "Belirtilen durum için (selamlaşma, alışveriş, yön sorma) basit bir İngilizce diyalog hazırla, altına Türkçe anlamı ve 3 anlama sorusu ekle."}, {"e": "İngilizce Eşleştirme", "t": "eslestirme_tablosu", "m": "Belirtilen konu için İngilizce kelime - Türkçe anlam (veya kelime-görsel) eşleştirme çalışması hazırla. Cevap anahtarlı olsun."}]}, {"grup": "📖 Okuma-Yazma Yöntemleri", "items": [{"e": "Ses Temelli Cümle (MEB Güncel)", "t": "zengin_metin", "m": "Güncel MEB Ses Temelli Cümle Yöntemine uygun ilk okuma-yazma materyali hazırla: seçilen ses/harf için (ör. 'e' sesi) o sesle başlayan görsel-kelime örnekleri, sesin hissettirilmesi, ilgili hece tablosu (e ile: el, ev, et...), sesle kelime ve basit cümle oluşturma aşamalarını sırayla ver. Bitişik eğik yazı çizgi çalışması ekle. Bol emoji ve renkli görsel kullan."}, {"e": "Ses (Fonetik) Yöntemi", "t": "zengin_metin", "m": "Ses (fonetik) yöntemiyle okuma-yazma çalışması hazırla: verilen sesi tek tek tanıtma, sesin ağızdan çıkışını hissettirme, o sesle başlayan/biten kelimeler, ses-harf eşleştirme ve sesleri birleştirerek hece-kelime kurma etkinlikleri olsun. Parçadan bütüne (sentez) mantığıyla ilerlesin."}, {"e": "Harf (Alfabe) Yöntemi", "t": "zengin_metin", "m": "Harf (alfabe) yöntemiyle okuma-yazma çalışması hazırla: seçilen harfin tanıtımı, büyük-küçük yazılışı, harfin sesi, o harfle kelimeler, harfleri yan yana getirerek hece ve kelime oluşturma alıştırmaları olsun. Harf yazım yönü okları ve çizgi çalışması ekle."}, {"e": "Hece Yöntemi", "t": "basara_hece_tablosu", "m": "Hece yöntemiyle okuma-yazma materyali hazırla: seçilen ünlü/ünsüzle sistematik hece tablosu (ba-be-bı-bi-bo-bö-bu-bü gibi), hecelerden kelime türetme, hece atlama-birleştirme ve hecelerle cümle kurma etkinlikleri olsun. Renkli ve düzenli tablo halinde ver."}, {"e": "Ba-Sa-Ra Hece Yöntemi", "t": "basara_hece_tablosu", "m": "Ba-Sa-Ra yöntemiyle görsel destekli heceleme materyali hazırla: seçilen ünsüzün tüm ünlülerle hecelerini renkli tablo halinde ver, her heceyi görselleştir, hecelerden kelime kurma ve okuma alıştırmaları ekle. Özellikle özel eğitim ve okuma güçlüğü çeken öğrenciler için sade ve tekrarlı olsun."}, {"e": "Çözümleme (Cümle) Yöntemi", "t": "zengin_metin", "m": "Çözümleme (cümle) yöntemiyle okuma-yazma materyali hazırla: çocuğun günlük dilinden kısa anlamlı bir cümleyle başla (ör. 'Ali topu at.'), cümleyi kelimelere, kelimeleri hecelere, heceleri seslere ayır (bütünden parçaya/tümdengelim), sonra elde edilen parçalarla yeni kelime ve cümleler kur. Her aşamayı görsel destekli göster."}, {"e": "Sözcük (Kelime) Yöntemi", "t": "zengin_metin", "m": "Sözcük (kelime) yöntemiyle okuma-yazma çalışması hazırla: resimle birlikte bütün kelimeyi tanıtma (ör. 🍎 ELMA), kelimeyi görsel olarak tanıma, aynı kelimeyi farklı yerlerde bulma, sonra kelimeyi hecelere ve seslere çözme etkinlikleri olsun. Bol görsel-kelime kartı ver."}, {"e": "Cümle Yöntemi", "t": "zengin_metin", "m": "Cümle yöntemiyle okuma-yazma materyali hazırla: anlamlı kısa cümlelerle başla, cümleyi bir bütün olarak tanıma, cümledeki kelimeleri ayırt etme, kelime ve hecelere inme aşamalarını içersin. Resimli cümle kartları ekle."}, {"e": "Öykü (Metin) Yöntemi", "t": "okuma_parcasi", "m": "Öykü (metin) yöntemiyle okuma-yazma materyali hazırla: yaş düzeyine uygun kısa, akıcı ve resimlenebilir bir öykü ver, öyküden cümleleri, cümlelerden kelimeleri, kelimelerden heceleri çözümleme etkinlikleri ekle. Öykü sonunda anlama soruları olsun."}, {"e": "Bireşim (Sentez) Yöntemi", "t": "zengin_metin", "m": "Bireşim (sentez) yöntemiyle okuma-yazma çalışması hazırla: en küçük birimden (ses/harf) başlayıp harfleri birleştirerek hece, heceleri birleştirerek kelime, kelimeleri birleştirerek cümle kurma (parçadan bütüne) aşamalarını sırayla ve görsel destekli ver."}, {"e": "Çözümleme-Bireşim (Karma)", "t": "zengin_metin", "m": "Karma (eklektik) yöntemle okuma-yazma materyali hazırla: hem çözümleme (cümleden sese) hem bireşim (sesten cümleye) aşamalarını dengeli birleştir. Anlamlı cümleyle başla, seslere kadar çöz, sonra seslerden yeni kelime-cümle kur. Her iki yönü de görsel destekle göster."}, {"e": "Fiş Yöntemi (Cümlecik)", "t": "zengin_metin", "m": "Fiş yöntemiyle (cümlecik/kelime fişleri) okuma-yazma materyali hazırla: üzerinde kısa cümle veya kelime yazan, kesilip kullanılabilecek okuma fişleri hazırla. Her fişte görsel + metin olsun; fişlerle tanıma, eşleştirme ve okuma alıştırmaları ekle."}, {"e": "Görsel Okuma (Ön Hazırlık)", "t": "zengin_metin", "m": "Okuma öncesi görsel okuma / okumaya hazırlık materyali hazırla: resim okuma, sıralı olayları anlatma, benzer-farklı bulma, göz-el koordinasyonu, soldan sağa-yukarıdan aşağıya takip çizgileri ve şekil-zemin ayırt etme etkinlikleri olsun. Bol görsel."}, {"e": "Okuma Akıcılığı", "t": "okuma_parcasi", "m": "Okuma akıcılığını geliştiren materyal hazırla: seviyeye uygun kısa metin, tekrarlı okuma yönergesi, hız-doğruluk-prozodi takip tablosu, güç kelimelerin ön çalışması ve eşli okuma önerisi olsun."}, {"e": "Disleksi Destek Çalışması", "t": "zengin_metin", "m": "Okuma güçlüğü / disleksi olan öğrenciler için destekleyici, sade ve çok tekrarlı bir okuma-yazma çalışması hazırla: karıştırılan harfleri (b-d, p-q) ayırt etme, hece-ses farkındalığı, çok duyulu (görsel-işitsel-dokunsal) etkinlikler ve motive edici kısa görevler olsun. Yargılayıcı olmayan, cesaretlendirici dil kullan."}]}, {"grup": "🧩 Özel Eğitim · Beceri & Yöntem", "items": [{"e": "ABA / Ayrık Denemelerle Öğretim", "t": "zengin_metin", "m": "Uygulamalı Davranış Analizi (ABA) temelli, ayrık denemelerle öğretim (DTT) çalışması hazırla: hedef beceri, yönerge (SD), beklenen tepki, ipucu (fiziksel/model/sözel/jest), pekiştireç ve veri kayıt tablosu içersin. Adım adım, ölçülebilir ve tekrarlı olsun."}, {"e": "Fırsat Öğretimi / Doğal Öğretim", "t": "zengin_metin", "m": "Doğal ortamda öğretim (fırsat öğretimi, etkinlik temelli) çalışması hazırla: günlük rutinler içinde hedef beceriyi çalıştırma, çocuğun ilgisini takip etme, doğal pekiştireç kullanma ve genelleme fırsatları içersin."}, {"e": "Görsel Destekli Öğretim (PECS/Kart)", "t": "zengin_metin", "m": "Görsel destek sistemi materyali hazırla: iletişim kartları, günlük akış şeması (görsel program), seçim tahtası ve sıra kartları. Kartlar net, tek kavramlı ve kesilebilir olsun. PECS aşamalarına uygun kullanım notu ekle."}, {"e": "Sosyal Beceri Öğretimi", "t": "zengin_metin", "m": "Sosyal beceri öğretimi materyali hazırla: hedef sosyal beceriyi (selamlaşma, sıra bekleme, paylaşma, yardım isteme) adımlara böl, model senaryolar, rol oyunu kartları ve pekiştirme çizelgesi olsun."}, {"e": "Öz Bakım Becerileri", "t": "recete_adimlari", "m": "Öz bakım becerisi (el yıkama, diş fırçalama, giyinme, tuvalet) için görsel beceri analizi hazırla: her adımı sırayla, görsel destekli ve tek cümlelik yönergelerle ver. İlerleme takip çizelgesi ekle."}, {"e": "Davranış Yönetimi Planı", "t": "zengin_metin", "m": "Olumlu davranış destek planı hazırla: hedef davranış tanımı, öncül (ne zaman/nerede oluyor), işlev (dikkat/kaçınma/nesne), önleyici stratejiler, alternatif davranış öğretimi ve pekiştirme sistemi içersin."}, {"e": "Kaba/İnce Motor Beceri", "t": "zengin_metin", "m": "Motor beceri geliştirme çalışması hazırla: ince motor (kalem tutma, makas, boncuk dizme, düğme) ve kaba motor (denge, zıplama, top) etkinlikleri, zorluk kademeli, görsel yönergeli olsun."}, {"e": "Duyusal Bütünleme Etkinliği", "t": "zengin_metin", "m": "Duyusal bütünleme destekli etkinlik hazırla: dokunsal, vestibüler ve proprioseptif girdiler içeren, sınıfta/evde uygulanabilir sakinleştirici ve düzenleyici etkinlikler olsun. Güvenlik notu ekle."}, {"e": "Kavram Öğretimi (Somuttan)", "t": "zengin_metin", "m": "Özel eğitim için temel kavram öğretimi materyali hazırla (renk, şekil, büyük-küçük, sayı): somuttan soyuta, çok tekrarlı, görsel-eşleştirme ağırlıklı ve her adımda ipucu-silme (prompt fading) mantığıyla olsun."}]}, {"grup": "🧠 Çocuklar için Felsefe (P4C)", "items": [{"e": "Felsefi Sorgulama Oturumu (P4C)", "t": "okuma_parcasi", "m": "Çocuklar için Felsefe (P4C) yaklaşımıyla bir sorgulama oturumu materyali hazırla: yaş düzeyine uygun kısa bir uyarıcı (öykü/senaryo) ver, ardından merak uyandıran açık uçlu felsefi sorular (ör. 'Arkadaşlık nedir?', 'Adil olmak ne demek?'), tartışma yönergeleri ve öğretmen için kolaylaştırıcı ipuçları olsun. Doğru-yanlış dayatma; düşünmeyi teşvik et."}, {"e": "Düşünme Hikâyesi + Sokratik Sorular", "t": "okuma_parcasi", "m": "Çocuklar için felsefi bir düşünme hikâyesi yaz (yaş düzeyine uygun, bir ikilem ya da merak içeren), ardından hikâyeden çıkan kademeli Sokratik sorular (açıklama, gerekçe, örnek, karşı görüş) ekle. Sonunda 'sen ne düşünürsün?' bölümü olsun."}, {"e": "Kavram Sorgulama: Nedir?", "t": "zengin_metin", "m": "Çocuklarla bir felsefi kavramı (mutluluk, özgürlük, adalet, dostluk, cesaret, doğruluk) sorgulayan çalışma hazırla: kavramı örneklerle keşfetme, 'şu durumda geçerli mi?' senaryoları, karşı örnekler ve kendi tanımını yazma bölümü olsun."}, {"e": "Etik İkilem (Yaşa Uygun)", "t": "okuma_parcasi", "m": "Yaş düzeyine uygun bir etik ikilem senaryosu hazırla (ör. bulunan parayı ne yapmalı, arkadaşının hatasını söylemeli mi). Farklı bakış açılarını, olası sonuçları ve 'sen olsan ne yapardın, neden?' sorularını içersin. Tek doğru cevap dayatma."}, {"e": "Sokratik Soru Kartları", "t": "flashcard_grid", "m": "Sınıfta felsefi tartışma başlatmak için kesilip kullanılabilecek Sokratik soru kartları hazırla: her kartta düşündürücü açık uçlu bir soru (ör. 'Hayvanların hakları var mıdır?', 'Yalan söylemek her zaman kötü müdür?') olsun. En az 10 kart üret."}, {"e": "Küçük Filozoflar: Tartışma Planı", "t": "zengin_metin", "m": "Bir ders saatlik 'küçük filozoflar' tartışma etkinliği planı hazırla: uyarıcı, oturma düzeni, açık uçlu ana soru, alt sorular, konuşma kuralları (dinleme, gerekçe verme, saygı) ve kapanış yansıması olsun."}, {"e": "Paradoks & Zihin Açan Bilmece", "t": "zengin_metin", "m": "Çocukların ilgisini çekecek, yaş düzeyine uygun felsefi paradokslar ve zihin açan sorular hazırla (ör. yığın paradoksu, 'aynı nehre iki kez girilir mi'). Her biri için basit açıklama ve tartışma soruları olsun."}, {"e": "Değerler & Karakter Sorgulaması", "t": "okuma_parcasi", "m": "Bir değeri (saygı, sorumluluk, dürüstlük, empati, sabır) felsefi sorgulamayla ele alan çalışma hazırla: değeri yaşatan/çiğneyen kısa senaryolar, 'neden önemli?', 'her zaman geçerli mi?' soruları ve kendi hayatından örnek yazma bölümü olsun."}]}, {"grup": "🧠 Kuram & Yöntem Temelli", "items": [{"e": "Bilgi İşleme Kuramı", "t": "zengin_metin", "m": "Bilgi İşleme Kuramına göre bir çalışma hazırla: (1) DUYUSAL KAYIT için dikkat çeken renkli uyaran, (2) KISA SÜRELİ BELLEK için az bilgi + tekrar ve gruplama (chunking), (3) UZUN SÜRELİ BELLEK için anlamlandırma, ilişkilendirme ve hatırlama (geri çağırma) görevleri. Her aşamayı açık başlıkla ayır; özel eğitime uygun, sade ve tekrarlı olsun."}, {"e": "Ba-Sa-Ra (Geliştirilmiş)", "t": "basara_hece_tablosu", "m": "Ba-Sa-Ra yöntemini geliştirerek görsel destekli heceleme materyali hazırla: seçilen ünsüzün tüm ünlülerle hecelerini renkli tablo hâlinde ver, her heceyi görselle destekle, hecelerden kelime ve kısa cümle kurma, üzerinden geçmeli yazma satırları ekle. Okuma güçlüğü/özel eğitim için sade ve çok tekrarlı olsun."}, {"e": "Cümle Okuma-Yazma (Fiş)", "t": "zengin_metin", "m": "Bir 'Cümle Okuma ve Yazma' çalışması hazırla: 4-6 kısa, heceli okunabilen cümle olsun; her cümlede birkaç hece RENKLİ (vurgulu), cümlenin yanında küçük bir görsel/emoji, altında yazması için KESİKLİ kılavuz çizgi bulunsun. Sevgili [öğrenci adı] hitabıyla başla."}, {"e": "VAKT Çok Duyulu", "t": "zengin_metin", "m": "Çok duyulu (VAKT: görsel-işitsel-dokunsal-kinestetik) okuma-yazma çalışması hazırla: gör-söyle-yaz-dokun adımlarıyla harf/hece öğretimi, havada ve üzerinden geçmeli yazma, sesli tekrar görevleri olsun."}, {"e": "Bireysel Ders (Sıfırdan)", "t": "zengin_metin", "m": "Bir öğrenci için SIFIRDAN ilerleyen bireysel ders serisinin bir dersini hazırla: kısa önceki-ders tekrarı, TEK yeni beceri, adım adım örnek, bol alıştırma ve kısa değerlendirme. Sıralı derslere uygun, sade ve tekrarlı olsun."}, {"e": "Rehabilitasyon: Okuma Sıfırdan", "t": "zengin_metin", "m": "Uzun süredir rehabilitasyona gelmesine rağmen okuma-yazmada ilerleyemeyen öğrenci için sıfırdan başlayan, çok küçük adımlı, aşırı tekrarlı ve cesaretlendirici bir okuma-yazma çalışması hazırla. Tek ses/hece hedefle; çok duyulu, görsel destekli ve motive edici olsun."}, {"e": "DKT: Dudak/Ağız Sesleri", "t": "zengin_metin", "m": "Dil ve konuşma terapisi için seçilen seslerin dudak/ağız pozisyonlarını anlatan çalışma hazırla: her ses için ağzın nasıl durduğunu (açık/kapalı/yuvarlak/yayvan) yaz, ayna karşısında tekrar yönergesi ve o sesle kelime örnekleri ver."}]}, {"grup": "🎓 Eğitim Bilimleri · Kuram-Strateji-Teknik", "items": [{"e": "Yapılandırmacı (Oluşturmacı)", "t": "zengin_metin", "m": "Yapılandırmacı yaklaşıma göre bir çalışma hazırla: öğrencinin ön bilgisini harekete geçiren giriş, kendi bilgisini KEŞFEDEREK oluşturacağı etkinlikler, akran etkileşimi ve gerçek yaşam bağlantısı olsun. Öğretmen rehber, öğrenci aktif olsun."}, {"e": "5E Modeli", "t": "zengin_metin", "m": "5E modeline (Girme-Keşfetme-Açıklama-Derinleştirme-Değerlendirme) göre bir ders etkinliği hazırla. Her E aşamasını açık başlıkla ayır; her aşamada öğrenci ne yapacak, öğretmen ne soracak yaz."}, {"e": "7E Modeli", "t": "zengin_metin", "m": "7E modeline (Teşvik-Keşfet-Açıkla-Genişlet-Derinleştir-Değerlendir-İlişkilendir) göre kapsamlı bir öğretim etkinliği hazırla. Her aşamayı başlıkla ayır."}, {"e": "Buluş Yoluyla (Bruner)", "t": "zengin_metin", "m": "Bruner'in buluş yoluyla öğrenme yaklaşımına göre çalışma hazırla: öğrenciye örnekler/veriler ver, kuralı/genellemeyi KENDİSİNİN keşfetmesini sağlayacak yönlendirici sorular ve kademeli ipuçları olsun."}, {"e": "Anlamlı Öğrenme (Ausubel)", "t": "zengin_metin", "m": "Ausubel'in anlamlı öğrenme yaklaşımına göre hazırla: başta bir ÖN ÖRGÜTLEYİCİ (advance organizer) ver, yeni bilgiyi öğrencinin bildiğiyle ilişkilendir, genelden özele (tümdengelim) ilerle. Kavramları örneklerle bağla."}, {"e": "Tam Öğrenme (Bloom)", "t": "zengin_metin", "m": "Tam öğrenme modeline göre çalışma hazırla: net ölçütler, küçük ünitelere bölme, her ünitede biçimlendirici test + geri bildirim + EK ÖĞRETME (düzeltme) etkinlikleri olsun. Herkesin ustalaşması hedeflensin."}, {"e": "Gagne'nin 9 Öğretim Olayı", "t": "zengin_metin", "m": "Gagne'nin 9 öğretim olayına göre ders planı hazırla: 1) dikkat çekme, 2) hedeften haberdar etme, 3) ön bilgiyi hatırlatma, 4) içeriği sunma, 5) rehberlik, 6) uygulama, 7) geri bildirim, 8) değerlendirme, 9) kalıcılık/transfer. Her maddeyi doldur."}, {"e": "Bloom: Üst Düzey Sorular", "t": "standart_soru", "m": "Bloom taksonomisinin HER basamağı için (hatırlama, anlama, uygulama, analiz, değerlendirme, yaratma) belirtilen konudan soru hazırla. Her basamağı etiketle; üst düzey (analiz-değerlendirme-yaratma) sorulara ağırlık ver. Cevap/ölçütleri sonda ver."}, {"e": "İş Birlikli (Jigsaw)", "t": "zengin_metin", "m": "İş birlikli öğrenme (Jigsaw) etkinliği hazırla: konuyu uzman gruplara bölünecek alt parçalara ayır, her uzman parçası için görev kartı, sonra ana gruba dönüp öğretme aşaması ve ortak değerlendirme olsun."}, {"e": "Probleme Dayalı (PDÖ)", "t": "zengin_metin", "m": "Probleme dayalı öğrenme etkinliği hazırla: gerçek yaşamdan yapılandırılmamış bir problem senaryosu ver, öğrencilerin 'ne biliyoruz / ne bilmeliyiz / nasıl çözeriz' aşamalarıyla ilerleyeceği yönergeler ve değerlendirme ölçütleri olsun."}, {"e": "Proje Tabanlı", "t": "zengin_metin", "m": "Proje tabanlı öğrenme görevi hazırla: yönlendirici bir soru, ürün hedefi, aşamalar (planlama-araştırma-üretim-sunum), rol dağılımı, takvim ve ürün değerlendirme rubriği olsun."}, {"e": "İstasyon Tekniği", "t": "zengin_metin", "m": "İstasyon tekniğiyle bir ders hazırla: 4-5 farklı istasyon (ör. okuma, yazma, görsel, oyun, deney) için ayrı görev kartları, süre ve dönüşüm yönergeleri, her istasyonda ne üretileceği belirtilsin."}, {"e": "Beyin Fırtınası", "t": "zengin_metin", "m": "Beyin fırtınası etkinliği hazırla: açık uçlu bir odak sorusu, kuralları (eleştiri yok, çok fikir, fikir birleştirme), fikir toplama şeması ve sonrasında sınıflama-değerlendirme adımları olsun."}, {"e": "Altı Şapkalı Düşünme", "t": "zengin_metin", "m": "De Bono'nun altı şapkalı düşünme tekniğiyle bir konuyu ele alan etkinlik hazırla: beyaz (bilgi), kırmızı (duygu), siyah (riskler), sarı (yararlar), yeşil (yaratıcılık), mavi (süreç) şapkalar için ayrı yönerge ve boşluklar olsun."}, {"e": "Çoklu Zekâ (Gardner)", "t": "zengin_metin", "m": "Gardner'in çoklu zekâ kuramına göre aynı konuyu farklı zekâ alanlarıyla işleyen etkinlikler hazırla: sözel, mantıksal-matematiksel, görsel, müziksel, bedensel, sosyal, içsel ve doğacı için birer görev olsun."}, {"e": "Basamaklı Öğretim", "t": "zengin_metin", "m": "Basamaklı öğretim (tiered) çalışması hazırla: aynı kazanım için üç seviye (destek / temel / ileri) görev ver; her seviye aynı konuyu farklı derinlikte işlesin, öğrenci seçim yapabilsin."}, {"e": "Sokratik Sorgulama", "t": "zengin_metin", "m": "Sokratik sorgulama (soru-cevap) yöntemiyle bir konuyu derinleştiren çalışma hazırla: açıklama, gerekçe, kanıt, varsayım, karşı görüş ve sonuç sorularından oluşan kademeli soru zinciri olsun."}, {"e": "Örnek Olay (Vaka)", "t": "zengin_metin", "m": "Örnek olay (vaka) incelemesi çalışması hazırla: gerçekçi bir senaryo, analiz soruları, alternatif çözümler ve karar gerekçelendirme bölümleri olsun."}, {"e": "Yaratıcı Drama", "t": "zengin_metin", "m": "Yaratıcı drama etkinliği hazırla: ısınma, canlandırma (doğaçlama/rol), değerlendirme aşamalarıyla; hedef kazanıma bağlı roller ve yönergeler olsun."}, {"e": "Kavram Karikatürü", "t": "zengin_metin", "m": "Kavram karikatürü etkinliği hazırla: bir olay/durum hakkında farklı görüşler savunan 3-4 karakterin konuşma balonları (metinle betimle) ve öğrencinin hangi görüşe neden katıldığını yazacağı bölüm olsun. Bilimsel kavram yanılgısını tartıştır."}, {"e": "Balık Kılçığı (Neden-Sonuç)", "t": "zengin_metin", "m": "Balık kılçığı (Ishikawa) diyagramıyla bir olayın neden-sonuç ilişkisini çıkaran çalışma hazırla: ana problem başta, kılçıklarda neden kategorileri olsun; öğrenci nedenleri yerleştirsin."}, {"e": "Scaffolding (Vygotsky)", "t": "zengin_metin", "m": "Vygotsky'nin yakınsal gelişim alanına göre scaffolding (yapı iskelesi) çalışması hazırla: görevi öğrencinin tek başına yapamadığı ama destekle yapabildiği düzeyde kur; kademeli olarak azalan ipuçları (model→ipucu→bağımsız) ver."}, {"e": "Piaget Dönemine Uygun", "t": "zengin_metin", "m": "Piaget'nin bilişsel gelişim dönemlerine uygun çalışma hazırla: yaş grubunu belirt, döneme (ör. somut işlemler) uygun somut-görsel, elle yapılabilen etkinlikler kullan; soyut talep etme."}, {"e": "Pekiştireç (Davranışçı)", "t": "zengin_metin", "m": "Davranışçı yaklaşıma göre çalışma hazırla: net hedef davranış, küçük adımlar (şekillendirme), her doğru tepki için pekiştireç/işaret sistemi ve ilerleme takip çizelgesi olsun."}, {"e": "Model Alma (Bandura)", "t": "zengin_metin", "m": "Bandura'nın gözlemsel öğrenme (model alma) yaklaşımına göre çalışma hazırla: önce doğru davranışın adım adım MODEL gösterimi, sonra öğrencinin taklit edip uygulayacağı görevler ve öz-değerlendirme olsun."}, {"e": "Tersyüz Sınıf (Flipped)", "t": "zengin_metin", "m": "Tersyüz (flipped) sınıf etkinliği hazırla: evde ön öğrenme için kısa bir okuma/izleme özeti + kontrol soruları, sınıfta uygulama/derinleştirme görevleri ayrı bölümler olsun."}, {"e": "Farklılaştırılmış Öğretim", "t": "zengin_metin", "m": "Farklılaştırılmış öğretim çalışması hazırla: aynı kazanımı içerik-süreç-ürün açısından farklılaştır; hazırbulunuşluğa göre 3 seviye, ilgiye göre seçenekler ve öğrenme profiline göre çeşitli sunum yolları olsun."}, {"e": "Otantik Değerlendirme + Rubrik", "t": "zengin_metin", "m": "Otantik (gerçek yaşam) değerlendirme görevi hazırla: gerçekçi bir performans görevi, ölçülebilir ölçütlerden oluşan ayrıntılı bir dereceli puanlama anahtarı (rubrik) ve öz/akran değerlendirme formu olsun."}]}, {"grup": "🗣️ Dil ve Konuşma Terapisi · İleri", "items": [{"e": "Oral Motor Egzersizleri (İleri)", "t": "zengin_metin", "m": "Dünyanın en iyi dil ve konuşma terapisti seviyesinde İLERİ oral-motor egzersiz programı hazırla: dudak (büzme-germe-titretme), dil (yukarı-aşağı-yanlara-yalama-tıklatma), çene (açma-kapama-yana), yanak (şişirme-çekme) ve yumuşak damak egzersizleri; her egzersiz için adım adım yönerge, tekrar sayısı (ör. 10x3 set), süre ve ayna kullanımı notu olsun. Bol örnek ve kademeli zorluk ver. Sade ve net düzen."}, {"e": "Ağız-Yüz Kaslarını Güçlendirme", "t": "zengin_metin", "m": "Ağız ve yüz kaslarını güçlendiren çalışma hazırla: üfleme (balon, kağıt, pipet, kabarcık), emme (pipetle), çiğneme, dudak kapama, gülümseme-öpücük hareketleri; her biri için tekrar ve amaç. Görsel/emoji destekli, oyunlaştırılmış olsun."}, {"e": "Artikülasyon: /r/ sesi", "t": "zengin_metin", "m": "/r/ sesi için kapsamlı artikülasyon çalışması hazırla: sesin ağız/dil pozisyonu, izole ses, hece (ra-re-rı-ri-ro-rö-ru-rü), başta-ortada-sonda /r/ geçen BOL kelime (en az 20), kelime çiftleri, cümle ve kısa metin düzeyleri; kolaydan zora, görsellerle."}, {"e": "Artikülasyon: /s/ ve /ş/", "t": "zengin_metin", "m": "/s/ ve /ş/ sesleri için ayrı ayrı artikülasyon çalışması hazırla: pozisyon tarifi, hece, başta-ortada-sonda bol kelime (20+), /s/-/ş/ karışmasını önleyen minimal çiftler (saç-şaç gibi), cümle ve metin düzeyi; ıslık/hava akışı ipuçları olsun."}, {"e": "Artikülasyon: /k/-/g/ ve /l/", "t": "zengin_metin", "m": "/k/-/g/ (art damak) ve /l/ sesleri için artikülasyon çalışması hazırla: dil arkası/ucu pozisyonu, hece, bol kelime, cümle ve metin; her ses için ayrı bölüm, görsel destekli, kolaydan zora."}, {"e": "Minimal Çiftler", "t": "eslestirme", "m": "Sesletim ayrımı için minimal çift kartları hazırla (ör. bal-dal, kar-gar, taş-daş): 15 çift, her çiftin yanına küçük görsel/emoji betimi; öğrencinin doğru olanı işaretleyeceği ve tekrar edeceği düzen olsun."}, {"e": "Fonolojik Farkındalık", "t": "zengin_metin", "m": "Fonolojik farkındalık çalışması hazırla: ilk ses/son ses bulma, ses sayma, ses ekleme-çıkarma-değiştirme, hece bölme-birleştirme, uyak (kafiye) bulma etkinlikleri; kolaydan zora, görsel destekli, bol örnekli."}, {"e": "Sesbilgisel Süreç Giderme", "t": "zengin_metin", "m": "Sık görülen sesbilgisel süreçleri (ötümlüleştirme, öndamaksıllaştırma, ünsüz düşürme, hece azaltma) hedefleyen çalışma hazırla: hatalı-doğru örnekler, model verme, hedef kelimelerle tekrar ve genelleme cümleleri."}, {"e": "İşitsel Ayırt Etme", "t": "zengin_metin", "m": "İşitsel ayırt etme çalışması hazırla: benzer sesleri/kelimeleri ayırt etme, aynı-farklı oyunu, sıra takibi, arka plan sesinden hedef sesi seçme görevleri; görsel destekli."}, {"e": "Akıcılık (Kekemelik)", "t": "zengin_metin", "m": "Kekemelikte akıcılığı destekleyen çalışma hazırla: yavaş-yumuşak başlangıç, uzatmalı konuşma, hece zamanlama, nefes-konuşma eşgüdümü egzersizleri; baskı yaratmayan, cesaretlendirici bir dille, adım adım."}, {"e": "Nefes & Ses Kontrolü", "t": "zengin_metin", "m": "Nefes ve ses kontrolü çalışması hazırla: diyafram nefesi, uzun soluk verme, sesi yumuşak başlatma, ses şiddeti ve tonu ayarlama (yavaş-hızlı, alçak-yüksek) egzersizleri; görsel/oyun destekli."}, {"e": "Alıcı Dil (Anlama)", "t": "zengin_metin", "m": "Alıcı dili (anlama) geliştiren çalışma hazırla: tek/çok basamaklı yönerge takibi, resimden nesne/eylem gösterme, kavram anlama, soru anlama (ne-kim-nerede-neden) görevleri; kolaydan zora."}, {"e": "İfade Edici Dil", "t": "zengin_metin", "m": "İfade edici dili geliştiren çalışma hazırla: resim adlandırma, eylem söyleme, cümle tamamlama, resimden cümle-öykü kurma, betimleme görevleri; görsel destekli, bol örnekli."}, {"e": "Kelime Dağarcığı", "t": "zengin_metin", "m": "Kelime dağarcığını genişleten çalışma hazırla: kategori (meyveler, taşıtlar...), zıt-eş-üst/alt kavram, tanımdan kelime bulma, kelime-görsel eşleştirme; her kelime görsel betimiyle."}, {"e": "Cümle Kurma & Gramer", "t": "zengin_metin", "m": "Cümle kurma ve dil bilgisi (morfoloji) çalışması hazırla: özne-yüklem, çoğul ekleri, zaman ekleri, edatlar, karışık kelimeleri sıralayıp cümle yapma; görsel destekli, kademeli."}, {"e": "Öykü Anlatma (Sıralama)", "t": "zengin_metin", "m": "Anlatı (öykü) becerisi çalışması hazırla: 3-5 kareli olay sırasını doğru diz, her kareyi cümleyle anlat, başı-ortası-sonu kurma; sıralama ve neden-sonuç bağı olsun."}, {"e": "Pragmatik (Sosyal Dil)", "t": "zengin_metin", "m": "Pragmatik/sosyal iletişim çalışması hazırla: selamlaşma, sıra alma, göz teması, konu sürdürme, duyguları okuma, kibar isteme-reddetme senaryoları; sosyal öykü ve rol yönergeleriyle."}, {"e": "Çizgi Roman ile Dil", "t": "zengin_metin", "m": "Çizgi roman (comic) formatında dil-konuşma çalışması hazırla: 4-6 kareli, her karede sahne betimi ve BOŞ konuşma balonları; öğrenci balonları doldurup diyaloğu okusun. Hedef sesi/kelimeyi öyküye yay. Sade ve net kareler."}, {"e": "Prozodi & Vurgu", "t": "zengin_metin", "m": "Prozodi (ezgi-vurgu-tonlama) çalışması hazırla: soru-ünlem-düz cümle tonlaması, hece vurgusu, duyguya göre okuma (mutlu-üzgün-kızgın) alıştırmaları; işaretli metinlerle."}]}, {"grup": "🧠 Nörobilim & Psikoloji Temelli", "items": [{"e": "Bilişsel Yükü Azalt", "t": "zengin_metin", "m": "Bilişsel yük kuramına göre düzenle: gereksiz bilgiyi ayıkla, tek seferde az bilgi ver, örnekle-çözülmüş adım göster, ilgili görsel ve metni yan yana koy (bölünmüş dikkat olmasın), aşamalı ilerle. Ferah ve sade düzen."}, {"e": "Geri Getirme Pratiği", "t": "standart_soru", "m": "Geri getirme pratiği (retrieval practice) çalışması hazırla: bakmadan hatırlama soruları, boş bırak-hatırla, kısa cevaplı geri çağırma; sonda cevap anahtarıyla kendini kontrol etsin."}, {"e": "Aralıklı Tekrar", "t": "zengin_metin", "m": "Aralıklı tekrar (spaced repetition) planı + çalışma hazırla: bugün-3 gün-1 hafta-1 ay tekrar takvimi ve her tekrarda sorulacak kısa hatırlama görevleri olsun."}, {"e": "Araya Sokma (Interleaving)", "t": "zengin_metin", "m": "Araya sokma (interleaving) çalışması hazırla: birbirine yakın 2-3 konu/işlem türünü karışık sırayla sun ki öğrenci hangi yöntemi seçeceğini ayırt etsin; blok blok değil harmanlanmış olsun."}, {"e": "İkili Kodlama (Görsel+Söz)", "t": "zengin_metin", "m": "İkili kodlama (dual coding) ilkesiyle çalışma hazırla: her kavramı hem kısa metin hem ilgili görsel/şema ile birlikte ver; öğrenci kendi görselini çizeceği alanlar bırak."}, {"e": "Üstbiliş (Metacognition)", "t": "zengin_metin", "m": "Üstbilişsel çalışma hazırla: önce 'ne biliyorum/tahminim', çözüm sırasında 'hangi stratejiyi kullanıyorum', sonda 'neyi öğrendim/nerede zorlandım' öz-değerlendirme bölümleri olsun."}, {"e": "Dikkat & Odak", "t": "zengin_metin", "m": "Dikkat ve odaklanmayı destekleyen çalışma hazırla: kısa bloklar, net tek hedef, dikkat dağıtıcıdan arınmış sade sayfa, 'seçici dikkat' (hedefi bul) ve 'sürdürülen dikkat' görevleri; arada kısa mola işareti."}, {"e": "Yürütücü İşlevler", "t": "zengin_metin", "m": "Yürütücü işlevleri (planlama, çalışma belleği, ketleme, esneklik) geliştiren çalışma hazırla: plan yap-uygula-kontrol et adımları, 'dur-düşün-yap', kural değiştirme oyunları; görsel yönergelerle."}, {"e": "Çalışma Belleği", "t": "zengin_metin", "m": "Çalışma belleğini güçlendiren çalışma hazırla: giderek uzayan dizileri hatırla-tekrarla (düz ve ters), gruplama (chunking), 'gördüğünü kapat-hatırla' görevleri; kademeli zorluk."}, {"e": "Büyüme Zihniyeti", "t": "zengin_metin", "m": "Büyüme zihniyeti (growth mindset) çalışması hazırla: 'henüz' dili, hatayı öğrenme fırsatı olarak çerçeveleme, çabayı öven geri bildirim cümleleri, kişisel hedef ve ilerleme günlüğü olsun."}, {"e": "Motivasyon (Öz-Belirleme)", "t": "zengin_metin", "m": "Öz-belirleme kuramına göre motive edici çalışma hazırla: özerklik (seçim sun), yeterlik (uygun zorluk + başarı hissi) ve aidiyet (birlikte yapma) ögelerini içeren görevler olsun."}, {"e": "Duygu Düzenleme (SEL)", "t": "zengin_metin", "m": "Sosyal-duygusal öğrenme (SEL) çalışması hazırla: duyguyu tanıma-adlandırma, duygu termometresi, sakinleşme stratejileri, empati ve problem çözme senaryoları; görsel destekli."}, {"e": "Nöroçeşitlilik Dostu", "t": "zengin_metin", "m": "Nöroçeşitliliğe (otizm, DEHB, disleksi) duyarlı çalışma hazırla: net-öngörülebilir yapı, az uyaran, görsel yönerge/plan, seçenek sunma, duyusal mola; damgalamayan olumlu dil."}, {"e": "Duyusal Bütünleme", "t": "zengin_metin", "m": "Duyusal bütünlemeyi destekleyen etkinlik hazırla: dokunsal (dokun-bul), vestibüler/proprioseptif hareket molaları, görsel-işitsel eşleme; her etkinliğin amacını kısaca yaz."}, {"e": "Beyin Molası (Brain Break)", "t": "zengin_metin", "m": "Ders arasına serpiştirilecek 2-3 dakikalık beyin molası kartları hazırla: hareket, nefes, esneme, dikkat toplama oyunları; her kart için basit yönerge."}, {"e": "Hata Dostu Öğrenme", "t": "zengin_metin", "m": "Üretici hata (productive failure) çalışması hazırla: önce öğrenci kendi çözümünü denesin, sonra doğru yöntemi keşfetsin; hatayı normalleştiren, karşılaştırma yaptıran bölümler olsun."}, {"e": "Somut Biliş (Hareketle)", "t": "zengin_metin", "m": "Somutlaştırılmış biliş (embodied cognition) çalışması hazırla: kavramı elle, hareketle, nesneyle canlandırarak öğreten görevler; parmakla sayma, vücutla şekil, rol yapma gibi bedensel etkinlikler."}]}, {"grup": "🎓 Akademik & Öğretmen Araçları", "items": [{"e": "Ders Planı (Tam)", "t": "zengin_metin", "m": "Belirtilen konu ve sınıf için eksiksiz bir ders planı hazırla: kazanımlar (MEB kodlarıyla), ön koşul bilgiler, giriş-gelişme-sonuç, kullanılan yöntem-teknik, materyaller, süre dağılımı, ölçme-değerlendirme ve ödev bölümleriyle. Tablo düzeninde, uygulanabilir olsun."}, {"e": "Ünite/Yıllık Plan Taslağı", "t": "zengin_metin", "m": "Belirtilen ders için haftalara bölünmüş ünite/yıllık plan taslağı hazırla: her hafta kazanımlar, konular, etkinlikler ve değerlendirme önerileriyle tablo halinde."}, {"e": "Kazanım Değerlendirme Testi", "t": "standart_soru", "m": "Belirtilen kazanım(lar) için kazanımı doğrudan ölçen kısa bir test hazırla; her sorunun hangi kazanımı ölçtüğünü etiketle ve cevap anahtarı + kısa çözüm ekle."}, {"e": "Dereceli Puanlama (Rubrik)", "t": "zengin_metin", "m": "Belirtilen performans görevi/ürün için ayrıntılı analitik rubrik hazırla: ölçütler satırda, başarı düzeyleri (ör. 4-3-2-1) sütunda; her hücrede gözlenebilir ölçüt tanımı olsun. Toplam puan ve öz-değerlendirme satırı ekle."}, {"e": "BEP (Bireyselleştirilmiş Plan)", "t": "zengin_metin", "m": "Bir öğrenci için BEP taslağı hazırla: mevcut performans düzeyi, uzun vadeli amaç, kısa vadeli amaçlar (ölçülebilir), öğretim yöntemleri, kullanılacak materyaller, değerlendirme ölçütü ve tarih/sorumlu bölümleriyle tablo halinde."}, {"e": "Akademik Yazma Rehberi", "t": "zengin_metin", "m": "Belirtilen tür (deneme, paragraf, rapor) için akademik yazma rehberi hazırla: tez cümlesi kurma, giriş-gelişme-sonuç planı, bağlaç/geçiş ifadeleri listesi, örnek paragraf ve öz-kontrol kontrol listesi olsun."}, {"e": "Araştırma/Proje Görevi", "t": "zengin_metin", "m": "Belirtilen konu için proje tabanlı araştırma görevi hazırla: yönlendirici araştırma sorusu, alt sorular, kaynak/veri toplama adımları, ürün beklentisi, zaman çizelgesi ve değerlendirme rubriği olsun."}, {"e": "Konu Özeti + Kavram Haritası", "t": "zengin_metin", "m": "Belirtilen konunun net, akademik ama anlaşılır bir özetini çıkar; ana kavramları ve ilişkilerini gösteren bir kavram haritası (metin/şema) ekle. Sonuna anahtar terimler sözlüğü koy."}, {"e": "Cornell Not Şablonu", "t": "zengin_metin", "m": "Belirtilen konu için Cornell not tutma şablonu hazırla: sağda ana notlar, solda ipucu/anahtar sorular sütunu, altta özet bölümü. Konunun içeriğiyle örnek doldurulmuş olsun."}, {"e": "Çalışma/Sınav Stratejisi", "t": "zengin_metin", "m": "Öğrenciye bu konuyu/sınavı nasıl çalışacağını öğreten bir plan hazırla: aralıklı tekrar takvimi, geri getirme pratiği, kendini test etme, hata defteri ve sınav günü stratejileriyle."}, {"e": "Bloom Soru Bankası", "t": "standart_soru", "m": "Belirtilen konudan Bloom taksonomisinin altı düzeyi için (hatırlama→yaratma) dengeli bir soru bankası hazırla; her soruyu düzeyiyle etiketle, üst düzeye ağırlık ver, cevap/ölçütleri sonda topla."}, {"e": "Öğrenci Gelişim Raporu", "t": "zengin_metin", "m": "Bir öğrenci için dönemlik gelişim raporu hazırla: akademik, sosyal-duygusal ve davranışsal alanlarda güçlü yönler, gelişim alanları, somut örnekler ve ev/okul önerileriyle. Profesyonel ve olumlu dille yaz."}, {"e": "Veli Bilgilendirme (Akademik)", "t": "zengin_metin", "m": "Velilere yönelik, çocuğun akademik gelişimini destekleyecek somut ve uygulanabilir önerilerden oluşan bir bilgilendirme metni hazırla (evde çalışma ortamı, rutin, okuma, ödev desteği). Sıcak ve yol gösterici olsun."}, {"e": "Terapi Seans Planı (DKT)", "t": "zengin_metin", "m": "Bir dil-konuşma terapisi seansı için plan hazırla: seans hedefi, ısınma, ana etkinlik (hiyerarşik: ses→hece→sözcük→cümle→konuşma), ipucu düzeyleri, pekiştirme, ev programı ve deneme başına doğru/yanlış veri tablosu olsun."}, {"e": "Kaba Değerlendirme Formu", "t": "zengin_metin", "m": "Belirtilen alan (okuma-yazma, matematik, dil-konuşma) için kaba değerlendirme/tarama formu hazırla: beceriler maddeler halinde, 'yapabiliyor / kısmen / yapamıyor' işaretleme sütunlarıyla ve sonda özet-öneri bölümüyle."}]}, {"grup": "🗣️ Dil & Konuşma · Ek Terapi", "items": [{"e": "Sosyal Senaryo Kartları", "t": "flashcard_grid", "m": "Sosyal iletişim için kesilebilir sosyal senaryo canlandırma kartları hazırla: her kartta gerçek ve anlamlı bir günlük durum (oyuna katılma, sıra bekleme, yardım isteme, özür dileme) ve altında 'ne yaparım / ne derim' bölümü olsun. En az 6 kart, ANLAMLI içerik, doldurma/placeholder metin YOK."}, {"e": "Resimli Öykü Anlatma", "t": "zengin_metin", "m": "Anlatı (öykü) becerisi için 3-5 kareli olay sırasını doğru dizip her kareyi cümleyle anlattıran çalışma hazırla; başı-ortası-sonu ve neden-sonuç bağıyla."}, {"e": "Wh- Soruları (5N1K)", "t": "zengin_metin", "m": "Alıcı-ifade edici dil için ne-kim-nerede-ne zaman-neden-nasıl (5N1K) sorularını içeren, resim/olay betimlemeli bir çalışma hazırla; boşluk doldurmalı örneklerle."}, {"e": "Kategori & Adlandırma", "t": "eslestirme_tablosu", "m": "Kelime dağarcığı için kategoriye göre nesne adlandırma ve gruplama çalışması hazırla (meyveler, taşıtlar, hayvanlar...); görsel betimli eşleştirmelerle."}, {"e": "Zıt / Eş Anlam", "t": "eslestirme_tablosu", "m": "Kelime bilgisi için zıt ve eş anlamlı kelime eşleştirme çalışması hazırla; cevap anahtarlı."}, {"e": "İşitsel Ayırt Etme (Ses)", "t": "zengin_metin", "m": "Benzer sesleri/kelimeleri ayırt etme (aynı-farklı), hedef sesi seçme ve sıra takibi görevleriyle işitsel ayırt etme çalışması hazırla."}, {"e": "Sesletim Genelleme", "t": "zengin_metin", "m": "Hedef sesi hece → sözcük → cümle → yapılandırılmış konuşma → serbest konuşma düzeyinde kademeli genelleyen çalışma hazırla; her düzeyde bol örnek ve deneme veri tablosu olsun."}, {"e": "Nefes-Ses Egzersizi", "t": "zengin_metin", "m": "Diyafram nefesi, uzun soluk verme, sesi yumuşak başlatma ve ton/şiddet ayarı egzersizlerini adım adım içeren nefes-ses çalışması hazırla."}, {"e": "Kekemelik Akıcılık", "t": "zengin_metin", "m": "Kekemelikte akıcılığı destekleyen (yavaş-yumuşak başlangıç, uzatmalı konuşma, hece zamanlama) alıştırmaları baskı yaratmayan, cesaretlendirici bir dille adım adım hazırla."}, {"e": "Dudak/Ağız Pozisyonları", "t": "zengin_metin", "m": "Seçilen seslerin dudak/ağız (açık-kapalı-yuvarlak-yayvan) pozisyonlarını anlatan, ayna karşısında tekrar yönergeli ve o sesle kelime örnekli bir çalışma hazırla."}]}, {"grup": "🎨 Okul Öncesi · Ek Kavram", "items": [{"e": "Büyük-Küçük / Az-Çok", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "Okul öncesi için büyük-küçük, uzun-kısa, az-çok kavramlarını öğreten görsel eşleştirme ve işaretleme çalışması hazırla."}, {"e": "Konum (altında-üstünde)", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "Okul öncesi için altında-üstünde, içinde-dışında, önünde-arkasında konum kavramlarını öğreten görsel çalışma hazırla."}, {"e": "Örüntü Tamamlama", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "Okul öncesi için renk/şekil örüntüsünü tamamlama (ör. kırmızı-mavi-kırmızı-?) çalışması hazırla; kolaydan zora 6 satır."}, {"e": "Eşini Bul (Gölge)", "t": "eslestirme", "m": "Okul öncesi için nesne-gölge eşleştirme çalışması hazırla; sol sütunda nesneler, sağ sütunda karışık gölgeler."}, {"e": "Sayı-Nesne Eşleştirme", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "Okul öncesi için 1-10 arası her sayıyı o kadar nesne/emoji ile eşleştirme ve sayma çalışması hazırla."}, {"e": "Duyu Organları", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "Okul öncesi için beş duyu organını tanıtan, hangi organla ne yaptığımızı eşleştiren görsel bir kavram çalışması hazırla."}, {"e": "Mevsimler & Hava", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "Okul öncesi için mevsimleri ve hava durumlarını tanıtan, giysi-mevsim eşleştirmeli görsel çalışma hazırla."}, {"e": "İlk Ses Farkındalığı", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "Okul öncesi/okumaya hazırlık için nesnelerin ilk sesini bulma ve aynı sesle başlayanları gruplama çalışması hazırla; emoji destekli."}]}, {"grup": "🗣️ Dil & Konuşma · Uzman Set", "items": [{"e": "Sesletim Değerlendirme", "t": "zengin_metin", "m": "Bir öğrencinin sesletim (artikülasyon) düzeyini belirlemek için kaba değerlendirme formu hazırla: hedef sesler başta-ortada-sonda, 'doğru / bozuk / eksik' işaretleme sütunlarıyla; sonda profil özeti ve öneri bölümü olsun."}, {"e": "Fonolojik Süreç Analizi", "t": "zengin_metin", "m": "Sık görülen sesbilgisel süreçler (ötümlüleştirme, öndamaksıllaştırma, ünsüz düşürme, hece azaltma) için hedef kelime listesi ve süreç işaretleme tablosu hazırla; her süreç için terapi önerisi ekle."}, {"e": "Dil Örneği Alma (Anlatı)", "t": "zengin_metin", "m": "İfade edici dili değerlendirmek için resim betimleme ve öykü anlatma göreviyle dil örneği alma çalışması hazırla; ortalama söz dizisi uzunluğu (OSDU) ve kelime çeşitliliği not alanları olsun."}, {"e": "İşitsel Kapama (Closure)", "t": "zengin_metin", "m": "İşitsel kapama becerisi için eksik heceli/sesli kelimeleri tamamlama (ör. ' el__a' → elma) çalışması hazırla; görsel ipuçlarıyla, kolaydan zora."}, {"e": "Sıralı Yönerge Takibi", "t": "zengin_metin", "m": "Alıcı dil için 1, 2 ve 3 basamaklı sözel yönerge takibi görevleri hazırla (ör. 'kalemi al, sıraya koy, otur'); kademeli zorlukla ve görsel destekle."}, {"e": "Ses-Harf Birleştirme", "t": "zengin_metin", "m": "Fonolojik sentez için ayrı ayrı verilen sesleri birleştirip kelime bulma (ör. /k/-/e/-/l/ → kel) çalışması hazırla; görsel destekli, bol örnekli."}, {"e": "Konuşma Hızı & Ritim", "t": "zengin_metin", "m": "Akıcılık için konuşma hızını yavaşlatma, hece zamanlama ve ritmik okuma alıştırmaları hazırla; metronom benzeri sayaç yönergesiyle."}, {"e": "Ünlü-Ünsüz Farkındalık", "t": "zengin_metin", "m": "İlk okuma/DKT için ünlü ve ünsüz sesleri ayırt etme, ünlüyle biten-başlayan kelime bulma ve sesli okuma çalışması hazırla."}, {"e": "Betimleme (Nitelik) Kartları", "t": "flashcard_grid", "m": "Kelime dağarcığı ve betimleme için nesne kartları hazırla: her kartta bir nesne ve 'rengi, şekli, ne işe yarar, nerede bulunur' başlıklarını dolduracağı bölümler olsun. En az 8 kart."}, {"e": "Zıt Kavram Eşleştirme", "t": "eslestirme_tablosu", "m": "Kavram gelişimi için zıt kavram eşleştirme çalışması hazırla (açık-kapalı, büyük-küçük, hızlı-yavaş...); görsel betimli ve cevap anahtarlı."}, {"e": "Neden-Sonuç Konuşması", "t": "zengin_metin", "m": "Dil temelli muhakeme için neden-sonuç ilişkisi kurma çalışması hazırla: 'ne olursa ne olur' senaryoları, 'çünkü' ile cümle tamamlama ve resimden çıkarım görevleriyle."}, {"e": "Günlük Rutin Anlatımı", "t": "zengin_metin", "m": "Ardışıklık ve anlatı için günlük bir rutini (kahvaltı, okula gitme) sırayla anlattıran, 'önce-sonra-en son' bağlaçlarıyla resim destekli bir çalışma hazırla."}]}, {"grup": "🎮 Oyun, Bulmaca & Sınıf Etkinliği", "items": [{"e": "Kelime Bulmaca (Kare)", "t": "zengin_metin", "m": "Belirttiğim konudaki kelimelerden oluşan bir kelime avı (word search) bulmacası hazırla: harf karesi, aranacak kelimeler listesi ve altında cevaplar olsun."}, {"e": "Bilmece & Cevap", "t": "zengin_metin", "m": "Belirttiğim konu/kavramlar için eğlenceli bilmeceler hazırla; her bilmecenin cevabını sona ekle."}, {"e": "Doğru-Yanlış Yarışması", "t": "dogru_yanlis", "m": "Belirttiğim konudan sınıfça oynanacak 15 soruluk doğru-yanlış yarışması hazırla; cevap anahtarlı."}, {"e": "Kim Milyoner Olur", "t": "zengin_metin", "m": "Belirttiğim konudan kolaydan zora 10 çoktan seçmeli soruluk 'Kim Milyoner Olur' tarzı sınıf yarışması hazırla; cevaplar sonda olsun."}, {"e": "Tabu Kartları", "t": "flashcard_grid", "m": "Belirttiğim konudaki kavramlar için kesilebilir Tabu kartları hazırla: her kartta anlatılacak kelime ve söylenmesi yasak 3-4 kelime olsun."}, {"e": "Çengel/Eşleştirme Oyunu", "t": "eslestirme", "m": "Belirttiğim konudan kavram-tanım veya kelime-görsel eşleştirme oyunu hazırla; karışık sırayla ve cevap anahtarlı."}, {"e": "Sınıf İçi İstasyon Oyunu", "t": "zengin_metin", "m": "Belirttiğim konu için 4 istasyonlu sınıf oyunu hazırla: her istasyonda farklı bir görev, puanlama ve dönüşüm yönergesiyle."}, {"e": "Sudoku (Sayı/Şekil)", "t": "zengin_metin", "m": "Yaş grubuna uygun basit bir sayı ya da şekil sudoku bulmacası hazırla; kurallarını ve çözümünü ekle."}, {"e": "Labirent Etkinliği", "t": "zengin_metin", "m": "Konuyla ilişkili, başlangıç ve bitişi olan görsel bir labirent etkinliği (metinle/SVG betimli) hazırla; el-göz koordinasyonunu desteklesin."}, {"e": "Kelime Zinciri", "t": "zengin_metin", "m": "Bir kelimenin son sesiyle başlayan yeni kelimeler bulma (kelime zinciri) oyunu hazırla; örnek zincir ve boş halkalarla."}, {"e": "Rol Kartları (Drama)", "t": "flashcard_grid", "m": "Belirttiğim konu/senaryo için kesilebilir rol/karakter kartları hazırla; her kartta rol adı ve kısa görev/replik ipucu olsun."}, {"e": "Nokta Birleştir", "t": "zengin_metin", "m": "Konuyla ilişkili, sayıları sırayla birleştirince bir şekil çıkan 'noktaları birleştir' etkinliği (betimli) hazırla."}]}];

const SABLON_SURUM = 4;   // kütüphane büyüdükçe artar
function sablonYukle(){
  try{
    const sv=parseInt(localStorage.getItem('zirve_sablon_surum')||'0',10);
    const r=localStorage.getItem('zirve_sablonlar');
    if(r && sv>=SABLON_SURUM){ const d=JSON.parse(r); if(Array.isArray(d)&&d.length) return d; }
  }catch(e){}
  // İlk kez ya da sürüm eski → varsayılanı yükle ve damgala
  try{ localStorage.setItem('zirve_sablon_surum', String(SABLON_SURUM)); }catch(e){}
  return JSON.parse(JSON.stringify(VARSAYILAN_SABLONLAR));
}
function sablonKaydet(d){ SABLONLAR=d; try{ localStorage.setItem('zirve_sablonlar', JSON.stringify(d)); }catch(e){} }
// Şablonlar artık dağınık çipler yerine tek düğme + ızgara panelde.
// React'e BOŞ dizi veriyoruz ki eski çip yığını çizilmesin; seçiciyi biz koyuyoruz.
// (Bu katman çökerse dizi undefined kalır ve uygulama kendi eski listesini çizer — güvenli.)
let SABLONLAR = sablonYukle();
// Uygulamanın Matbaa ekranı bu diziyi okur; GERÇEK şablonları veriyoruz ki hepsi görünsün.
window.ZIRVE_SABLONLAR = SABLONLAR;

// ---------- React'in kontrol ettiği alana dışarıdan değer yazma ----------
function reactYaz(el, val){
  if(!el) return false;
  const proto = (el.tagName==='SELECT') ? window.HTMLSelectElement.prototype
              : (el.tagName==='TEXTAREA') ? window.HTMLTextAreaElement.prototype
              : window.HTMLInputElement.prototype;
  const d = Object.getOwnPropertyDescriptor(proto,'value');
  if(d && d.set) d.set.call(el, val); else el.value = val;
  el.dispatchEvent(new Event('input',{bubbles:true}));
  el.dispatchEvent(new Event('change',{bubbles:true}));
  return true;
}
function matbaaAlanlari(){
  let ta=null, sel=null;
  const tas=document.querySelectorAll('textarea');
  for(let i=0;i<tas.length;i++){ const ph=(tas[i].placeholder||'');
    if(ph.indexOf('İsteğini doğal')!==-1 || ph.indexOf('Ne üretmek istiyorsun')!==-1 || ph.indexOf('ne yapalım')!==-1 || ph.indexOf('ne üretmek')!==-1){ ta=tas[i]; break; } }
  // yine bulunamadıysa: en uzun placeholder'lı textarea materyal kutusudur
  if(!ta && tas.length){ let en=-1; for(let i=0;i<tas.length;i++){ const l=(tas[i].placeholder||'').length; if(l>en){en=l; ta=tas[i];} } }
  const sels=document.querySelectorAll('select');
  for(let i=0;i<sels.length;i++){
    const o=sels[i].querySelectorAll('option');
    for(let j=0;j<o.length;j++){ if((o[j].value||'').indexOf('Fark Etmez')!==-1){ sel=sels[i]; break; } }
    if(sel) break;
  }
  return {ta:ta, sel:sel};
}
function sablonUygula(it){
  const alan = matbaaAlanlari();
  if(alan.sel && it.t){
    let mevcut=false;
    const ops=alan.sel.querySelectorAll('option');
    for(let j=0;j<ops.length;j++) if(ops[j].value===it.t) mevcut=true;
    if(mevcut) reactYaz(alan.sel, it.t);      // listede yoksa dokunma (uygulama bozulmasın)
  }
  if(alan.ta){ reactYaz(alan.ta, it.m); try{ alan.ta.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} }
  const ov=document.getElementById('zirve-sec-ov'); if(ov) ov.style.display='none';

}

// ============================================================
//  HECE RENKLENDİRME (disleksi desteği)
//  Üretilen materyaldeki Türkçe metinleri hecelere böler,
//  heceleri sırayla renklendirir. Aç/kapa düğmesi Matbaa'ya eklenir.
// ============================================================
const HECE_RENKLERI = ['#dc2626','#2563eb','#16a34a','#d97706','#7c3aed','#0891b2'];
let HECE_AKTIF = false;
try{ HECE_AKTIF = localStorage.getItem('zirve_hece')==='1'; }catch(e){}

// Türkçe heceleme: sesli harfleri çekirdek alan basit ama sağlam kurallı bölme
const SESLI='aeıioöuüAEIİOÖUÜ';
function seslimi(c){ return SESLI.indexOf(c)!==-1; }
function heceBol(kelime){
  if(!/[a-zA-ZçğıöşüÇĞİÖŞÜ]/.test(kelime)) return [kelime];
  const c=kelime.split(''); const V=[];
  c.forEach(function(ch,i){ if(seslimi(ch)) V.push(i); });
  if(V.length<=1) return [kelime];
  const kesim=[];
  for(var k=0;k<V.length-1;k++){
    const v1=V[k], v2=V[k+1];
    const ara=v2-v1-1;          // aradaki ünsüz sayısı
    var kes;
    if(ara===0)      kes=v2;    // V | V
    else             kes=v2-1;  // V C V → V|CV ;  V CC..V → VC..|CV (son ünsüz sonraki heceye)
    kesim.push(kes);
  }
  const parca=[]; var bas=0;
  kesim.forEach(function(k){ parca.push(kelime.slice(bas,k)); bas=k; });
  parca.push(kelime.slice(bas));
  return parca.filter(function(x){ return x.length; });
}
function heceBoya(kelime){
  const h=heceBol(kelime); if(h.length<=1) return null;
  let ri=0;
  return h.map(p=>{
    if(/[a-zA-ZçğıöşüÇĞİÖŞÜ]/.test(p)){ const renk=HECE_RENKLERI[ri%HECE_RENKLERI.length]; ri++;
      return '<span style="color:'+renk+'">'+p+'</span>'; }
    return p;
  }).join('');
}
// Bir DOM düğümündeki metinleri, etiketleri bozmadan heceli renge çevir
function dugumHecele(kok){
  const yur=document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, null);
  const isler=[]; let n;
  while(n=yur.nextNode()){
    const p=n.parentNode;
    if(!p) continue;
    const tag=(p.tagName||'').toLowerCase();
    if(tag==='script'||tag==='style'||p.closest('button')||p.closest('input')||p.closest('textarea')) continue;
    if(p.dataset && p.dataset.hecelendi) continue;
    if(!/[a-zA-ZçğıöşüÇĞİÖŞÜ]{2,}/.test(n.nodeValue)) continue;
    isler.push(n);
  }
  isler.forEach(n=>{
    const kelimeler=n.nodeValue.split(/(\s+)/);
    const html=kelimeler.map(w=>{ if(/^\s+$/.test(w)||!w) return w; const b=heceBoya(w); return b||w; }).join('');
    if(html!==n.nodeValue){
      const span=document.createElement('span');
      span.dataset.hecelendi='1'; span.innerHTML=html;
      n.parentNode.replaceChild(span, n);
    }
  });
}
// Üretilen materyalin kapsayıcısını bul (yazdırılabilir çıktı alanı)
function materyalKapsayici(){
