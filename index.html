// ============================================================
const ORIG_FETCH = window.fetch.bind(window);

function urlBilgi(u){
  const m = /\/v1beta\/models\/([^:?]+)(:generateContent)?/.exec(u);
  return { model: m?m[1]:null, uretim: !!(m&&m[2]) };
}
function urlKur(u, model, key){
  return u.replace(/\/v1beta\/models\/[^:?]+/, '/v1beta/models/'+model)
          .replace(/([?&])key=[^&]*/, '$1key='+encodeURIComponent(key));
}

window.fetch = async function(input, init){
  const u = (typeof input==='string') ? input : (input && input.url) || '';
  // Bizim ilgilendiğimiz istek değilse dokunma
  if(!/generativelanguage\.googleapis\.com/.test(u)) return ORIG_FETCH(input, init);
  if(!RING.keys.length){
    toast('🔑 <b>Önce API anahtarı ekle.</b> Sağ alttaki <b>🔑 API</b> düğmesine bas, anahtarlarını yapıştır ve <b>Test Et</b>e tıkla.','red');
    return ORIG_FETCH(input, init);   // uygulamanın kendi akışı bozulmasın
  }

  const bilgi = urlBilgi(u);
  let model = MODEL || bilgi.model || 'gemini-2.5-flash';
  const denenenModeller = [model];

  // Gövde varyantları yalnızca üretim isteklerinde (POST) anlamlı
  let govdeVar = (init && init.body) ? govdeVaryantlari(model) : [ (b)=>b ];
  let vi = (CFG_OK[model]!==undefined) ? CFG_OK[model] : 0;
  let orjGovde = null;
  if(init && init.body){ try{ orjGovde = JSON.parse(init.body); }catch(e){ orjGovde=null; } }

  const modelDegistir = ()=>{
    const yeni = modelSonraki(model, denenenModeller);
    if(!yeni) return false;
    const eski = model;
    model = yeni; denenenModeller.push(yeni);
    MODEL = yeni; localStorage.setItem(LS.model, yeni);
    if(init && init.body) govdeVar = govdeVaryantlari(model);
    vi = (CFG_OK[model]!==undefined) ? CFG_OK[model] : 0;
    RING.aktif = null;
    panelYenile();
    toast(`⚡ <b>${eski}</b> kotası tüm anahtarlarda doldu → <b>${yeni}</b> modeline geçildi.<br><span style="font-weight:700;font-size:.72rem">Google'da kota her model için ayrı tutulur; taze kotayla devam ediyorsun.</span>`);
    return true;
  };

  let sonHata = null;
  const yogunSayac = {};      // model -> kaç kez 503 aldı
  let bekleme = 900;          // 503 sonrası bekleme (katlanarak artar)
  for(let deneme=0; deneme<40; deneme++){
    const key = ringPick(model);
    if(!key){
      if(modelDegistir()) continue;
      const b = ringBekleme(model);
      const msg = 'TUM_DOLU'+(b?' · en erken '+b+' sonra':'');
      toast('🚫 '+netHatasi(new Error(msg)),'red');
      sonHata = new Error(msg);
      break;
    }
    const yeniUrl = urlKur(u, model, key);
    const yeniInit = Object.assign({}, init);
    if(orjGovde){
      let g = orjGovde;
      try{ g = govdeVar[Math.min(vi,govdeVar.length-1)](orjGovde); }catch(e){ g = orjGovde; }
      yeniInit.body = JSON.stringify(g);
    }

    await rateGate();
    let r;
    try{ r = await fetchZamanAsimli(yeniUrl, yeniInit); }
    catch(e){ rateRelease(); toast('🌐 '+netHatasi(e),'red'); throw e; }
    rateRelease();

    // --- 429: anahtar değiştir, olmazsa model değiştir ---
    if(r.status===429){
      const em = await googleErr(r);
      const eskiNo = ringNo(key);
      const gunluk = ringCool(key, em, model);
      const kalan = ringHazir(model);
      RING.aktif = kalan[0] || null;
      panelYenile();
      if(RING.aktif){
        toast(`🔑 <b>${eskiNo}. anahtarın ${gunluk?'GÜNLÜK':'dakikalık'} kotası doldu</b> → <b>${ringNo(RING.aktif)}. anahtara</b> geçildi.<br><span style="font-weight:700;font-size:.72rem">Hazır anahtar: ${kalan.length}/${RING.keys.length}${gunluk?' · Günlük kota Pasifik gece yarısı sıfırlanır.':''}</span>`);
        continue;
      }
      if(modelDegistir()) continue;
      const b=ringBekleme(model);
      sonHata = new Error('TUM_DOLU'+(b?' · en erken '+b+' sonra':''));
      toast('🚫 '+netHatasi(sonHata),'red');
      break;
    }

    // --- 400: parametre uyumsuzluğu → sonraki gövde varyantı ---
    if(r.status===400 && orjGovde && vi < govdeVar.length-1){ vi++; continue; }

    // --- 503/500/502/504: Google'ın sunucusu yoğun. Anahtarla ilgisi YOK. ---
    if(r.status===503 || r.status===500 || r.status===502 || r.status===504){
      const em = await googleErr(r);
      yogunSayac[model] = (yogunSayac[model]||0)+1;
      if(yogunSayac[model] <= 3){
        const sn = Math.round(bekleme/1000);
        toast(`⏳ <b>Google tarafı yoğun (${r.status})</b> · <b>${model}</b> · ${yogunSayac[model]}/3. deneme, ${sn} sn sonra tekrar...<br><span style="font-weight:700;font-size:.72rem">Bu senin anahtarınla ilgili değil, Google'ın sunucusu geçici olarak dolu. Bekliyorum, sen bir şey yapma.</span>`);
        await new Promise(res=>setTimeout(res, bekleme));
        bekleme = Math.min(9000, Math.round(bekleme*1.8));
        continue;
      }
      if(modelDegistir()){
        bekleme = 900;
        toast(`🔁 <b>${denenenModeller[denenenModeller.length-2]}</b> yoğunluğu geçmedi → <b>${model}</b> modeli deneniyor.`);
        continue;
      }
      sonHata = new Error('HTTP '+r.status+' · '+em);
      toast('⚠️ '+netHatasi(sonHata),'red');
      return r;
    }

    if(!r.ok){
      const em = await googleErr(r);
      sonHata = new Error('HTTP '+r.status+' · '+em);
      toast('⚠️ '+netHatasi(sonHata),'red');
      return r;    // uygulamanın kendi hata akışı çalışsın
    }

    // --- Boş/kesik yanıt: düşünme modu çıktıyı yemiş olabilir ---
    if(orjGovde && bilgi.uretim){
      let d=null; try{ d = await r.clone().json(); }catch(e){}
      const cand = d && d.candidates && d.candidates[0];
      const metin = ((cand && cand.content && cand.content.parts)||[]).map(x=>x.text||'').join('').trim();
      const bitis = cand && cand.finishReason;
      // Çıktı kesildiyse bütçeyi büyüt ve tekrar dene (JSON yarıda kalmasın)
      if(bitis==='MAX_TOKENS' && orjGovde.generationConfig){
        const eskiTok = orjGovde.generationConfig.maxOutputTokens || 8192;
        if(eskiTok < 30000){
          orjGovde.generationConfig.maxOutputTokens = Math.min(32000, Math.round(eskiTok*1.7));
          if(vi < govdeVar.length-1) vi++;
          continue;
        }
      }
      if(!metin){
        const blok = d && d.promptFeedback && d.promptFeedback.blockReason;
        if(!blok && vi < govdeVar.length-1){ vi++; continue; }   // varyant değiştirip tekrar dene
        sonHata = new Error(blok ? ('SAFETY · '+blok) : ('BOŞ_YANIT'+(bitis?' · '+bitis:'')));
        toast('⚠️ '+netHatasi(sonHata),'red');
        return r;
      }
      // JSON istendiyse gerçekten ayrıştırılabiliyor mu? Değilse tekrar dene.
      const jsonIster = orjGovde.generationConfig && orjGovde.generationConfig.responseMimeType==='application/json';
      if(jsonIster){
        let temizMetin = metin.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
        let nesne=null; try{ nesne=JSON.parse(temizMetin); }catch(e){ nesne=null; }
        if(nesne===null){
          if(vi < govdeVar.length-1){ vi++; continue; }
          sonHata = new Error('KESIK_JSON');
          toast('⚠️ '+netHatasi(sonHata),'red');
          return r;
        }
        // --- Sertifika, AÇIKÇA istenmedikçe eklenmez ---
        try{
          const istek = JSON.stringify(orjGovde.contents||'');
          const sertifikaIstendi = /sertifika|başarı belgesi|basari belgesi|başarı sertifikası|takdir belgesi/i.test(istek);
          if(!sertifikaIstendi && nesne && Array.isArray(nesne.icerik_bloklari)){
            const once = nesne.icerik_bloklari.length;
            nesne.icerik_bloklari = nesne.icerik_bloklari.filter(b => !b || b.blok_tipi!=='sertifika');
            if(nesne.icerik_bloklari.length !== once && typeof Response!=='undefined'){
              const kopya = JSON.parse(JSON.stringify(d));
              kopya.candidates[0].content.parts = [{text: JSON.stringify(nesne)}];
              CFG_OK[model]=vi;
              return new Response(JSON.stringify(kopya), {status:200, headers:{'Content-Type':'application/json'}});
            }
          }
        }catch(e){}
      }
    }
    CFG_OK[model] = vi;   // çalışan varyantı hatırla
    return r;
  }
  if(sonHata) throw sonHata;
  return ORIG_FETCH(input, init);
};

function panelYenile(){
  const d=document.getElementById('zirve-key-status'); 
  const mi=document.getElementById('zirve-model');
  if(mi && document.activeElement!==mi) mi.value = MODEL;
  if(!d) return;
  const n=Date.now();
  if(!RING.keys.length){ d.innerHTML='<span style="color:#991b1b;font-weight:800">Anahtar yok</span>'; return; }
  d.innerHTML = RING.keys.map((k,i)=>{
    const c=RING.cool[coolKey(MODEL,k)]||0, dolu=c>n;
    const kalan = dolu ? Math.ceil((c-n)/60000)+' dk' : 'hazır';
    return `<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:8px;background:${dolu?'#fef2f2':'#f0fdf4'};margin-bottom:4px">

}

async function testEt(){
  const out=document.getElementById('zirve-test-out');
  const ta=document.getElementById('zirve-keys');
  ringSet(ta.value.split(/[\n,;]+/));
  RING.aktif=null; ringSave();
  if(!RING.keys.length){ out.innerHTML='<b style="color:#991b1b">Anahtar girmedin.</b>'; return; }
  out.innerHTML='⏳ Her anahtar tek tek deneniyor...';
  const satir=[]; const gecerli=[]; let modeller=null;
  for(let i=0;i<RING.keys.length;i++){
    const k=RING.keys[i];
    try{
      const list=await listModels(k);
      gecerli.push(k); if(!modeller) modeller=list;
      satir.push(`<div style="color:#166534;font-weight:700">✅ ${i+1}. anahtar geçerli · ${list.length} model erişilebilir</div>`);
    }catch(e){
      satir.push(`<div style="color:#991b1b;font-weight:700">❌ ${i+1}. anahtar: ${netHatasi(e)}</div>`);
    }
  }
  if(gecerli.length && modeller){
    KULLANILABILIR = modeller.slice();
    try{ localStorage.setItem('zirve_models', JSON.stringify(modeller)); }catch(e){}
    const havuz = modelHavuzu();
    satir.push(`<div style="color:#166534;font-weight:700">🔁 Yedek model zinciri kuruldu (${havuz.length} model): ${havuz.slice(0,4).join(' → ')}${havuz.length>4?' → …':''}</div>`);
    const secili=document.getElementById('zirve-model').value.trim();
    if(!secili || modeller.indexOf(secili)===-1){
      const iyi=enIyiModel(modeller);
      if(iyi){ MODEL=iyi; localStorage.setItem(LS.model,iyi); document.getElementById('zirve-model').value=iyi;
        satir.push(`<div style="color:#1d4ed8;font-weight:800">⚡ Model otomatik seçildi: ${iyi}</div>`); }
    } else { MODEL=secili; localStorage.setItem(LS.model,secili); }
    const dl=document.getElementById('zirve-model-list');
    if(dl) dl.innerHTML = modeller.map(m=>`<option value="${m}">`).join('');
    if(gecerli.length>=2){
      satir.push(`<div style="color:#92400e;font-weight:700;margin-top:4px">ℹ️ Not: Google'da kota <b>anahtar başına değil, PROJE başına</b>dır. Anahtarların aynı projedeyse aynı kotayı paylaşır; ayrı projelerde açarsan her biri kendi kotasını alır.</div>`);
    }
  }
  out.innerHTML = satir.join('');
  ringSave(); panelYenile();
  if(gecerli.length){
    toast(`✅ <b>${gecerli.length}/${RING.keys.length} anahtar çalışıyor · model: ${MODEL}</b><br><span style="font-weight:700;font-size:.72rem">Sayfa yenileniyor, ardından tüm AI özellikleri açık olacak.</span>`,'green');
    setTimeout(()=>location.reload(), 2200);
  }
}

// Paneli, Ayarlar sekmesindeki "TAMAM (Kaydet ve Doğrula)" düğmesinin altına yerleştirir.
function yerlestir(){
  const p=document.getElementById('zirve-panel'); if(!p) return;
  try{ sablonDugmesiYerlestir(); }catch(e){}
  try{ heceDugmeYerlestir(); }catch(e){}
  let hedef=null;
  // 1) tercih: "Kaydet ve Doğrula" / "Bağla ve Kaydet" düğmesi
  const btns=document.querySelectorAll('button');
  for(let i=0;i<btns.length;i++){
    const t=(btns[i].textContent||'');
    if(t.indexOf('Kaydet ve Doğrula')!==-1 || t.indexOf('Bağla ve Kaydet')!==-1){ hedef=btns[i]; break; }
  }
  // 2) yedek: "Gemini API Anahtarı" etiketinin bloğu (buton bulunamazsa)
  if(!hedef){
    const ls=document.querySelectorAll('label');
    for(let i=0;i<ls.length;i++){
      if((ls[i].textContent||'').indexOf('Gemini API Anahtarı')!==-1){
        let box=ls[i];
        for(let up=0; up<4 && box.parentNode; up++) box=box.parentNode;   // API bölümünün kapsayıcısı
        hedef=box; break;
      }
    }
  }
  if(!hedef){ p.style.display='none'; return; }          // Ayarlar ekranında değiliz
  if(p.previousSibling!==hedef && hedef.parentNode){
    hedef.parentNode.insertBefore(p, hedef.nextSibling);
  }
  p.style.display='block';
}

(function(){

// ==== GÜVENLİK AĞI: Herhangi bir render hatasında UYGULAMA KOMPLE ÇIKMASIN ====
// Bozuk/eksik blok gelse bile ekran beyaz kalmaz; nazik bir hata kutusu gösterip
// kullanıcının çalışmaya devam etmesini sağlar.
class HataSiniri extends React.Component {
  constructor(props){ super(props); this.state = { hata: false, mesaj: '' }; }
  static getDerivedStateFromError(err){ return { hata: true, mesaj: (err && err.message) ? err.message : 'Beklenmeyen bir sorun oluştu.' }; }
  componentDidCatch(err, info){ try{ console.error('Yakalanan hata:', err, info); }catch(e){} }
  render(){
    if(this.state.hata){
      const geri = this.props.onReset;
      return (
        <div className="max-w-xl mx-auto my-8 bg-white border-2 border-red-200 rounded-2xl p-6 shadow-lg text-center no-print">
          <div className="text-4xl mb-2">🛟</div>
          <h3 className="text-lg font-black text-red-700 mb-1">Bu çıktı görüntülenirken bir sorun oldu</h3>
          <p className="text-sm text-gray-600 mb-4">Uygulama kapanmadı, güvendesin. Çoğu zaman <b>“Yeniden Üret”</b> ya da isteği biraz sadeleştirmek sorunu çözer.</p>
          <div className="flex gap-2 justify-center flex-wrap">
            <button onClick={()=>{ this.setState({hata:false, mesaj:''}); if(typeof geri==='function') geri(); }} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-bold text-sm"><i className="fa-solid fa-arrow-left mr-1"></i> Geri Dön</button>
            <button onClick={()=>{ this.setState({hata:false, mesaj:''}); }} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg font-bold text-sm">Tekrar Dene</button>
          </div>
          {this.state.mesaj && <p className="text-[10px] text-gray-400 mt-3 break-all">{String(this.state.mesaj).slice(0,160)}</p>}
        </div>
      );
    }
    return this.props.children;
  }
}

const htmlIceriyorMu = (t) => /<(strong|em|b|i|mark|span|u|br)\b|&lt;(strong|em|b|i|mark|span)/i.test(String(t || ''));
// ── LATEX/SEMBOL TEMİZLEYİCİ: $\rightarrow$ gibi sızıntıları Unicode'a çevirir (ekran + PDF okunaklı) ──
const ZIRVE_latexTemizle = (str) => {
  if (!str) return str;
  let s = String(str);
  if (s.indexOf('\\') === -1 && s.indexOf('$') === -1 && s.indexOf('^') === -1) return s;
  s = s.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '$1/$2');
  s = s.replace(/\\(?:text|mathrm|mathbf|mathit|operatorname|mbox)\s*\{([^{}]*)\}/g, '$1');
  const H = [
    [/\\Rightarrow/g,'⇒'],[/\\Leftarrow/g,'⇐'],[/\\leftrightarrow/g,'↔'],
    [/\\longrightarrow/g,'→'],[/\\rightarrow/g,'→'],[/\\to\b/g,'→'],
    [/\\leftarrow/g,'←'],[/\\uparrow/g,'↑'],[/\\downarrow/g,'↓'],
    [/\\times/g,'×'],[/\\cdot/g,'·'],[/\\div/g,'÷'],[/\\pm/g,'±'],[/\\mp/g,'∓'],
    [/\\leq/g,'≤'],[/\\geq/g,'≥'],[/\\neq/g,'≠'],[/\\approx/g,'≈'],[/\\equiv/g,'≡'],
    [/\\infty/g,'∞'],[/\\theta/g,'θ'],[/\\alpha/g,'α'],[/\\beta/g,'β'],[/\\pi/g,'π'],
    [/\\Delta/g,'Δ'],[/\\sum/g,'Σ'],[/\\sqrt/g,'√'],[/\\circ/g,'°'],[/\\degree/g,'°'],
    [/\\%/g,'%'],[/\\&/g,'&'],[/\\_/g,'_'],[/\\#/g,'#'],[/\\,/g,' '],[/\\;/g,' ']
  ];
  H.forEach(function(p){ s = s.replace(p[0], p[1]); });
  s = s.replace(/\^\{?\s*2\s*\}?/g, '²').replace(/\^\{?\s*3\s*\}?/g, '³');
  s = s.replace(/\\\(([\s\S]*?)\\\)/g, '$1').replace(/\\\[([\s\S]*?)\\\]/g, '$1');
  s = s.replace(/\$\$([\s\S]*?)\$\$/g, '$1');
  s = s.replace(/\$([^$\n]{0,80})\$/g, function(m, inner){ return /[→←⇒⇐↔↑↓×·÷±∓≤≥≠≈≡∞πθαβΔΣ√°²³\\^_]/.test(inner) ? inner : m; });
  return s;
};
// ── WHATSAPP BİÇİMLENDİRİCİ: HTML/Markdown'ı WhatsApp biçimine çevirir (*kalın*, _italik_, • madde) ──
const ZIRVE_whatsappBicim = (girdi) => {
  let s = ZIRVE_latexTemizle(String(girdi || ''));
  s = s.replace(/<\s*h[1-6][^>]*>/gi, '\n*').replace(/<\s*\/\s*h[1-6]\s*>/gi, '*\n');
  s = s.replace(/<\s*(strong|b)\s*[^>]*>/gi, '*').replace(/<\s*\/\s*(strong|b)\s*>/gi, '*');
  s = s.replace(/<\s*(em|i)\s*[^>]*>/gi, '_').replace(/<\s*\/\s*(em|i)\s*>/gi, '_');
  s = s.replace(/<\s*li[^>]*>/gi, '\n• ').replace(/<\s*\/\s*li\s*>/gi, '');
  s = s.replace(/<\s*br\s*\/?\s*>/gi, '\n').replace(/<\s*\/\s*(p|div|tr|h[1-6])\s*>/gi, '\n');
  s = s.replace(/<[^>]+>/g, '');
  s = s.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&hellip;/g, '…');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '*$1*');
  s = s.replace(/(^|\n)\s{0,3}#{1,6}\s*(.+)/g, '$1*$2*');
  s = s.replace(/(^|\n)\s*[-–]\s+/g, '$1• ');
  s = s.replace(/`([^`]+)`/g, '$1');
  s = s.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  return s;
};
try { if (typeof window !== 'undefined') { window.ZIRVE = window.ZIRVE || {}; window.ZIRVE.latexTemizle = ZIRVE_latexTemizle; window.ZIRVE.whatsappBicim = ZIRVE_whatsappBicim; } } catch(e){}

const HtmlMetin = ({ metin, className }) => {
  const s = ZIRVE_latexTemizle(String(metin || ''));
  if (!htmlIceriyorMu(s)) return <span className={className}>{s}</span>;
  let temiz = s.replace(/<\s*script[^>]*>[\s\S]*?<\s*\/\s*script>/gi, '').replace(/on\w+\s*=\s*"[^"]*"/gi, '').replace(/on\w+\s*=\s*'[^']*'/gi, '');
  return <span className={className} dangerouslySetInnerHTML={{ __html: temiz }}></span>;
};

function lisansHash(str){
  let h1 = 5381, h2 = 52711; const s = String(str);
  for (let i=0;i<s.length;i++){ const c = s.charCodeAt(i); h1 = (((h1<<5)+h1) ^ c) >>> 0; h2 = (((h2<<5)+h2) + c*7) >>> 0; }
  const n = (h1 ^ h2) >>> 0; const harfler = 'ABCDEFGHJKLMNPRSTUVYZ23456789';
  let out = '', x = n;
  for (let i=0;i<6;i++){ out += harfler[x % harfler.length]; x = Math.floor(x/harfler.length) + 13; }
  return out.slice(0,3) + '-' + out.slice(3,6);
}

// ── ŞIK TEKRARINI ÖNLE (PDF/çıktı düzeltmesi) ───────────────────────────────
// Yapay zekâ şıkları bazen HEM soru_metni'nin içine gömer HEM de secenekler dizisine
// koyar. Ekranda tolere edilse de A4 PDF'te ikisi ayrı satıra düşünce şıklar İKİ KEZ
// görünür. secenekler doluysa soru metnindeki gömülü şıkları güvenle ayıklıyoruz.
const ZIRVE_soruMetniTemizle = (metin, secenekler) => {
    if (!metin) return metin;
    if (!Array.isArray(secenekler) || secenekler.filter(x => x && String(x).trim()).length < 2) return metin;
    let s = String(metin);
    const isaret = /[\(\[]?\s*[A-Ea-e]\s*[\)\].:\-]\s/g; // A) A. A- A: (a) biçimleri
    // 1) Tamamen şık olan satırları at (ör. bir satırda "A) sa")
    s = s.split(/\r?\n/).filter(l => !/^\s*[\(\[]?\s*[A-Ea-e]\s*[\)\].:\-]\s*\S/.test(l)).join('\n');
    // 2) Aynı satıra dizilmiş şıkları kes ("...ba A) sa B) se C) so" → "...ba")
    if ((s.match(isaret) || []).length >= 2) {
        const ilk = s.search(/[\(\[]?\s*[A-Ea-e]\s*[\)\].:\-]\s/);
        if (ilk > 0) {
            const kuyruk = s.slice(ilk);
            if ((kuyruk.match(isaret) || []).length >= 2) s = s.slice(0, ilk);
        }
    }
    s = s.replace(/[\s\-–—:]+$/, '').trim();
    return s || String(metin); // her ihtimale karşı soru metnini tamamen boşaltma
};
try { if (typeof window !== 'undefined') { window.ZIRVE = window.ZIRVE || {}; window.ZIRVE.soruMetniTemizle = ZIRVE_soruMetniTemizle; } } catch(e){}

// ── (EK) Çıktıyı düz metne çevir → Kopyala / Prompta geri ekle ──
const matbaaMetneCevir = (res) => {
    if (!res) return '';
    const S = (x) => (x == null ? '' : String(x)).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const L = [];
    if (res.dokuman_basligi) L.push('# ' + S(res.dokuman_basligi));
    if (res.alt_baslik) L.push(S(res.alt_baslik));
    (res.icerik_bloklari || []).forEach((b, i) => {
        if (!b) return;
        L.push('');
        if (b.baslik) L.push('## ' + S(b.baslik));
        if (b.icerik_metni) L.push(S(b.icerik_metni));
        if (b.html_icerik) L.push(S(b.html_icerik));
        if (b.merkez_kavram) L.push('Merkez: ' + S(b.merkez_kavram));
        if (b.soru_metni) L.push((i + 1) + ') ' + S(ZIRVE_soruMetniTemizle(b.soru_metni, b.secenekler)));
        if (Array.isArray(b.secenekler) && b.secenekler.length) b.secenekler.forEach((s, j) => L.push('   ' + (['A','B','C','D','E','F'][j] || '-') + ') ' + S(s)));
        if (Array.isArray(b.sol_sutun) && b.sol_sutun.length) L.push('Sol: ' + b.sol_sutun.map(S).join(', '));
        if (Array.isArray(b.sag_sutun_karisik) && b.sag_sutun_karisik.length) L.push('Sağ (karışık): ' + b.sag_sutun_karisik.map(S).join(', '));
        if (Array.isArray(b.kartlar) && b.kartlar.length) b.kartlar.forEach(k => L.push('Kart: ' + S(k.on_yuz) + ' → ' + S(k.arka_yuz)));
        if (b.cevap_anahtari) L.push('✔ Cevap: ' + S(b.cevap_anahtari));
    });
    return L.join('\n').replace(/\n{3,}/g, '\n\n').trim();
};

const promptSorunlari = (metin) => {
    const t = String(metin || '');
    if (!t.trim()) return [];
    const kurallar = [
        { re: /(yandaki|aşağıdaki|yukarıdaki|verilen|soldaki|sağdaki)\s*(resim|resme|resmi|görsel|görsele|görseldeki|fotoğraf|fotograf|şekle bak|şekildeki resim)/i, kotu: 'var olmayan bir resme/görsele atıf', oneri: 'nesnenin adını ya da emojisini yaz (örn: 🍎 elma) veya "SVG şekil çiz" de' },
        { re: /(resim|resmi|fotoğraf|fotograf|illüstrasyon|illustrasyon)\s*(çiz|çizin|ekle|oluştur|üret|bul|koy|yerleştir)/i, kotu: 'gerçek resim/fotoğraf üretimi (yapay zeka çizemez)', oneri: 'basit "inline SVG şekil" veya "çizgi çalışması" iste' },
        { re: /(boyama sayfası|karmaşık çizim|detaylı çizim|gerçekçi çizim|realistik)/i, kotu: 'karmaşık/gerçekçi çizim', oneri: 'basit SVG şekil, çizgi çalışması ya da emoji etkinliği iste' },
        { re: /(sesli|dinlet|şarkı söyle|müzik çal|video|animasyon|hareketli resim|hareketli görsel|\bgif\b)/i, kotu: 'ses/video/animasyon (çıktı yalnızca metin + basit görsel)', oneri: 'şarkı sözü / metin / yönerge olarak iste' },
        { re: /(qr kod|karekod|barkod)/i, kotu: 'QR / barkod üretimi', oneri: 'QR yerine düz bağlantı ya da metin yaz' },
        { re: /\b([3-9]\d|\d{3,})\s*(soru|madde|sayfa)\b/i, kotu: 'tek seferde çok büyük miktar (yanıt yarıda kesilebilir)', oneri: 'en fazla ~20-25 madde iste; gerisi için "devam" yaz' },
    ];
    const bulunan = [];
    kurallar.forEach(k => { const m = t.match(k.re); if (m && !bulunan.some(x => x.kotu === k.kotu)) bulunan.push({ eslesme: m[0], kotu: k.kotu, oneri: k.oneri }); });
    return bulunan;
};

</div>

<div className="bg-gradient-to-r from-green-600 to-teal-700 rounded-2xl shadow-lg p-6 md:p-8 text-white relative overflow-hidden mt-6">

<!-- ===== ZİRVE · QR ile Paylaş modülü (vanilla, çerçeveden bağımsız) ===== -->
<script>
(function(){
  "use strict";
  function qrToast(msg){ try{ var t=document.createElement('div'); t.textContent=msg; t.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font:700 13px system-ui;z-index:100000;box-shadow:0 6px 20px rgba(0,0,0,.3)'; document.body.appendChild(t); setTimeout(function(){ t.remove(); },2200);}catch(e){} }
  function qrKutuphane(cb){
    if(window.qrcode){ cb(); return; }
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
    s.onload=function(){ cb(); };
    s.onerror=function(){ qrToast('QR kütüphanesi yüklenemedi (internet?).'); };
    document.head.appendChild(s);
  }
  window.ZIRVE_paylasAc=function(ozelUrl){
    var url = ozelUrl || (window.ZIRVE_PAYLAS && window.ZIRVE_PAYLAS.url) || window.location.href;
    if(/^file:/.test(url)){ qrToast('Bu dosya bilgisayarda açık (file://). QR paylaşımı için önce GitHub Pages gibi bir adrese yükle.'); }
    qrKutuphane(function(){
      try{
        var eski=document.getElementById('zirve-qr-modal'); if(eski) eski.remove();
        var qr=window.qrcode(0,'M'); qr.addData(url); qr.make();
        var img=qr.createImgTag(6,12);
        var ov=document.createElement('div');
        ov.id='zirve-qr-modal';
        ov.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.75);backdrop-filter:blur(3px);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px';
        ov.innerHTML='<div style="background:#fff;border-radius:18px;max-width:340px;width:100%;padding:18px;text-align:center;font-family:system-ui;box-shadow:0 20px 60px rgba(0,0,0,.4)">'
          +'<div style="font-weight:900;font-size:15px;color:#0f172a;margin-bottom:4px">📲 QR ile Paylaş</div>'
          +'<div style="font-size:11px;color:#64748b;margin-bottom:12px">Telefonla okut, uygulama anında açılsın.</div>'
          +'<div id="zirve-qr-img" style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;display:inline-block">'+img+'</div>'
          +'<div style="font-size:10px;color:#94a3b8;word-break:break-all;margin:10px 0 12px">'+url+'</div>'
          +'<div style="display:flex;gap:8px">'
          +'<button id="zirve-qr-kopya" style="flex:1;background:#4f46e5;color:#fff;border:none;border-radius:10px;padding:10px;font-weight:800;cursor:pointer;font-size:12px">🔗 Linki kopyala</button>'
          +'<button id="zirve-qr-png" style="flex:1;background:#059669;color:#fff;border:none;border-radius:10px;padding:10px;font-weight:800;cursor:pointer;font-size:12px">🖼️ PNG indir</button>'
          +'</div>'
          +'<button id="zirve-qr-kapat" style="margin-top:10px;background:#f1f5f9;color:#334155;border:none;border-radius:10px;padding:9px;font-weight:800;cursor:pointer;font-size:12px;width:100%">Kapat</button>'
          +'</div>';
        document.body.appendChild(ov);
        ov.addEventListener('click',function(e){ if(e.target===ov) ov.remove(); });
        document.getElementById('zirve-qr-kapat').onclick=function(){ ov.remove(); };
        document.getElementById('zirve-qr-kopya').onclick=function(){ try{ navigator.clipboard.writeText(url).then(function(){qrToast('🔗 Link kopyalandı.');},function(){qrToast('Kopyalanamadı.');}); }catch(e){ qrToast('Kopyalanamadı.'); } };
        document.getElementById('zirve-qr-png').onclick=function(){
          try{
            var imgEl=document.querySelector('#zirve-qr-img img'); if(!imgEl){ qrToast('Görsel bulunamadı.'); return; }
            var c=document.createElement('canvas'); var boyut=520; c.width=boyut; c.height=boyut;
            var ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,boyut,boyut);
            var tmp=new Image();
            tmp.onload=function(){ var m=40; ctx.imageSmoothingEnabled=false; ctx.drawImage(tmp,m,m,boyut-2*m,boyut-2*m); var a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download='paylasim-qr.png'; a.click(); qrToast('🖼️ QR indirildi.'); };
            tmp.src=imgEl.src;
          }catch(e){ qrToast('PNG oluşturulamadı.'); }
        };
      }catch(e){ qrToast('QR oluşturulamadı.'); }
    });
  };
  // Silik yüzer pill (× ile kalıcı gizlenir)
  function pilliKur(){
    try{
      if(localStorage.getItem('zirve_qr_pill_gizli')==='1') return;
      if(document.getElementById('zirve-qr-pill')) return;
      var w=document.createElement('div');
      w.id='zirve-qr-pill';
      w.style.cssText='position:fixed;bottom:96px;left:12px;z-index:9996;display:flex;align-items:center;gap:4px;background:rgba(79,70,229,.92);color:#fff;border-radius:999px;padding:7px 10px;font:800 12px system-ui;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:.55;cursor:pointer';
      w.onmouseenter=function(){ w.style.opacity='1'; }; w.onmouseleave=function(){ w.style.opacity='.55'; };
      var b=document.createElement('span'); b.textContent='📲 QR'; b.onclick=function(){ window.ZIRVE_paylasAc(); };
      var x=document.createElement('span'); x.textContent='×'; x.title='Gizle'; x.setAttribute('data-zirve-nodrag','1'); x.style.cssText='margin-left:2px;font-weight:900;opacity:.8'; x.onclick=function(ev){ ev.stopPropagation(); try{localStorage.setItem('zirve_qr_pill_gizli','1');}catch(e){} w.remove(); };
      w.appendChild(b); w.appendChild(x);
      document.body.appendChild(w);
    }catch(e){}
  }
  window.ZIRVE_qrPillGeri=function(){ try{ localStorage.removeItem('zirve_qr_pill_gizli'); }catch(e){} pilliKur(); };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', pilliKur); else pilliKur();
})();
</script>
<!-- ===== ZİRVE · Yüzen düğmeleri SÜRÜKLE + gizle/geri getir ===== -->
<script>
(function(){
  "use strict";
  var IDLER=['zirve-asistan-btn','zirve-qr-pill','zirve-ekran-pill'];
  function key(id){ return 'zirve_pos_'+id; }
  function uygulaKayitli(el,id){ try{ var r=localStorage.getItem(key(id)); if(r){ var p=JSON.parse(r); if(p&&typeof p.left==='number'){ el.style.left=p.left+'px'; el.style.top=p.top+'px'; el.style.right='auto'; el.style.bottom='auto'; } } }catch(e){} }
  function suruklenebilir(el,id){
    if(!el||el.__zirveDrag) return; el.__zirveDrag=true; uygulaKayitli(el,id);
    var sx,sy,ox,oy,drag=false,moved=false;
    function down(e){
      if(e.target && e.target.closest && e.target.closest('[data-zirve-nodrag]')) return;
      var pt=e.touches?e.touches[0]:e; drag=true; moved=false;
      var r=el.getBoundingClientRect(); ox=r.left; oy=r.top; sx=pt.clientX; sy=pt.clientY;
      el.style.left=ox+'px'; el.style.top=oy+'px'; el.style.right='auto'; el.style.bottom='auto'; el.style.transition='none';
      document.addEventListener('mousemove',move,{passive:false}); document.addEventListener('touchmove',move,{passive:false});
      document.addEventListener('mouseup',up); document.addEventListener('touchend',up);
    }
    function move(e){
      if(!drag) return; var pt=e.touches?e.touches[0]:e; var dx=pt.clientX-sx, dy=pt.clientY-sy;
      if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
      var w=el.offsetWidth||40, h=el.offsetHeight||40;
      var nl=Math.min(window.innerWidth-w,Math.max(0,ox+dx)); var nt=Math.min(window.innerHeight-h,Math.max(0,oy+dy));
      el.style.left=nl+'px'; el.style.top=nt+'px'; if(e.cancelable) e.preventDefault();
    }
    function up(){
      drag=false; el.style.transition='';
      document.removeEventListener('mousemove',move); document.removeEventListener('touchmove',move);
      document.removeEventListener('mouseup',up); document.removeEventListener('touchend',up);
      if(moved){ try{ var r=el.getBoundingClientRect(); localStorage.setItem(key(id),JSON.stringify({left:Math.round(r.left),top:Math.round(r.top)})); }catch(e){} el.__zirveMoved=true; setTimeout(function(){ el.__zirveMoved=false; },60); }
    }
    el.addEventListener('mousedown',down); el.addEventListener('touchstart',down,{passive:true});
    el.addEventListener('click',function(e){ if(el.__zirveMoved){ e.stopPropagation(); e.preventDefault(); } },true);
    el.style.cursor='grab'; el.style.touchAction='none';
  }
  window.ZIRVE_yuzenYap=suruklenebilir;
  window.ZIRVE_dragTara=function(){ IDLER.forEach(function(id){ var el=document.getElementById(id); if(el) suruklenebilir(el,id); }); };
  window.ZIRVE_kontrolleriGeriGetir=function(){
    try{ localStorage.removeItem('zirve_asistan_gizli'); localStorage.removeItem('zirve_qr_pill_gizli'); localStorage.removeItem('zirve_ekran_pill_gizli'); }catch(e){}
    IDLER.forEach(function(id){ try{ localStorage.removeItem(key(id)); }catch(e){} var el=document.getElementById(id); if(el){ el.style.left=''; el.style.top=''; el.style.right=''; el.style.bottom=''; } });
    try{ window.dispatchEvent(new Event('zirve-asistan-geri')); }catch(e){}
    try{ if(window.ZIRVE_qrPillGeri) window.ZIRVE_qrPillGeri(); }catch(e){}
    try{ var t=document.createElement('div'); t.textContent='🧲 Yüzen düğmeler geri getirildi ve konumları sıfırlandı.'; t.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font:700 13px system-ui;z-index:100000'; document.body.appendChild(t); setTimeout(function(){t.remove();},2200); }catch(e){}
    setTimeout(window.ZIRVE_dragTara,300);
  };
  var n=0; var iv=setInterval(function(){ window.ZIRVE_dragTara(); if(++n>25) clearInterval(iv); },500);
  if(document.readyState!=='loading') window.ZIRVE_dragTara(); else document.addEventListener('DOMContentLoaded',window.ZIRVE_dragTara);
  try{ new MutationObserver(function(){ window.ZIRVE_dragTara(); }).observe(document.body,{childList:true,subtree:true}); }catch(e){}
})();
</script>
