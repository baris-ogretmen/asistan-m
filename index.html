<!-- ===== ZİRVE KATMANI · API + 124 şablon + hece renklendirme ===== -->
<script>
/* ============================================================
   ZİRVE API KATMANI  ·  çoklu anahtar + otomatik model + teşhis
   Uygulamanın kendi kodu DEĞİŞTİRİLMEDİ. Bu katman fetch'i sarar;

   ── ZİRVE İLKESİ (kalıcı kural) ──────────────────────────────
   Bir çalışma / blok / cevap TAM üretilemiyorsa ASLA sessizce
   boş bırakılmaz. Nedeni her zaman kullanıcıya açıkça gösterilir:
   - Görsel gerektiği için mi? (AI resim üretemez → emoji/ad kullan)
   - Sağ sütun/şık eksik mi? → uyarı + "Tekrar Üret" önerisi
   - API/kota/model hatası mı? → gerçek sebep Türkçe gösterilir
   Hem prompt (AI'ya) hem render (ekranda) bu ilkeyi uygular.
   ────────────────────────────────────────────────────────────
   generativelanguage.googleapis.com'a giden her isteği yakalar,
   anahtarı/modeli kendisi seçer, kota dolunca devreye girer.
   ============================================================ */
(function(){
"use strict";

// ---------- Depolama ----------
const LS = { keys:'zirve_keys', cool:'zirve_keycool', model:'gemini_model_name', rpm:'zirve_rpm', legacy:'gemini_api_key' };
const RING = { keys:[], cool:{}, aktif:null };
let MODEL = localStorage.getItem(LS.model) || 'gemini-2.5-flash';
let RPM = parseInt(localStorage.getItem(LS.rpm)||'8',10);

// Kotası kapanmış eski modelleri otomatik yükselt
const OLU_MODELLER = ['gemini-2.0-flash','gemini-2.0-flash-lite','gemini-1.5-flash','gemini-1.5-pro','gemini-pro'];
if (OLU_MODELLER.indexOf(MODEL) !== -1) { MODEL = 'gemini-2.5-flash'; localStorage.setItem(LS.model, MODEL); }
// Lite modeli materyal üretiminde zayıf kalıyor (tekrar/boş şık) → otomatik sağlam modele çevir
if (/lite/.test(MODEL)) { MODEL = 'gemini-2.5-flash'; try{ localStorage.setItem(LS.model, MODEL); }catch(e){} }

function ringSet(list){ RING.keys = list.map(x=>String(x||'').trim()).filter(k=>k.length>8); }
/* ═══════════════════════════════════════════════════════════════
   🔑 GÖMÜLÜ ANAHTARLAR — BİR KEZ BURAYA YAZ, HER DOSYADA OTOMATİK GELSİN
   Barış: 10 anahtarını aşağıdaki listeye tırnak içinde, virgülle ekle.
   Örnek:  const GOMULU_ANAHTARLAR = ["AIzaSy_ANAHTAR1", "AIzaSy_ANAHTAR2"];
   Boş bırakırsan uygulama Ayarlar'dan girdiğin anahtarları kullanır.
   Bir kez doldurup bu katmanı kopyalarsan artık her çalışmada anahtar hazır olur.
═══════════════════════════════════════════════════════════════ */
const GOMULU_ANAHTARLAR = [
  // "AIzaSy_BURAYA_1",
  // "AIzaSy_BURAYA_2",
];
function ringLoad(){
  try{ const r=localStorage.getItem(LS.keys); if(r) ringSet(JSON.parse(r)); }catch(e){}
  if(!RING.keys.length){ const eski=localStorage.getItem(LS.legacy); if(eski) ringSet([eski]); }
  // Gömülü anahtarlar varsa ve henüz hiç anahtar yoksa onları yükle (bir kez yaz, hep gelsin)
  if(!RING.keys.length && GOMULU_ANAHTARLAR && GOMULU_ANAHTARLAR.length){
    const temiz = GOMULU_ANAHTARLAR.map(k=>String(k||'').trim()).filter(k=>k.length>10);
    if(temiz.length){ ringSet(temiz); try{ ringSave(); }catch(e){} }
  }
  try{ const c=localStorage.getItem(LS.cool); if(c) RING.cool=JSON.parse(c); }catch(e){}
}
function ringSave(){
  try{
    localStorage.setItem(LS.keys, JSON.stringify(RING.keys));
    localStorage.setItem(LS.cool, JSON.stringify(RING.cool));
    // Uygulamanın kendi kontrolü (if(!apiKey) return) için ilk anahtarı eski yere de yaz
    if(RING.keys[0]) localStorage.setItem(LS.legacy, RING.keys[0]);
  }catch(e){}
}
// Kota Google'da MODEL BAZINDA tutulur → dinlenme kaydı "model|anahtar"
function coolKey(m,k){ return (m||'?')+'|'+k; }
function ringHazir(m){ const n=Date.now(); return RING.keys.filter(k=>!(RING.cool[coolKey(m,k)]>n)); }
function ringPick(m){
  const h=ringHazir(m); if(!h.length) return null;
  if(RING.aktif && h.indexOf(RING.aktif)!==-1) return RING.aktif;
  RING.aktif=h[0]; return RING.aktif;
}
function ringNo(k){ return RING.keys.indexOf(k)+1; }
function ringCool(key, mesaj, m){
  const gunluk = /per day|PerDay|daily|GenerateRequestsPerDay/i.test(String(mesaj||''));
  let ms = 70000;                                  // dakikalık kota → ~70 sn
  if(gunluk){                                      // günlük kota → Pasifik gece yarısına kadar
    const now=new Date();
    const pt=new Date(now.toLocaleString('en-US',{timeZone:'America/Los_Angeles'}));
    const mid=new Date(pt); mid.setHours(24,0,0,0);
    ms=Math.max(60000, mid-pt);
  }
  RING.cool[coolKey(m,key)] = Date.now()+ms; ringSave();
  return gunluk;
}
function ringBekleme(m){
  const n=Date.now(); let en=Infinity;
  RING.keys.forEach(k=>{ const c=RING.cool[coolKey(m,k)]||0; if(c>n) en=Math.min(en,c-n); });
  if(en===Infinity) return '';
  const dk=Math.ceil(en/60000);
  return dk>60 ? Math.ceil(dk/60)+' saat' : dk+' dakika';
}

// ---------- Yedek model zinciri ----------
// Tercih sırası (hızlı/bol kotalı → yavaş/kısıtlı). Test Et'e basınca anahtarının
// GERÇEKTEN erişebildiği modeller öğrenilir ve zincir ona göre kurulur; böylece
// var olmayan bir model adına düşmeyiz.
const MODEL_TERCIH = [
  "gemini-2.5-flash-lite", "gemini-flash-lite-latest",
  "gemini-2.5-flash", "gemini-flash-latest",
  "gemini-2.0-flash-lite", "gemini-2.0-flash",
  "gemini-2.5-pro", "gemini-pro-latest"
];
let KULLANILABILIR = [];
try{ const r=localStorage.getItem('zirve_models'); if(r) KULLANILABILIR=JSON.parse(r)||[]; }catch(e){}

function modelHavuzu(){
  if(!KULLANILABILIR.length) return MODEL_TERCIH.slice();
  const havuz = MODEL_TERCIH.filter(m => KULLANILABILIR.indexOf(m)!==-1);
  // Listede olup tercihimizde olmayan flash modelleri de sona ekle (yeni çıkanlar için)
  KULLANILABILIR.forEach(m=>{
    if(havuz.indexOf(m)===-1 && /flash/.test(m) && !/thinking|exp|8b/.test(m)) havuz.push(m);
  });
  return havuz.length ? havuz : MODEL_TERCIH.slice();
}
function modelSonraki(simdiki, denenenler){
  return modelHavuzu().find(m => m!==simdiki && denenenler.indexOf(m)===-1) || null;
}

// ---------- Hız sınırlayıcı (kotayı boşa harcamamak için) ----------
const RL = { calisan:0, maxEs:2, gecmis:[] };
function rpmLimit(){ return RPM; }
async function rateGate(){
  while(true){
    const n=Date.now();
    RL.gecmis = RL.gecmis.filter(t=>n-t<60000);
    if(RL.calisan<RL.maxEs && RL.gecmis.length<rpmLimit()){ RL.calisan++; RL.gecmis.push(n); return; }
    await new Promise(r=>setTimeout(r,250));
  }
}
function rateRelease(){ RL.calisan=Math.max(0,RL.calisan-1); }

// ---------- Model ailesine göre generationConfig düzeltmeleri ----------
function aile(m){
  m=String(m||'');
  if(/gemini-3|gemini-flash-latest|gemini-flash-lite-latest|-latest$/.test(m)) return 'yeni';   // thinkingLevel ister
  if(/2\.5-(flash|flash-lite)/.test(m)) return 'flash25';                                       // thinkingBudget ister
  if(/pro/.test(m)) return 'pro';
  return 'diger';
}
// Gövde dönüşümleri: sırayla denenir, çalışan hatırlanır.
// ASIL ARIZA: Gemini 2.5+ modellerde "düşünme modu" varsayılan AÇIK. responseMimeType:json ve
// maxOutputTokens:16000 ile istek atılınca bütçe düşünmeye gidiyor, JSON YARIDA KESİLİYOR,
// uygulamanın JSON.parse'ı patlıyor ve hata catch{} ile yutulduğu için ekranda hiçbir şey olmuyor.
// Aşağıdaki varyantlar düşünmeyi kapatır/asgariye indirir.
function govdeVaryantlari(m){
  const f=aile(m);
  const temiz=(b)=>{ const c=JSON.parse(JSON.stringify(b)); if(c.generationConfig){ delete c.generationConfig.thinkingConfig; } return c; };
  const dusunme=(b,cfg)=>{ const c=temiz(b); c.generationConfig=Object.assign({}, c.generationConfig, {thinkingConfig:cfg}); return c; };
  // SON ÇARE: responseSchema'yı at. Şema devasa olduğunda model bazen tıkanıyor;
  // uygulamanın promptu istenen JSON biçimini zaten ayrıntısıyla anlatıyor, o yüzden şemasız da çalışır.
  const semasiz=(b,cfg)=>{ const c=dusunme(b,cfg); if(c.generationConfig) delete c.generationConfig.responseSchema; return c; };
  if(f==='yeni') return [
    (b)=>{ const c=dusunme(b,{thinkingLevel:"low"}); delete c.generationConfig.temperature; return c; },
    (b)=>{ const c=semasiz(b,{thinkingLevel:"low"}); delete c.generationConfig.temperature; return c; },
    (b)=>temiz(b), (b)=>b ];
  if(f==='flash25') return [
    (b)=>dusunme(b,{thinkingBudget:0}), (b)=>semasiz(b,{thinkingBudget:0}), (b)=>temiz(b), (b)=>b ];
  if(f==='pro') return [
    (b)=>dusunme(b,{thinkingBudget:128}), (b)=>semasiz(b,{thinkingBudget:128}), (b)=>temiz(b), (b)=>b ];
  return [ (b)=>temiz(b), (b)=>b ];
}
const CFG_OK = {};   // model -> çalıştığı bilinen varyant

// ---------- Zaman aşımlı istek (sonsuz bekleme yok) ----------
const ZAMAN_ASIMI = 150000;   // 150 sn
function fetchZamanAsimli(u, init){
  const ac = new AbortController();
  const t = setTimeout(()=>ac.abort(), ZAMAN_ASIMI);
  return ORIG_FETCH(u, Object.assign({}, init, {signal: ac.signal})).finally(()=>clearTimeout(t));
}

// ---------- Google'ın gerçek hata mesajını oku ----------
async function googleErr(r){
  try{ const d=await r.clone().json(); return (d && d.error && d.error.message) || JSON.stringify(d).slice(0,200); }
  catch(e){ try{ return (await r.clone().text()).slice(0,200); }catch(e2){ return 'HTTP '+r.status; } }
}
// ---------- Türkçe teşhis: sorun anahtarda mı, modelde mi, promptta mı? ----------
function netHatasi(e){
  const m=String((e&&e.message)||e||'');
  if(/TUM_DOLU/i.test(m))
    return 'SORUN: KOTA. Denenen tüm anahtar ve modellerin kotası dolu'+(m.split('·')[1]?' —'+m.split('·')[1]:'')+'. Anahtarların AYNI PROJEDEyse hepsi aynı kotayı paylaşır; ayrı Google Cloud projelerinde anahtar açarsan her biri kendi kotasını alır.';
  if(/SAFETY|blockReason/i.test(m))
    return 'SORUN: PROMPT. İçerik güvenlik filtresine takıldı. Metni yumuşatıp tekrar dene.';
  if(/API key not valid|API_KEY_INVALID|INVALID_ARGUMENT.*key/i.test(m))
    return 'SORUN: ANAHTAR. Anahtar geçersiz. aistudio.google.com/apikey adresinden yeni bir anahtar oluşturup yapıştır.';
  if(/PERMISSION_DENIED|SERVICE_DISABLED|has not been used|is disabled/i.test(m))
    return 'SORUN: ANAHTAR/PROJE. Generative Language API bu projede kapalı ya da anahtarın yetkisi yok. Google AI Studio\'da yeni anahtar oluştur.';
  if(/referer|referrer|API_KEY_HTTP_REFERRER/i.test(m))
    return 'SORUN: ANAHTAR KISITI. Anahtarına web sitesi (HTTP referrer) kısıtı konmuş; dosyayı bilgisayardan açtığın için engelliyor. Anahtar kısıtlamasını "Yok/None" yap.';
  if(/not found|is not supported|Unknown name.*model|models\//i.test(m) && /404|not found|not supported/i.test(m))
    return 'SORUN: MODEL. Bu model adı anahtarınla kullanılamıyor. "Test Et"e bas — çalışan modeli otomatik bulup seçerim.';
  if(/Unknown name|Invalid JSON payload|INVALID_ARGUMENT/i.test(m))
    return 'SORUN: İSTEK BİÇİMİ. Model bu parametreleri kabul etmiyor. Katman otomatik uyarlamayı deniyor; sürerse modeli gemini-2.5-flash yap.';
  if(/50[0234]|UNAVAILABLE|high demand|overloaded|INTERNAL/i.test(m))
    return 'SORUN: GOOGLE TARAFI (503). Model şu an aşırı yoğun. Senin anahtarınla, modelinle ya da yazdığın metinle İLGİSİ YOK — Google\'ın sunucusu geçici olarak dolu. Katman bekleyip tekrar denedi ve sırayla diğer modelleri denedi; hepsi doluysa 2-3 dakika sonra tekrar dene.';
  if(/429|quota|RESOURCE_EXHAUSTED/i.test(m))
    return 'SORUN: KOTA (429). Hız sınırını düşür ya da gemini-2.5-flash-lite dene. Günlük kota Pasifik saatiyle gece yarısı sıfırlanır.';
  if(/aborted|AbortError|zaman aşımı/i.test(m))
    return 'SORUN: SÜRE. Model 150 saniyede yanıt vermedi. Genelde çok uzun materyal istendiğinde olur: istediğin soru/etkinlik sayısını azalt ya da modeli gemini-2.5-flash yap.';
  if(/Failed to fetch|NetworkError|ERR_/i.test(m))
    return 'SORUN: BAĞLANTI. İnternete ulaşılamadı. Reklam engelleyici/VPN/güvenlik duvarı Google\'a erişimi kesiyor olabilir.';
  if(/KESIK_JSON/i.test(m))
    return 'SORUN: ÇIKTI KESİLDİ. Model JSON\'ı tamamlayamadı (istek çok büyük). İstediğin soru/blok sayısını azalt ya da modeli gemini-2.5-flash yap; katman bütçeyi büyütüp tekrar denedi ama yetmedi.';
  if(/BOŞ_YANIT|MAX_TOKENS/i.test(m))
    return 'SORUN: MODEL/ÇIKTI. Model boş ya da kesik yanıt döndü (düşünme modu çıktı bütçesini yiyor). Katman bunu otomatik kapatmayı denedi; sürerse gemini-2.5-flash-lite dene.';
  return m || 'Bilinmeyen hata.';
}

// ---------- Ekrana bildirim ----------
function toast(html, renk){
  let t=document.getElementById('zirve-toast');
  if(!t){
    t=document.createElement('div'); t.id='zirve-toast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:2147483000;max-width:min(560px,92vw);padding:12px 16px;border-radius:14px;font:600 13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 12px 34px rgba(0,0,0,.22);border:2px solid;display:none';
    document.body.appendChild(t);
  }
  t.innerHTML=html; t.style.display='block';
  if(renk==='red'){ t.style.background='#fee2e2'; t.style.borderColor='#fca5a5'; t.style.color='#991b1b'; }
  else if(renk==='green'){ t.style.background='#dcfce7'; t.style.borderColor='#86efac'; t.style.color='#166534'; }
  else { t.style.background='#fffbeb'; t.style.borderColor='#fcd34d'; t.style.color='#92400e'; }
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.style.display='none'; }, renk==='red'?14000:9000);
}

// ---------- Anahtar doğrulama + otomatik model bulma ----------
async function listModels(key){
  const r=await ORIG_FETCH(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
  if(!r.ok) throw new Error(await googleErr(r));
  const d=await r.json();
  const hepsi=(d.models||[]);
  try{
    const gorsel=hepsi.filter(m=>{
      const ad=String(m.name||'').toLowerCase();
      const cikti=(m.outputModalities||m.supportedOutputModalities||[]).join(',').toLowerCase();
      return (ad.indexOf('-image')!==-1 || cikti.indexOf('image')!==-1) && (m.supportedGenerationMethods||[]).indexOf('generateContent')!==-1;
    }).map(m=>String(m.name||'').replace('models/',''));
    if(gorsel.length){
      gorsel.sort((a,b)=>{ const p=x=>{let s=0; if(/gemini-[4-9]/.test(x))s+=200; else if(/gemini-3/.test(x))s+=100; else if(/gemini-2\.5/.test(x))s+=50; if(/lite/.test(x))s+=5; return s;}; return p(b)-p(a); });
      window.ZIRVE_GORSEL_MODELLER=gorsel;

    }

  return hepsi.filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')!==-1)

}
function enIyiModel(list){
  // Materyal üretimi için en SAĞLAM ve güçlü modeller önce (lite ve latest'ler riskli, sona)
  const tercih=["gemini-2.5-flash","gemini-2.5-pro","gemini-flash-latest","gemini-2.5-flash-lite","gemini-flash-lite-latest"];
  for(const t of tercih) if(list.indexOf(t)!==-1) return t;
  return list.find(m=>/flash/.test(m)&&!/lite/.test(m)) || list.find(m=>/flash/.test(m)) || list[0] || null;
}

 çalışması hazırla. Cevap anahtarı ekle."}, {"e": "Kelime Dağarcığı", "t": "flashcard", "m": "3. sınıf için 10 yeni kelimeyi anlamı ve örnek cümlesiyle tanıtan bilgi kartları hazırla."}, {"e": "Ses Çalışması", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "R sesini doğru çıkaramayan bir öğrenci için başta, ortada ve sonda R sesi geçen kelimelerle artikülasyon çalışması hazırla."}]}, {"grup": "🔢 Matematik", "items": [{"e": "Problem Kurma", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "4. sınıf için verilen işlemden problem kurdurma çalışması hazırla. 6 işlem ver, her biri için problem yazdır."}, {"e": "Ritmik Sayma", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "2. sınıf için 2'şer, 5'er ve 10'ar ritmik sayma çalışması hazırla. Boşluk doldurmalı olsun."}, {"e": "Saat Okuma", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "3. sınıf için tam, buçuk ve çeyrek saatleri okuma ve yazma çalışması hazırla."}, {"e": "Para & Alışveriş", "t": "fatura", "m": "3. sınıf için market alışverişi üzerinden para hesabı yaptıran fiş/fatura çalışması hazırla."}, {"e": "İşlem Şeridi", "t": "makine", "m": "2. sınıf için kuralı verilen dönüşüm makinesiyle toplama-çıkarma alıştırması hazırla."}, {"e": "Hata Dedektifi", "t": "hatali", "m": "5. sınıf kesirler konusunda kasten hatalı çözülmüş bir işlem ver; öğrenci hatayı bulup doğrusunu yazsın."}, {"e": "Ölçme (Uzunluk)", "t": "tablo", "m": "4. sınıf için uzunluk ölçme birimleri dönüşüm tablosu ve alıştırmaları hazırla. Cevap anahtarı ekle."}]}, {"grup": "🔬 Fen & Sosyal", "items": [{"e": "Deney Raporu", "t": "recete", "m": "5. sınıf fen bilimleri için basit bir deneyin malzeme listesi, adımları ve gözlem-sonuç bölümü olan deney raporu şablonu hazırla."}, {"e": "Kavram Haritası", "t": "zihin", "m": "6. sınıf fen bilimleri 'maddenin hâlleri' konusu için merkez kavram ve yan kavramlardan oluşan zihin haritası çalışması hazırla."}, {"e": "Zaman Şeridi", "t": "sirala", "m": "4. sınıf sosyal bilgiler için Kurtuluş Savaşı olaylarını karışık verip zaman şeridine sıralatan çalışma hazırla."}, {"e": "Karşılaştırma (Venn)", "t": "venn", "m": "5. sınıf fen için 'bitki hücresi ve hayvan hücresi' karşılaştırmalı Venn şeması çalışması hazırla."}, {"e": "İnfografik Özet", "t": "gorsel_veri", "m": "6. sınıf için 'geri dönüşüm' konulu, sayısal verilerle desteklenmiş infografik tarzı özet materyali hazırla."}]}, {"grup": "🏫 Sınıf Yönetimi", "items": [{"e": "Sınıf Kuralları Afişi", "t": "Fark Etmez (Yapay Zeka Seçsin)", "m": "İlkokul 1. sınıf için olumlu dille yazılmış, 6 maddelik görsel sınıf kuralları afişi hazırla."}, {"e": "Davranış Takip Çizelgesi", "t": "tablo", "m": "Bir öğrencinin haftalık hedef davranışlarını gün gün takip edebileceğim çizelge hazırla. Değerlendirme ölçütleri net olsun."}, {"e": "Ödül / Pekiştireç Tablosu", "t": "tombala", "m": "Sınıf içi olumlu davranışları pekiştirmek için çocukların seçebileceği ödül görevlerinden oluşan tombala kartı hazırla."}, {"e": "Nöbet & Görev Çizelgesi", "t": "tablo", "m": "Sınıf içi haftalık görev dağılımı çizelgesi hazırla: tahta, çiçek, sıra düzeni gibi görevler olsun."}]}, {"grup": "👨‍👩‍👧 Veli & Ev", "items": [{"e": "Ev Çalışma Programı", "t": "tablo", "m": "3. sınıf öğrencisi için hafta içi akşamlarına uygun, 30 dakikayı geçmeyen ev çalışma programı çizelgesi hazırla."}, {"e": "Okuma Takip Çizelgesi", "t": "tablo", "m": "Her gün 15 dakika okuma yapan bir öğrenci için veli imzalı aylık okuma takip çizelgesi hazırla."}, {"e": "Veli Bilgilendirme Notu", "t": "okuma", "m": "Velilere çocuklarının ekran süresini yönetmeleri için pratik önerileri olan kısa bir bilgilendirme notu hazırla."}, {"e": "Tatil Etkinlik Paketi", "t": "tombala", "m": "Ara tatilde ailece yapılabilecek, ekran gerektirmeyen eğitici etkinliklerden oluşan tombala kartı hazırla."}]}, {"grup": "🌍 İngilizce & Değerler", "items": [{"e": "İngilizce Kelime Kartı", "t": "flashcard", "m": "4. sınıf İngilizce 'animals' ünitesi için ön yüzde İngilizce kelime, arka yüzde Türkçe karşılığı ve örnek cümle olan kartlar hazırla."}, {"e": "İngilizce Boşluk Doldurma", "t": "bosluk", "m": "5. sınıf İngilizce present simple konusundan 10 cümlelik boşluk doldurma çalışması hazırla. Cevap anahtarı ekle."}, {"e": "Değerler Eğitimi", "t": "okuma", "m": "İlkokul için 'yardımlaşma' değerini işleyen kısa bir öykü ve ardından 3 tartışma sorusu hazırla."}]}, {"grup": "📑 Denemeler · LGS", "items": [{"e": "LGS Türkçe Denemesi", "t": "deneme_sinavi", "m": "LGS formatında, yeni nesil ve paragraf ağırlıklı 20 soruluk Türkçe deneme sınavı hazırla. Sözcükte anlam, cümlede anlam, paragraf, sözel mantık ve dil bilgisi dengeli dağılsın. Her sorunun sonunda cevap anahtarı ve kısa çözüm olsun."}, {"e": "LGS Matematik Denemesi", "t": "deneme_sinavi", "m": "LGS formatında yeni nesil 20 soruluk Matematik deneme sınavı hazırla. Gerçek yaşam problemleri, grafik/tablo yorumlama, çarpanlar-katlar, cebirsel ifadeler, geometri dengeli olsun. Cevap anahtarı ve çözümlü olsun."}, {"e": "LGS Fen Bilimleri Denemesi", "t": "deneme_sinavi", "m": "LGS formatında yeni nesil 20 soruluk Fen Bilimleri deneme sınavı hazırla (8. sınıf müfredatı: DNA, basınç, madde, elektrik, periyodik sistem vb.). Deney/grafik yorumlama içersin. Cevap anahtarı ve çözümlü olsun."}, {"e": "LGS İnkılap Tarihi Denemesi", "t": "deneme_sinavi", "m": "LGS formatında 10 soruluk T.C. İnkılap Tarihi ve Atatürkçülük deneme sınavı hazırla. Cevap anahtarı ve kısa açıklama olsun."}, {"e": "LGS Din Kültürü Denemesi", "t": "deneme_sinavi", "m": "LGS formatında 10 soruluk Din Kültürü ve Ahlak Bilgisi deneme sınavı hazırla. Cevap anahtarlı ve açıklamalı olsun."}, {"e": "LGS İngilizce Denemesi", "t": "deneme_sinavi", "m": "LGS formatında 10 soruluk İngilizce deneme sınavı hazırla (8. sınıf üniteleri). Cevap anahtarlı olsun."}, {"e": "LGS Karma Genel Deneme", "t": "deneme_sinavi", "m": "LGS sınavının birebir sözel + sayısal bölüm dağılımına uygun kapsamlı bir genel deneme hazırla (Türkçe, İnkılap, Din, İngilizce + Matematik, Fen). Cevap anahtarı ve çözümleri en sonda toplu olsun."}]}, {"grup": "📑 Denemeler · TYT", "items": [{"e": "TYT Türkçe Denemesi", "t": "deneme_sinavi", "m": "TYT formatında 20 soruluk Türkçe deneme hazırla (sözcük/cümle/paragraf anlam, dil bilgisi, yazım-noktalama). Cevap anahtarı ve çözümlü olsun."}, {"e": "TYT Temel Matematik Denemesi", "t": "deneme_sinavi", "m": "TYT formatında 20 soruluk Temel Matematik deneme hazırla (sayılar, problemler, cebir, geometri). Cevap anahtarlı ve çözümlü olsun."}, {"e": "TYT Fen Bilimleri Denemesi", "t": "deneme_sinavi", "m": "TYT formatında Fizik-Kimya-Biyoloji dengeli 20 soruluk Fen deneme hazırla. Cevap anahtarlı ve açıklamalı olsun."}, {"e": "TYT Sosyal Bilimler Denemesi", "t": "deneme_sinavi", "m": "TYT formatında Tarih-Coğrafya-Felsefe-Din dengeli 20 soruluk Sosyal Bilimler deneme hazırla. Cevap anahtarlı olsun."}, {"e": "TYT Genel Deneme", "t": "deneme_sinavi", "m": "TYT'nin gerçek oturum yapısına uygun kapsamlı genel deneme hazırla (Türkçe, Sosyal, Matematik, Fen). Cevap anahtarı ve çözümler en sonda toplu olsun."}]}, {"grup": "📑 Denemeler · AYT", "items": [{"e": "AYT Matematik Denemesi", "t": "deneme_sinavi", "m": "AYT formatında zor 20 soruluk Matematik deneme hazırla (fonksiyonlar, türev, integral, limit, trigonometri). Cevap anahtarlı ve çözümlü olsun."}, {"e": "AYT Fizik Denemesi", "t": "deneme_sinavi", "m": "AYT formatında 14 soruluk Fizik deneme hazırla. Cevap anahtarlı ve açıklamalı olsun."}, {"e": "AYT Kimya Denemesi", "t": "deneme_sinavi", "m": "AYT formatında 13 soruluk Kimya deneme hazırla. Cevap anahtarlı olsun."}, {"e": "AYT Biyoloji Denemesi", "t": "deneme_sinavi", "m": "AYT formatında 13 soruluk Biyoloji deneme hazırla. Cevap anahtarlı olsun."}, {"e": "AYT Edebiyat Denemesi", "t": "deneme_sinavi", "m": "AYT formatında 24 soruluk Türk Dili ve Edebiyatı deneme hazırla. Cevap anahtarlı ve açıklamalı olsun."}, {"e": "AYT Tarih-Coğrafya Denemesi", "t": "deneme_sinavi", "m": "AYT formatında Tarih ve Coğrafya dengeli 20 soruluk deneme hazırla. Cevap anahtarlı olsun."}]}, {"grup": "📑 Denemeler · KPSS", "items": [{"e": "KPSS Genel Yetenek", "t": "deneme_sinavi", "m": "KPSS formatında Türkçe ve Matematik (Genel Yetenek) dengeli 30 soruluk deneme hazırla. Cevap anahtarlı ve çözümlü olsun."}, {"e": "KPSS Genel Kültür", "t": "deneme_sinavi", "m": "KPSS formatında Tarih, Coğrafya, Vatandaşlık ve Güncel Bilgiler (Genel Kültür) dengeli 30 soruluk deneme hazırla. Cevap anahtarlı olsun."}, {"e": "KPSS Eğitim Bilimleri", "t": "deneme_sinavi", "m": "KPSS Eğitim Bilimleri formatında 30 soruluk deneme hazırla (Öğrenme, Gelişim, ÖYT, Ölçme-Değerlendirme, Rehberlik). Cevap anahtarlı ve açıklamalı olsun."}, {"e": "KPSS Mevzuat (ÖMK/657)", "t": "deneme_sinavi", "m": "KPSS Eğitim Bilimleri mevzuat bölümü için 15 soruluk deneme hazırla (1739, 657, Öğretmenlik Meslek Kanunu). Güncel ve cevap anahtarlı olsun."}, {"e": "KPSS Genel Deneme", "t": "deneme_sinavi", "m": "KPSS'nin gerçek oturum yapısına uygun kapsamlı genel deneme hazırla (Genel Yetenek + Genel Kültür). Cevap anahtarı ve çözümler en sonda toplu olsun."}]}, {"grup": "📑 Denemeler · ÖABT & AGS", "items": [{"e": "ÖABT Okul Öncesi Denemesi", "t": "deneme_sinavi", "m": "Okul Öncesi Öğretmenliği ÖABT formatında (30 Alan Bilgisi + 20 Alan Eğitimi = 50 soru mantığında) kapsamlı deneme hazırla. Gelişim, EÇE yaklaşımları, oyun, çocuk edebiyatı, alan eğitimi konuları dengeli olsun. Cevap anahtarı ve çözümler en sonda toplu olsun."}, {"e": "ÖABT Sınıf Öğretmenliği", "t": "deneme_sinavi", "m": "Sınıf Öğretmenliği ÖABT formatında kapsamlı deneme hazırla (Türkçe/İlk okuma yazma, Matematik, Fen, Sosyal, Alan eğitimi). Cevap anahtarlı ve çözümlü olsun."}, {"e": "AGS Eğitim Bilimleri", "t": "deneme_sinavi", "m": "AGS (Akademi Giriş Sınavı) formatında 30 soruluk Eğitim Bilimleri denemesi hazırla. Güncel, cevap anahtarlı ve açıklamalı olsun."}, {"e": "AGS Genel Yetenek-Kültür", "t": "deneme_sinavi", "m": "AGS formatında Sözel-Sayısal Yetenek, Tarih, Coğrafya, Vatandaşlık dengeli 30 soruluk deneme hazırla. Cevap anahtarlı olsun."}]}, {"grup": "📑 Denemeler · EKPSS & Özel", "items": [{"e": "EKPSS Genel Yetenek", "t": "deneme_sinavi", "m": "EKPSS (Engelli KPSS) formatında, sade ve anlaşılır dilde Genel Yetenek (Türkçe-Matematik) 20 soruluk deneme hazırla. Cevap anahtarlı ve çözümlü olsun."}, {"e": "EKPSS Genel Kültür", "t": "deneme_sinavi", "m": "EKPSS formatında Genel Kültür 20 soruluk deneme hazırla (Tarih, Coğrafya, Vatandaşlık, güncel). Sade dilde, cevap anahtarlı olsun."}, {"e": "EKPSS Genel Deneme", "t": "deneme_sinavi", "m": "EKPSS'nin yapısına uygun kapsamlı genel deneme hazırla (Genel Yetenek + Genel Kültür), sade ve erişilebilir dilde. Cevap anahtarı toplu olsun."}, {"e": "Bursluluk (İOKBS) Denemesi", "t": "deneme_sinavi", "m": "İOKBS (Bursluluk) sınavı formatında seçilen sınıf düzeyi için Türkçe, Matematik, Fen, Sosyal dengeli deneme hazırla. Cevap anahtarlı olsun."}]}, {"grup": "🤖 Robotik & Kodlama", "items": [{"e": "Scratch Blok Kodlama", "t": "blok_kodlama", "m": "Belirtilen sınıf düzeyi için Scratch tarzı blok kodlama görevleri hazırla: karakteri hareket ettirme, döngü, koşul ve olay blokları içeren adım adım proje yönergeleri olsun. Görevin sonunda öğrencinin ekleyeceği bir 'yaratıcı görev' olsun."}, {"e": "Kod.org Etkinliği", "t": "kodlama_etkinlik", "m": "Kod.org tarzı, bloklarla labirent/algoritma çözme etkinliği hazırla. Adım adım yönlendirme (ileri, dön, tekrarla) ve giderek zorlaşan seviyeler olsun."}, {"e": "Algoritma & Akış Şeması", "t": "algoritma", "m": "Öğrencilere algoritma mantığını öğreten bir çalışma hazırla: günlük hayattan bir işi (diş fırçalama, sandviç yapma) adım adım algoritmaya ve basit akış şemasına dökme etkinlikleri olsun."}, {"e": "mBlock / Arduino Başlangıç", "t": "robotik_arduino", "m": "Ortaokul için mBlock/Arduino başlangıç etkinliği hazırla: LED yakma, buton okuma, sensör ile mesafe ölçme gibi basit robotik görevleri adım adım anlat. Malzeme listesi ve güvenlik notu ekle."}, {"e": "Robotik Proje Fikirleri", "t": "robotik_proje", "m": "Seçilen yaş grubuna uygun, sınıfta uygulanabilir 5 robotik/STEM proje fikri hazırla. Her proje için amaç, malzeme, adımlar ve kazanım yaz."}, {"e": "Python Başlangıç (Çocuk)", "t": "python_baslangic", "m": "Çocuklar için Python'a giriş çalışması hazırla: print, değişken, basit döngü ve koşul konularını eğlenceli örneklerle anlat. Her konunun sonunda küçük bir alıştırma olsun."}, {"e": "Kodlama Kavramları Testi", "t": "test", "m": "Bilişim/kodlama kavramları (döngü, koşul, değişken, algoritma, hata ayıklama) üzerine seçilen düzeye uygun 10 soruluk test hazırla. Cevap anahtarlı olsun."}, {"e": "Robotik Etkinlik Planı", "t": "etkinlik_plani", "m": "Bir ders saatlik robotik/kodlama etkinlik planı hazırla: kazanımlar, giriş-etkinlik-değerlendirme aşamaları, kullanılacak malzeme ve süreler olsun."}]}, {"grup": "♟️ Satranç", "items": [{"e": "Satranç Taşları & Kurallar", "t": "satranc_temel", "m": "Satranca yeni başlayan çocuklar için taşların hareketlerini, satranç tahtası kurulumunu ve temel kuralları görsellerle (emoji/şema) anlatan bir çalışma hazırla. Sonunda 5 kısa 'doğru-yanlış' sorusu olsun."}, {"e": "Satranç Mat Problemleri", "t": "satranc_mat", "m": "Seçilen seviyeye uygun 'tek hamlede mat' ve 'iki hamlede mat' problemleri hazırla. Her problemin altına çözümü (doğru hamle) yaz. Tahta konumunu metin/koordinatla tarif et."}, {"e": "Satranç Açılış Bilgisi", "t": "satranc_acilis", "m": "Yeni başlayanlar için temel satranç açılış prensiplerini (merkez kontrolü, taş geliştirme, şah güvenliği, rok) örneklerle anlatan bir çalışma hazırla."}, {"e": "Satranç Taktikleri", "t": "satranc_taktik", "m": "Çatal, şiş, çıkma, açmaz gibi temel satranç taktiklerini örnek pozisyonlarla anlatan bir çalışma hazırla. Her taktik için bir uygulama sorusu ve çözümü olsun."}, {"e": "Satranç Etkinlik/Turnuva", "t": "satranc_etkinlik", "m": "Sınıf içi satranç etkinliği/mini turnuva planı hazırla: eşleştirme sistemi, süre, puanlama, adil oyun kuralları ve satranç görgü kuralları olsun."}]}, {"grup": "🧠 Akıl & Zeka Oyunları", "items": [{"e": "Mantık Bulmacaları", "t": "mantik_bulmaca", "m": "Seçilen yaş grubuna uygun mantık bulmacaları hazırla (kim-nerede-ne türü çıkarım tabloları, sıralama bulmacaları). Her bulmacanın çözümü sonda olsun."}, {"e": "Sudoku & Sayı Bulmaca", "t": "sudoku", "m": "Seçilen zorlukta Sudoku ve sayı yerleştirme bulmacaları hazırla (4x4, 6x6 veya 9x9). Çözüm anahtarı ekle."}, {"e": "Tangram & Görsel Zeka", "t": "gorsel_zeka", "m": "Görsel zekâ ve dikkat etkinlikleri hazırla: tangram şekilleri, farkı bul, örüntü tamamlama, döndürülmüş şekli bulma görevleri olsun."}, {"e": "Kutu Kapatmaca / Nim", "t": "strateji_oyun", "m": "Sınıfta oynanabilecek strateji ve akıl oyunlarını (Nim, kutu kapatmaca, sıra sayı) kurallarıyla anlat ve stratejik ipuçları ver."}, {"e": "Zeka Soruları (Isınma)", "t": "zeka_sorulari", "m": "Derse ısınma için seçilen yaş grubuna uygun 10 eğlenceli zekâ/muhakeme sorusu hazırla. Cevaplar ve kısa açıklamalar sonda olsun."}, {"e": "Mangala / Akıl Oyunu", "t": "akil_oyun", "m": "Mangala gibi geleneksel akıl oyunlarının kurallarını ve temel stratejilerini öğreten bir çalışma hazırla; sınıfta uygulama yönergesi ekle."}, {"e": "Dikkat & Hafıza Egzersizi", "t": "dikkat_hafiza", "m": "Bilişsel beceri geliştiren dikkat ve hafıza egzersizleri hazırla: sayı/şekil dizisi hatırlama, dikkat tarama, eşleştirme ve odaklanma görevleri olsun."}]}, {"grup": "🎓 Yapay Zeka & Dijital Beceri", "items": [{"e": "Yapay Zeka Nedir? (Çocuk)", "t": "yapay_zeka_giris", "m": "Çocuklara yapay zekânın ne olduğunu günlük örneklerle (sesli asistan, öneri sistemleri, görüntü tanıma) anlatan eğlenceli bir çalışma hazırla. Sonunda 5 kısa soru olsun."}, {"e": "YZ Etik & Güvenli Kullanım", "t": "yapay_zeka_etik", "m": "Öğrenciler için yapay zekâyı etik ve güvenli kullanma çalışması hazırla: doğru bilgi kontrolü, mahremiyet, telif, önyargı konularını yaş düzeyine uygun anlat."}, {"e": "Makine Öğrenmesi (Basit)", "t": "makine_ogrenmesi", "m": "Makine öğrenmesinin temel mantığını (örneklerle öğrenme, sınıflandırma) çocukların anlayacağı sadelikte, sınıf içi etkinlikle anlat (ör. elle veri toplayıp tahmin oyunu)."}, {"e": "Yapay Zeka ile Görsel/Metin", "t": "yapay_zeka_uygulama", "m": "Öğretmenin sınıfta yapay zekâ araçlarını nasıl kullanabileceğine dair pratik bir rehber hazırla (görsel üretme, metin özetleme, soru üretme) ve örnek komutlar ver."}, {"e": "Dijital Vatandaşlık", "t": "dijital_vatandaslik", "m": "Dijital vatandaşlık çalışması hazırla: siber zorbalık, güvenli şifre, ekran süresi, dijital ayak izi konularını yaş düzeyine uygun etkinliklerle anlat."}, {"e": "Kodsuz Yapay Zeka Projesi", "t": "yapay_zeka_proje", "m": "Ortaokul/lise için kodsuz yapay zekâ proje fikirleri hazırla (Teachable Machine tarzı): amaç, adımlar, kazanım ve sunum önerisi olsun."}]}, {"grup": "🔬 STEM & Bilim Deneyleri", "items": [{"e": "Basit Bilim Deneyi", "t": "bilim_deneyi", "m": "Sınıfta güvenle yapılabilecek, evde bulunan malzemelerle basit bir bilim deneyi hazırla: hipotez, malzeme, adımlar, gözlem tablosu ve 'neden oldu?' açıklaması olsun."}, {"e": "STEM Tasarım Görevi", "t": "stem_tasarim", "m": "Mühendislik tasarım süreci içeren bir STEM görevi hazırla (köprü, kule, su geçirmez kap vb.): problem, kriterler, malzeme, tasarla-test et-geliştir adımları olsun."}, {"e": "Doğa & Gözlem Etkinliği", "t": "doga_gozlem", "m": "Doğa gözlemi ve bilimsel süreç becerisi geliştiren bir etkinlik hazırla: gözlem, kayıt, sınıflama ve çıkarım görevleri olsun."}]}, {"grup": "💚 Rehberlik & Sosyal-Duygusal", "items": [{"e": "Duygu Düzenleme", "t": "duygu_duzenleme", "m": "Sosyal-duygusal öğrenme için duygu düzenleme çalışması hazırla: duyguyu fark etme, sakinleşme teknikleri (nefes, sayma), uygun ifade etme etkinlikleri olsun."}, {"e": "Öfke Kontrolü", "t": "ofke_kontrol", "m": "Çocuklar için öfke kontrolü çalışması hazırla: öfke belirtilerini tanıma, dur-düşün-hareket et tekniği, senaryolar ve baş etme kartları olsun."}, {"e": "Arkadaşlık & Empati", "t": "empati", "m": "Arkadaşlık becerileri ve empati geliştiren etkinlikler hazırla: bakış açısı alma, paylaşma, uzlaşma senaryoları ve rol oyunları olsun."}, {"e": "Sınav Kaygısı ile Baş Etme", "t": "sinav_kaygisi", "m": "Öğrenciler için sınav kaygısıyla baş etme çalışması hazırla: kaygıyı tanıma, gevşeme teknikleri, olumlu iç konuşma ve çalışma planı önerileri olsun."}, {"e": "Motivasyon & Hedef", "t": "motivasyon_hedef", "m": "Öğrenci motivasyonu ve hedef belirleme çalışması hazırla: SMART hedef, küçük adımlar, ödül sistemi ve öz-değerlendirme olsun."}, {"e": "Meslek Tanıtımı", "t": "meslek_tanitim", "m": "Kariyer/meslek farkındalığı etkinliği hazırla: ilgi-yetenek eşleştirme, meslek tanıtımı ve 'ben büyüyünce' çalışması olsun."}]}, {"grup": "🎨 Sanat & Müzik & Drama", "items": [{"e": "Yaratıcı Drama Etkinliği", "t": "drama_etkinlik", "m": "Yaratıcı drama etkinliği hazırla: ısınma, canlandırma (doğaçlama, rol oynama), değerlendirme aşamalarıyla; belirtilen tema üzerine kurgulanmış olsun."}, {"e": "Müzik & Ritim", "t": "muzik_ritim", "m": "Okul öncesi/ilkokul için müzik ve ritim etkinliği hazırla: beden perküsyonu, basit ritim kalıpları ve şarkı eşliğinde hareket önerileri olsun."}, {"e": "Görsel Sanatlar Projesi", "t": "gorsel_sanat", "m": "Belirtilen tema için görsel sanatlar projesi hazırla: teknik (kolaj, baskı, boyama), malzeme, adımlar ve sanatsal kazanımlar olsun."}, {"e": "Boyama & El Becerisi", "t": "boyama_elbeceri", "m": "Okul öncesi için ince motor gelişimi destekleyen boyama, kesme-yapıştırma ve el becerisi etkinlikleri hazırla."}]}, {"grup": "🏃 Beden & Oyun", "items": [{"e": "Sınıf İçi Hareket Molası", "t": "hareket_molasi", "m": "Ders arasında 5 dakikalık, dar alanda uygulanabilir enerji atma / hareket molası etkinlikleri hazırla."}, {"e": "Temel Hareket Oyunları", "t": "hareket_oyun", "m": "Belirtilen yaş grubu için temel hareket becerilerini (koşma, sıçrama, denge, atma-tutma) geliştiren oyunlar hazırla; kurallar ve güvenlik notu olsun."}, {"e": "Kaynaştırma Oyunları", "t": "kaynastirma_oyun", "m": "Sınıfa uyum ve grup kaynaşması için isim öğrenme, güven ve iş birliği oyunları hazırla."}]}, {"grup": "📅 Öğretmen Pratik Araçlar", "items": [{"e": "Günlük Ders Planı", "t": "ders_plani", "m": "Belirtilen konu ve sınıf için bir ders saatlik plan hazırla: kazanımlar, giriş-gelişme-sonuç, yöntem-teknik, materyal, ölçme ve süreler olsun."}, {"e": "Kazanım Değerlendirme", "t": "kazanim_degerlendirme", "m": "Belirtilen kazanım için hızlı değerlendirme aracı hazırla: 5 soruluk kontrol testi ve kazanımın ölçülüp ölçülmediğini gösteren rubrik olsun."}, {"e": "Veli Toplantı Notu", "t": "veli_toplanti", "m": "Veli toplantısı için gündem ve konuşma notu hazırla: sınıfın genel durumu, öğrenci gelişimi, ev desteği önerileri ve iş birliği maddeleri olsun."}, {"e": "Ödül/Pekiştireç Sistemi", "t": "odul_sistem", "m": "Sınıf için olumlu davranışı pekiştiren bir ödül/token sistemi hazırla: hedef davranışlar, puanlama, ödüller ve takip çizelgesi olsun."}, {"e": "Sınıf Kuralları & Rutin", "t": "sinif_kurallari", "m": "Sınıf kuralları ve günlük rutin çalışması hazırla: olumlu dille yazılmış kurallar, görsel destek önerisi ve uygulama yönergesi olsun."}, {"e": "Aylık Konu Planı", "t": "aylik_plan", "m": "Belirtilen ders ve sınıf için bir aylık konu/ünite planı hazırla: haftalara bölünmüş kazanımlar, etkinlikler ve değerlendirme önerileri olsun."}]}, {"grup": "🖼️ Görsel Materyaller (SVG)", "items": [{"e": "Satranç Tahtası (Görsel)", "t": "zengin_metin", "m": "Satranç tahtasını ve tüm taşların başlangıç dizilimini RENKLİ İNLİNE SVG olarak çiz. 8x8 kareli tahta, açık-koyu kareler, kenarlarda a-h harfleri ve 1-8 rakamları, taşlar Unicode satranç sembolleriyle yerleştirilmiş olsun. Altına kısa bir 'taşların dizilimi' açıklaması ekle."}, {"e": "Satranç Mat Bulmacası (Görsel)", "t": "zengin_metin", "m": "Seçilen seviyeye uygun 'tek hamlede mat' satranç bulmacası hazırla. Pozisyonu RENKLİ İNLİNE SVG satranç tahtası olarak çiz (sadece ilgili taşlar dizili), altına 'Beyaz oynar ve mat eder' talimatı yaz ve en sonda çözümü (doğru hamle) ayrı bir kutuda ver."}, {"e": "Scratch Blok Şeması (Görsel)", "t": "zengin_metin", "m": "Belirtilen basit Scratch projesinin blok dizilimini RENKLİ İNLİNE SVG olarak çiz: her blok yuvarlatılmış renkli dikdörtgen (Olaylar=sarı, Hareket=mavi, Kontrol=turuncu, Görünüm=mor) ve içinde blok metni olsun; bloklar alt alta birbirine geçmiş gibi görünsün. Altına ne yaptığını adım adım açıkla."}, {"e": "Geometrik Şekiller (Görsel)", "t": "zengin_metin", "m": "Belirtilen konu için geometrik şekilleri RENKLİ İNLİNE SVG olarak çiz (üçgen, kare, dikdörtgen, daire, açılar vb.), her şeklin adını ve özelliğini yanına yaz. Ölçülü ve net olsun, çalışma kâğıdı gibi."}, {"e": "Saat Öğreniyorum (Görsel)", "t": "zengin_metin", "m": "Saati öğreten çalışma hazırla: birkaç analog saati RENKLİ İNLİNE SVG olarak farklı saatleri gösterecek şekilde çiz, altlarına 'saat kaç?' boşluğu bırak. En sonda cevapları ver."}, {"e": "Kesir Modeli (Görsel)", "t": "zengin_metin", "m": "Kesirleri görselleştiren çalışma hazırla: pizza/pasta/çubuk modellerini RENKLİ İNLİNE SVG ile parçalara bölünmüş olarak çiz (1/2, 1/3, 1/4, 3/4 vb.), her modelin altına kesri yaz. Eşleştirme veya boyama görevi ekle."}, {"e": "Harita/Diyagram (Görsel)", "t": "zengin_metin", "m": "Belirtilen konu için basit bir diyagram/şema/harita RENKLİ İNLİNE SVG olarak çiz (ör. su döngüsü, bitki kısımları, besin zinciri, akış şeması). Etiketleri <text> ile yerleştir, okları <line>/<polygon> ile göster."}, {"e": "Sayı Doğrusu (Görsel)", "t": "zengin_metin", "m": "Belirtilen aralık için sayı doğrusunu RENKLİ İNLİNE SVG olarak çiz, üzerinde işaretlenecek noktalar/işlemler için boşluk bırak. Altına 2-3 alıştırma ekle ve cevaplarını en sonda ver."}]}, {"grup": "🃏 Etkileşimli & Kesme-Yapıştır", "items": [{"e": "Flashcard Seti (Kes-Kullan)", "t": "flashcard_grid", "m": "Belirtilen konu için kesilip kullanılabilecek çalışma kartları (flashcard) hazırla: her kartın ön yüzünde kavram/soru, arka yüzünde cevap olsun. En az 10 kart üret."}, {"e": "Tombala Kartı", "t": "tombala_grid", "m": "Belirtilen konu için tombala/bingo kartı hazırla: 5x5 ızgarada kavramlar/kelimeler/sayılar olsun. Öğretmenin okuyacağı çağrı listesi de ekle."}, {"e": "Domino/Eşleştirme Kartları", "t": "eslestirme_tablosu", "m": "Belirtilen konu için kesilip eşleştirilecek kart çiftleri hazırla (soru-cevap, kavram-tanım, kelime-görsel). Karışık sırayla ver, cevap anahtarı ekle."}, {"e": "Zar/Çark Oyunu", "t": "zengin_metin", "m": "Belirtilen konu için sınıfta oynanacak zar veya çark oyunu hazırla: RENKLİ İNLİNE SVG ile bir oyun tahtası/çark çiz, her kareye görev/soru yaz, kuralları açıkla."}]}, {"grup": "📋 Kurumsal & Yönetim", "items": [{"e": "Öğrenci Gelişim Raporu", "t": "zengin_metin", "m": "Bir öğrenci için dönemlik gelişim raporu şablonu hazırla: akademik, sosyal-duygusal, davranışsal alanlar; güçlü yönler, gelişim alanları ve ev önerileri bölümleri olsun. Kurumsal ve profesyonel görünsün."}, {"e": "BEP (Bireyselleştirilmiş Plan)", "t": "zengin_metin", "m": "Özel eğitim öğrencisi için BEP (Bireyselleştirilmiş Eğitim Planı) taslağı hazırla: mevcut performans, uzun-kısa vadeli amaçlar, öğretim yöntemleri, değerlendirme ölçütleri bölümleriyle. Tablo halinde düzenli olsun."}, {"e": "Veli Bilgilendirme Mektubu", "t": "zengin_metin", "m": "Belirtilen konuda velilere gönderilecek resmi ve sıcak bir bilgilendirme mektubu hazırla. Kurumsal antet alanı, tarih, hitap ve imza bölümü olsun."}, {"e": "Etkinlik/Gezi İzin Formu", "t": "zengin_metin", "m": "Okul gezisi/etkinliği için veli izin formu hazırla: etkinlik bilgisi, tarih-saat, ücret, sorumlu öğretmen, veli onay ve imza bölümleriyle."}, {"e": "Sertifika/Başarı Belgesi", "t": "sertifika", "m": "Belirtilen öğrenci ve başarı için şık bir başarı/katılım sertifikası hazırla. Süslü çerçeve, tebrik metni, tarih ve imza alanı olsun."}, {"e": "Ödev Takip Çizelgesi", "t": "gorsel_veri", "m": "Haftalık ödev/görev takip çizelgesi hazırla: günler sütunda, dersler/görevler satırda, işaretlenecek kutular olsun."}]}, {"grup": "🎉 Belirli Gün & Hafta", "items": [{"e": "23 Nisan Etkinliği", "t": "zengin_metin", "m": "23 Nisan Ulusal Egemenlik ve Çocuk Bayramı için etkinlik/çalışma kâğıdı hazırla: kısa bilgi, boyama/görsel öğe (SVG bayrak vb.), etkinlik ve sorular olsun."}, {"e": "29 Ekim Cumhuriyet", "t": "zengin_metin", "m": "29 Ekim Cumhuriyet Bayramı için yaş düzeyine uygun etkinlik hazırla: kısa bilgi, görsel öğe, etkinlik ve değerlendirme soruları olsun."}, {"e": "10 Kasım Atatürk", "t": "zengin_metin", "m": "10 Kasım Atatürk'ü Anma için saygılı ve yaş düzeyine uygun bir çalışma hazırla: Atatürk'ün hayatından kesitler, etkinlik ve anlamlı sorular olsun."}, {"e": "Yeni Yıl / Kış Etkinliği", "t": "zengin_metin", "m": "Yeni yıl/kış temalı eğlenceli bir etkinlik kâğıdı hazırla: görsel öğeler (kar tanesi SVG vb.), boyama, bulmaca ve yaratıcı yazma görevi olsun."}, {"e": "Dünya/Çevre Günü", "t": "zengin_metin", "m": "Çevre/Dünya günü için farkındalık etkinliği hazırla: kısa bilgi, geri dönüşüm/doğa temalı görsel, etkinlik ve 'ben ne yapabilirim' bölümü olsun."}]}, {"grup": "🌍 Yabancı Dil (İngilizce)", "items": [{"e": "İngilizce Kelime Kartları", "t": "flashcard_grid", "m": "Belirtilen konu (renkler, hayvanlar, meyveler vb.) için İngilizce-Türkçe kelime kartları hazırla: ön yüz İngilizce+emoji, arka yüz Türkçe. En az 10 kart."}, {"e": "İngilizce Boşluk Doldurma", "t": "standart_soru", "m": "Belirtilen konu/gramer için İngilizce boşluk doldurma alıştırması hazırla. Cevap anahtarlı olsun."}, {"e": "İngilizce Diyalog", "t": "okuma_parcasi", "m": "Belirtilen durum için (selamlaşma, alışveriş, yön sorma) basit bir İngilizce diyalog hazırla, altına Türkçe anlamı ve 3 anlama sorusu ekle."}, {"e": "İngilizce Eşleştirme", "t": "eslestirme_tablosu", "m": "Belirtilen konu için İngilizce kelime - Türkçe anlam (veya kelime-görsel) eşleştirme çalışması hazırla. Cevap anahtarlı olsun."}]}, {"grup": "📖 Okuma-Yazma Yöntemleri", "items": [{"e": "Ses Temelli Cümle (MEB Güncel)", "t": "zengin_metin", "m": "Güncel MEB Ses Temelli Cümle Yöntemine uygun ilk okuma-yazma materyali hazırla: seçilen ses/harf için (ör. 'e' sesi) o sesle başlayan görsel-kelime örnekleri, sesin hissettirilmesi, ilgili hece tablosu (e ile: el, ev, et...), sesle kelime ve basit cümle oluşturma aşamalarını sırayla ver. Bitişik eğik yazı çizgi çalışması ekle. Bol emoji ve renkli görsel kullan."}, {"e": "Ses (Fonetik) Yöntemi", "t": "zengin_metin", "m": "Ses (fonetik) yöntemiyle okuma-yazma çalışması hazırla: verilen sesi tek tek tanıtma, sesin ağızdan çıkışını hissettirme, o sesle başlayan/biten kelimeler, ses-harf eşleştirme ve sesleri birleştirerek hece-kelime kurma etkinlikleri olsun. Parçadan bütüne (sentez) mantığıyla ilerlesin."}, {"e": "Harf (Alfabe) Yöntemi", "t": "zengin_metin", "m": "Harf (alfabe) yöntemiyle okuma-yazma çalışması hazırla: seçilen harfin tanıtımı, büyük-küçük yazılışı, harfin sesi, o harfle kelimeler, harfleri yan yana getirerek hece ve kelime oluşturma alıştırmaları olsun. Harf yazım yönü okları ve çizgi çalışması ekle."}, {"e": "Hece Yöntemi", "t": "basara_hece_tablosu", "m": "Hece yöntemiyle okuma-yazma materyali hazırla: seçilen ünlü/ünsüzle sistematik hece tablosu (ba-be-bı-bi-bo-bö-bu-bü gibi), hecelerden kelime türetme, hece atlama-birleştirme ve hecelerle cümle kurma etkinlikleri olsun. Renkli ve düzenli tablo halinde ver."}, {"e": "Ba-Sa-Ra Hece Yöntemi", "t": "basara_hece_tablosu", "m": "Ba-Sa-Ra yöntemiyle görsel destekli heceleme materyali hazırla: seçilen ünsüzün tüm ünlülerle hecelerini renkli tablo halinde ver, her heceyi görselleştir, hecelerden kelime kurma ve okuma alıştırmaları ekle. Özellikle özel eğitim ve okuma güçlüğü çeken öğrenciler için sade ve tekrarlı olsun."}, {"e": "Çözümleme (Cümle) Yöntemi", "t": "zengin_metin", "m": "Çözümleme (cümle) yöntemiyle okuma-yazma materyali hazırla: çocuğun günlük dilinden kısa anlamlı bir cümleyle başla (ör. 'Ali topu at.'), cümleyi kelimelere, kelimeleri hecelere, heceleri seslere ayır (bütünden parçaya/tümdengelim), sonra elde edilen parçalarla yeni kelime ve cümleler kur. Her aşamayı görsel destekli göster."}, {"e": "Sözcük (Kelime) Yöntemi", "t": "zengin_metin", "m": "Sözcük (kelime) yöntemiyle okuma-yazma çalışması hazırla: resimle birlikte bütün kelimeyi tanıtma (ör. 🍎 ELMA), kelimeyi görsel olarak tanıma, aynı kelimeyi farklı yerlerde bulma, sonra kelimeyi hecelere ve seslere çözme etkinlikleri olsun. Bol görsel-kelime kartı ver."}, {"e": "Cümle Yöntemi", "t": "zengin_metin", "m": "Cümle yöntemiyle okuma-yazma materyali hazırla: anlamlı kısa cümlelerle başla, cümleyi bir bütün olarak tanıma, cümledeki kelimeleri ayırt etme, kelime ve hecelere inme aşamalarını içersin. Resimli cümle kartları ekle."}, {"e": "Öykü (Metin) Yöntemi", "t": "okuma_parcasi", "m": "Öykü (metin) yöntemiyle okuma-yazma materyali hazırla: yaş düzeyine uygun kısa, akıcı ve resimlenebilir bir öykü ver, öyküden cümleleri, cümlelerden kelimeleri, kelimelerden heceleri çözümleme etkinlikleri ekle. Öykü sonunda anlama soruları olsun."}, {"e": "Bireşim (Sentez) Yöntemi", "t": "zengin_metin", "m": "Bireşim (sentez) yöntemiyle okuma-yazma çalışması hazırla: en küçük birimden (ses/harf) başlayıp harfleri birleştirerek hece, heceleri birleştirerek kelime, kelimeleri birleştirerek cümle kurma (parçadan bütüne) aşamalarını sırayla ve görsel destekli ver."}, {"e": "Çözümleme-Bireşim (Karma)", "t": "zengin_metin", "m": "Karma (eklektik) yöntemle okuma-yazma materyali hazırla: hem çözümleme (cümleden sese) hem bireşim (sesten cümleye) aşamalarını dengeli birleştir. Anlamlı cümleyle başla, seslere kadar çöz, sonra seslerden yeni kelime-cümle kur. Her iki yönü de görsel destekle göster."}, {"e": "Fiş Yöntemi (Cümlecik)", "t": "zengin_metin", "m": "Fiş yöntemiyle (cümlecik/kelime fişleri) okuma-yazma materyali hazırla: üzerinde kısa cümle veya kelime yazan, kesilip kullanılabilecek okuma fişleri hazırla. Her fişte görsel + metin olsun; fişlerle tanıma, eşleştirme ve okuma alıştırmaları ekle."}, {"e": "Görsel Okuma (Ön Hazırlık)", "t": "zengin_metin", "m": "Okuma öncesi görsel okuma / okumaya hazırlık materyali hazırla: resim okuma, sıralı olayları anlatma, benzer-farklı bulma, göz-el koordinasyonu, soldan sağa-yukarıdan aşağıya takip çizgileri ve şekil-zemin ayırt etme etkinlikleri olsun. Bol görsel."}, {"e": "Okuma Akıcılığı", "t": "okuma_parcasi", "m": "Okuma akıcılığını geliştiren materyal hazırla: seviyeye uygun kısa metin, tekrarlı okuma yönergesi, hız-doğruluk-prozodi takip tablosu, güç kelimelerin ön çalışması ve eşli okuma önerisi olsun."}, {"e": "Disleksi Destek Çalışması", "t": "zengin_metin", "m": "Okuma güçlüğü / disleksi olan öğrenciler için destekleyici, sade ve çok tekrarlı bir okuma-yazma çalışması hazırla: karıştırılan harfleri (b-d, p-q) ayırt etme, hece-ses farkındalığı, çok duyulu (görsel-işitsel-dokunsal) etkinlikler ve motive edici kısa görevler olsun. Yargılayıcı olmayan, cesaretlendirici dil kullan."}]}, {"grup": "🧩 Özel Eğitim · Beceri & Yöntem", "items": [{"e": "ABA / Ayrık Denemelerle Öğretim", "t": "zengin_metin", "m": "Uygulamalı Davranış Analizi (ABA) temelli, ayrık denemelerle öğretim (DTT) çalışması hazırla: hedef beceri, yönerge (SD), beklenen tepki, ipucu (fiziksel/model/sözel/jest), pekiştireç ve veri kayıt tablosu içersin. Adım adım, ölçülebilir ve tekrarlı olsun."}, {"e": "Fırsat Öğretimi / Doğal Öğretim", "t": "zengin_metin", "m": "Doğal ortamda öğretim (fırsat öğretimi, etkinlik temelli) çalışması hazırla: günlük rutinler içinde hedef beceriyi çalıştırma, çocuğun ilgisini takip etme, doğal pekiştireç kullanma ve genelleme fırsatları içersin."}, {"e": "Görsel Destekli Öğretim (PECS/Kart)", "t": "zengin_metin", "m": "Görsel destek sistemi materyali hazırla: iletişim kartları, günlük akış şeması (görsel program), seçim tahtası ve sıra kartları. Kartlar net, tek kavramlı ve kesilebilir olsun. PECS aşamalarına uygun kullanım notu ekle."}, {"e": "Sosyal Beceri Öğretimi", "t": "zengin_metin", "m": "Sosyal beceri öğretimi materyali hazırla: hedef sosyal beceriyi (selamlaşma, sıra bekleme, paylaşma, yardım isteme) adımlara böl, model senaryolar, rol oyunu kartları ve pekiştirme çizelgesi olsun."}, {"e": "Öz Bakım Becerileri", "t": "recete_adimlari", "m": "Öz bakım becerisi (el yıkama, diş fırçalama, giyinme, tuvalet) için görsel beceri analizi hazırla: her adımı sırayla, görsel destekli ve tek cümlelik yönergelerle ver. İlerleme takip çizelgesi ekle."}, {"e": "Davranış Yönetimi Planı", "t": "zengin_metin", "m": "Olumlu davranış destek planı hazırla: hedef davranış tanımı, öncül (ne zaman/nerede oluyor), işlev (dikkat/kaçınma/nesne), önleyici stratejiler, alternatif davranış öğretimi ve pekiştirme sistemi içersin."}, {"e": "Kaba/İnce Motor Beceri", "t": "zengin_metin", "m": "Motor beceri geliştirme çalışması hazırla: ince motor (kalem tutma, makas, boncuk dizme, düğme) ve kaba motor (denge, zıplama, top) etkinlikleri, zorluk kademeli, görsel yönergeli olsun."}, {"e": "Duyusal Bütünleme Etkinliği", "t": "zengin_metin", "m": "Duyusal bütünleme destekli etkinlik hazırla: dokunsal, vestibüler ve proprioseptif girdiler içeren, sınıfta/evde uygulanabilir sakinleştirici ve düzenleyici etkinlikler olsun. Güvenlik notu ekle."}, {"e": "Kavram Öğretimi (Somuttan)", "t": "zengin_metin", "m": "Özel eğitim için temel kavram öğretimi materyali hazırla (renk, şekil, büyük-küçük, sayı): somuttan soyuta, çok tekrarlı, görsel-eşleştirme ağırlıklı ve her adımda ipucu-silme (prompt fading) mantığıyla olsun."}]}, {"grup": "🧠 Çocuklar için Felsefe (P4C)", "items": [{"e": "Felsefi Sorgulama Oturumu (P4C)", "t": "okuma_parcasi", "m": "Çocuklar için Felsefe (P4C) yaklaşımıyla bir sorgulama oturumu materyali hazırla: yaş düzeyine uygun kısa bir uyarıcı (öykü/senaryo) ver, ardından merak uyandıran açık uçlu felsefi sorular (ör. 'Arkadaşlık nedir?', 'Adil olmak ne demek?'), tartışma yönergeleri ve öğretmen için kolaylaştırı }

// ---------- React'in kontrol ettiği alana dışarıdan değer yazma ----------
function reactYaz(el, val){
  if(!el) return false;
  const proto = (el.tagName==='SELECT') ? window.HTMLSelectElement.prototype
              : (el.tagName==='TEXTAREA') ? window.HTMLTextAreaElement.prototype
              : window.HTMLInputElement.prototype;
  const d = Object.getOwnPropertyDescriptor(proto,'value');
  if(d && d.set) d.set.call(el, val); else el.value = val;
  el.dispatchEvent(new Event('input',{bubbles:true}));
  el.dispatchEvent(new Event('change',{bubbles:true}));
  return true;
}
function matbaaAlanlari(){
  let ta=null, sel=null;
  const tas=document.querySelectorAll('textarea');
  for(let i=0;i<tas.length;i++){ const ph=(tas[i].placeholder||'');
    if(ph.indexOf('İsteğini doğal')!==-1 || ph.indexOf('Ne üretmek istiyorsun')!==-1 || ph.indexOf('ne yapalım')!==-1 || ph.indexOf('ne üretmek')!==-1){ ta=tas[i]; break; } }
  // yine bulunamadıysa: en uzun placeholder'lı textarea materyal kutusudur
  if(!ta && tas.length){ let en=-1; for(let i=0;i<tas.length;i++){ const l=(tas[i].placeholder||'').length; if(l>en){en=l; ta=tas[i];} } }
  const sels=document.querySelectorAll('select');
  for(let i=0;i<sels.length;i++){
    const o=sels[i].querySelectorAll('option');
    for(let j=0;j<o.length;j++){ if((o[j].value||'').indexOf('Fark Etmez')!==-1){ sel=sels[i]; break; } }
    if(sel) break;
  }
  return {ta:ta, sel:sel};
}
function sablonUygula(it){
  const alan = matbaaAlanlari();
  if(alan.sel && it.t){
    let mevcut=false;
    const ops=alan.sel.querySelectorAll('option');
    for(let j=0;j<ops.length;j++) if(ops[j].value===it.t) mevcut=true;
    if(mevcut) reactYaz(alan.sel, it.t);      // listede yoksa dokunma (uygulama bozulmasın)
  }
  if(alan.ta){ reactYaz(alan.ta, it.m); try{ alan.ta.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} }
  const ov=document.getElementById('zirve-sec-ov'); if(ov) ov.style.display='none';
  toast('✅ <b>'+it.e+'</b> yüklendi. Sınıfı/konuyu değiştirip <b>Dökümanı Üret</b>e bas.','green');
}

//  Üretilen materyaldeki Türkçe metinleri hecelere böler,
//  heceleri sırayla renklendirir. Aç/kapa düğmesi Matbaa'ya eklenir.
// ============================================================
const HECE_RENKLERI = ['#dc2626','#2563eb','#16a34a','#d97706','#7c3aed','#0891b2'];
let HECE_AKTIF = false;
try{ HECE_AKTIF = localStorage.getItem('zirve_hece')==='1'; }catch(e){}

// Türkçe heceleme: sesli harfleri çekirdek alan basit ama sağlam kurallı bölme
const SESLI='aeıioöuüAEIİOÖUÜ';
function seslimi(c){ return SESLI.indexOf(c)!==-1; }
function heceBol(kelime){
  if(!/[a-zA-ZçğıöşüÇĞİÖŞÜ]/.test(kelime)) return [kelime];
  const c=kelime.split(''); const V=[];
  c.forEach(function(ch,i){ if(seslimi(ch)) V.push(i); });
  if(V.length<=1) return [kelime];
  const kesim=[];
  for(var k=0;k<V.length-1;k++){
    const v1=V[k], v2=V[k+1];
    const ara=v2-v1-1;          // aradaki ünsüz sayısı
    var kes;
    if(ara===0)      kes=v2;    // V | V
    else             kes=v2-1;  // V C V → V|CV ;  V CC..V → VC..|CV (son ünsüz sonraki heceye)
    kesim.push(kes);
  }
  const parca=[]; var bas=0;
  kesim.forEach(function(k){ parca.push(kelime.slice(bas,k)); bas=k; });
  parca.push(kelime.slice(bas));
  return parca.filter(function(x){ return x.length; });
}
function heceBoya(kelime){
  const h=heceBol(kelime); if(h.length<=1) return null;
  let ri=0;
  return h.map(p=>{
    if(/[a-zA-ZçğıöşüÇĞİÖŞÜ]/.test(p)){ const renk=HECE_RENKLERI[ri%HECE_RENKLERI.length]; ri++;
      return '<span style="color:'+renk+'">'+p+'</span>'; }
    return p;
  }).join('');
}
// Bir DOM düğümündeki metinleri, etiketleri bozmadan heceli renge çevir
function dugumHecele(kok){
  const yur=document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, null);
  const isler=[]; let n;
  while(n=yur.nextNode()){
    const p=n.parentNode;
    if(!p) continue;
    const tag=(p.tagName||'').toLowerCase();
    if(tag==='script'||tag==='style'||p.closest('button')||p.closest('input')||p.closest('textarea')) continue;
    if(p.dataset && p.dataset.hecelendi) continue;
    if(!/[a-zA-ZçğıöşüÇĞİÖŞÜ]{2,}/.test(n.nodeValue)) continue;
    isler.push(n);
  }
  isler.forEach(n=>{
    const kelimeler=n.nodeValue.split(/(\s+)/);
    const html=kelimeler.map(w=>{ if(/^\s+$/.test(w)||!w) return w; const b=heceBoya(w); return b||w; }).join('');
    if(html!==n.nodeValue){
      const span=document.createElement('span');
      span.dataset.hecelendi='1'; span.innerHTML=html;
      n.parentNode.replaceChild(span, n);
    }
  });
}

// ============================================================
//  FETCH SARMALAYICI — uygulamanın 15 çağrısı da buradan geçer
// ============================================================
const ORIG_FETCH = window.fetch.bind(window);

function urlBilgi(u){
  const m = /\/v1beta\/models\/([^:?]+)(:generateContent)?/.exec(u);
  return { model: m?m[1]:null, uretim: !!(m&&m[2]) };
}
function urlKur(u, model, key){
  return u.replace(/\/v1beta\/models\/[^:?]+/, '/v1beta/models/'+model)
          .replace(/([?&])key=[^&]*/, '$1key='+encodeURIComponent(key));
}

window.fetch = async function(input, init){
  const u = (typeof input==='string') ? input : (input && input.url) || '';
  // Bizim ilgilendiğimiz istek değilse dokunma
  if(!/generativelanguage\.googleapis\.com/.test(u)) return ORIG_FETCH(input, init);
  if(!RING.keys.length){
    toast('🔑 <b>Önce API anahtarı ekle.</b> Sağ alttaki <b>🔑 API</b> düğmesine bas, anahtarlarını yapıştır ve <b>Test Et</b>e tıkla.','red');
    return ORIG_FETCH(input, init);   // uygulamanın kendi akışı bozulmasın
  }

  const bilgi = urlBilgi(u);
  let model = MODEL || bilgi.model || 'gemini-2.5-flash';
  const denenenModeller = [model];

  // Gövde varyantları yalnızca üretim isteklerinde (POST) anlamlı
  let govdeVar = (init && init.body) ? govdeVaryantlari(model) : [ (b)=>b ];
  let vi = (CFG_OK[model]!==undefined) ? CFG_OK[model] : 0;
  let orjGovde = null;
  if(init && init.body){ try{ orjGovde = JSON.parse(init.body); }catch(e){ orjGovde=null; } }

  const modelDegistir = ()=>{
    const yeni = modelSonraki(model, denenenModeller);
    if(!yeni) return false;
    const eski = model;
    model = yeni; denenenModeller.push(yeni);
    MODEL = yeni; localStorage.setItem(LS.model, yeni);
    if(init && init.body) govdeVar = govdeVaryantlari(model);
    vi = (CFG_OK[model]!==undefined) ? CFG_OK[model] : 0;
    RING.aktif = null;
    panelYenile();
    toast(`⚡ <b>${eski}</b> kotası tüm anahtarlarda doldu → <b>${yeni}</b> modeline geçildi.<br><span style="font-weight:700;font-size:.72rem">Google'da kota her model için ayrı tutulur; taze kotayla devam ediyorsun.</span>`);
    return true;
  };

  let sonHata = null;
  const yogunSayac = {};      // model -> kaç kez 503 aldı
  let bekleme = 900;          // 503 sonrası bekleme (katlanarak artar)
  for(let deneme=0; deneme<40; deneme++){
    const key = ringPick(model);
    if(!key){
      if(modelDegistir()) continue;
      const b = ringBekleme(model);
      const msg = 'TUM_DOLU'+(b?' · en erken '+b+' sonra':'');
      toast('🚫 '+netHatasi(new Error(msg)),'red');
      sonHata = new Error(msg);
      break;
    }
    const yeniUrl = urlKur(u, model, key);
    const yeniInit = Object.assign({}, init);
    if(orjGovde){
      let g = orjGovde;
      try{ g = govdeVar[Math.min(vi,govdeVar.length-1)](orjGovde); }catch(e){ g = orjGovde; }
      yeniInit.body = JSON.stringify(g);
    }

    await rateGate();
    let r;
    try{ r = await fetchZamanAsimli(yeniUrl, yeniInit); }
    catch(e){ rateRelease(); toast('🌐 '+netHatasi(e),'red'); throw e; }
    rateRelease();

    // --- 429: anahtar değiştir, olmazsa model değiştir ---
    if(r.status===429){
      const em = await googleErr(r);
      const eskiNo = ringNo(key);
      const gunluk = ringCool(key, em, model);
      const kalan = ringHazir(model);
      RING.aktif = kalan[0] || null;
      panelYenile();
      if(RING.aktif){
        toast(`🔑 <b>${eskiNo}. anahtarın ${gunluk?'GÜNLÜK':'dakikalık'} kotası doldu</b> → <b>${ringNo(RING.aktif)}. anahtara</b> geçildi.<br><span style="font-weight:700;font-size:.72rem">Hazır anahtar: ${kalan.length}/${RING.keys.length}${gunluk?' · Günlük kota Pasifik gece yarısı sıfırlanır.':''}</span>`);
        continue;
      }
      if(modelDegistir()) continue;
      const b=ringBekleme(model);
      sonHata = new Error('TUM_DOLU'+(b?' · en erken '+b+' sonra':''));
      toast('🚫 '+netHatasi(sonHata),'red');
      break;
    }

    // --- 400: parametre uyumsuzluğu → sonraki gövde varyantı ---
    if(r.status===400 && orjGovde && vi < govdeVar.length-1){ vi++; continue; }

    // --- 503/500/502/504: Google'ın sunucusu yoğun. Anahtarla ilgisi YOK. ---
    if(r.status===503 || r.status===500 || r.status===502 || r.status===504){
      const em = await googleErr(r);
      yogunSayac[model] = (yogunSayac[model]||0)+1;
      if(yogunSayac[model] <= 3){
        const sn = Math.round(bekleme/1000);
        toast(`⏳ <b>Google tarafı yoğun (${r.status})</b> · <b>${model}</b> · ${yogunSayac[model]}/3. deneme, ${sn} sn sonra tekrar...<br><span style="font-weight:700;font-size:.72rem">Bu senin anahtarınla ilgili değil, Google'ın sunucusu geçici olarak dolu. Bekliyorum, sen bir şey yapma.</span>`);
        await new Promise(res=>setTimeout(res, bekleme));
        bekleme = Math.min(9000, Math.round(bekleme*1.8));
        continue;
      }
      if(modelDegistir()){
        bekleme = 900;
        toast(`🔁 <b>${denenenModeller[denenenModeller.length-2]}</b> yoğunluğu geçmedi → <b>${model}</b> modeli deneniyor.`);
        continue;
      }
      sonHata = new Error('HTTP '+r.status+' · '+em);
      toast('⚠️ '+netHatasi(sonHata),'red');
      return r;
    }

    if(!r.ok){
      const em = await googleErr(r);
      sonHata = new Error('HTTP '+r.status+' · '+em);
      toast('⚠️ '+netHatasi(sonHata),'red');
      return r;    // uygulamanın kendi hata akışı çalışsın
    }

    // --- Boş/kesik yanıt: düşünme modu çıktıyı yemiş olabilir ---
    if(orjGovde && bilgi.uretim){
      let d=null; try{ d = await r.clone().json(); }catch(e){}
      const cand = d && d.candidates && d.candidates[0];
      const metin = ((cand && cand.content && cand.content.parts)||[]).map(x=>x.text||'').join('').trim();
      const bitis = cand && cand.finishReason;
      // Çıktı kesildiyse bütçeyi büyüt ve tekrar dene (JSON yarıda kalmasın)
      if(bitis==='MAX_TOKENS' && orjGovde.generationConfig){
        const eskiTok = orjGovde.generationConfig.maxOutputTokens || 8192;
        if(eskiTok < 30000){
          orjGovde.generationConfig.maxOutputTokens = Math.min(32000, Math.round(eskiTok*1.7));
          if(vi < govdeVar.length-1) vi++;
          continue;
        }
      }
      if(!metin){
        const blok = d && d.promptFeedback && d.promptFeedback.blockReason;
        if(!blok && vi < govdeVar.length-1){ vi++; continue; }   // varyant değiştirip tekrar dene
        sonHata = new Error(blok ? ('SAFETY · '+blok) : ('BOŞ_YANIT'+(bitis?' · '+bitis:'')));
        toast('⚠️ '+netHatasi(sonHata),'red');
        return r;
      }
      // JSON istendiyse gerçekten ayrıştırılabiliyor mu? Değilse tekrar dene.
      const jsonIster = orjGovde.generationConfig && orjGovde.generationConfig.responseMimeType==='application/json';
      if(jsonIster){
        let temizMetin = metin.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
        let nesne=null; try{ nesne=JSON.parse(temizMetin); }catch(e){ nesne=null; }
        if(nesne===null){
          if(vi < govdeVar.length-1){ vi++; continue; }
          sonHata = new Error('KESIK_JSON');
          toast('⚠️ '+netHatasi(sonHata),'red');
          return r;
        }
        // --- Sertifika, AÇIKÇA istenmedikçe eklenmez ---
        try{
          const istek = JSON.stringify(orjGovde.contents||'');
          const sertifikaIstendi = /sertifika|başarı belgesi|basari belgesi|başarı sertifikası|takdir belgesi/i.test(istek);
          if(!sertifikaIstendi && nesne && Array.isArray(nesne.icerik_bloklari)){
            const once = nesne.icerik_bloklari.length;
            nesne.icerik_bloklari = nesne.icerik_bloklari.filter(b => !b || b.blok_tipi!=='sertifika');
            if(nesne.icerik_bloklari.length !== once && typeof Response!=='undefined'){
              const kopya = JSON.parse(JSON.stringify(d));
              kopya.candidates[0].content.parts = [{text: JSON.stringify(nesne)}];
              CFG_OK[model]=vi;
              return new Response(JSON.stringify(kopya), {status:200, headers:{'Content-Type':'application/json'}});
            }
          }
        }catch(e){}
      }
    }
    CFG_OK[model] = vi;   // çalışan varyantı hatırla
    return r;
  }
  if(sonHata) throw sonHata;
  return ORIG_FETCH(input, init);
};

const sablonlariTestEt = async (limit, devam) => {
    if (!apiKey) { showToast("Önce API anahtarı girin."); return; }
    const tumSablonlar = [];
    try {
        const kaynak = (typeof window !== 'undefined' && window.ZIRVE_SABLONLAR) ? window.ZIRVE_SABLONLAR : [];
        kaynak.forEach(g => (g.items || []).forEach(it => tumSablonlar.push({ grup: g.grup, ad: it.e, prompt: it.m })));
    } catch (e) {}
    if (!tumSablonlar.length) { showToast("Şablon bulunamadı."); return; }
    let aktifModel = modelName || 'gemini-2.5-flash';
    try { if (window.ZIRVE && typeof window.ZIRVE.enIyiModel === 'function' && window.ZIRVE.modeller && window.ZIRVE.modeller.length) { const iyi = window.ZIRVE.enIyiModel(window.ZIRVE.modeller); if (iyi) aktifModel = iyi; } else if (window.ZIRVE && window.ZIRVE.model) aktifModel = window.ZIRVE.model; } catch(e){}
    if (!aktifModel || aktifModel.includes('latest') || aktifModel.includes('lite')) aktifModel = 'gemini-2.5-flash';
    let test = limit ? tumSablonlar.slice(0, limit) : tumSablonlar;
    let sonuclar = []; let baslangic = 0;
    if (devam) { try { const kayit = JSON.parse(localStorage.getItem('zirve_test_durum') || 'null'); if (kayit && Array.isArray(kayit.sonuclar)) { sonuclar = kayit.sonuclar; baslangic = kayit.sonuclar.length; } } catch(e){} }
    else { localStorage.removeItem('zirve_test_durum'); }
    setTestModuCalisiyor(true);
    if (baslangic === 0) setTestSonuclari([]);
    for (let i = baslangic; i < test.length; i++) {
        const s = test[i];
        setTestIlerleme(`${i + 1} / ${test.length} — ${s.ad}`);
        let durum = 'ok', notlar = [];
        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${aktifModel}:generateContent?key=${apiKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: s.prompt + "\n\nSadece geçerli JSON döndür: {\"dokuman_basligi\":\"...\",\"icerik_bloklari\":[...]}. Her blokta blok_tipi olsun." }] }], generationConfig: { responseMimeType: "application/json", temperature: 0.4, maxOutputTokens: 8000, thinkingConfig: { thinkingBudget: 0 } } })
            });
            if (!resp.ok) { durum = 'hata'; if (resp.status === 429) notlar.push('Kota doldu (429)'); else if (resp.status === 404) notlar.push('Model bulunamadı (404)'); else notlar.push('API ' + resp.status); }
            else {
                const data = await resp.json();
                const metin = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                let parsed = null;
                try { parsed = JSON.parse(metin.replace(/^```(?:json)?/i, '').replace(/```$/i, '').trim()); } catch (e) { durum = 'hata'; notlar.push('JSON bozuk'); }
                if (parsed) {
                    const bloklar = parsed.icerik_bloklari || [];
                    if (!bloklar.length) { durum = 'hata'; notlar.push('İçerik boş'); }
                    bloklar.forEach(b => {
                        const st = String(b.soru_metni || '').toLowerCase();
                        if (/hangisi|hangisidir|kaçtır|aşağıdakilerden/.test(st) && (!b.secenekler || b.secenekler.filter(x => x && String(x).trim()).length < 2)) { if (durum === 'ok') durum = 'uyari'; notlar.push('Şıksız çoktan seçmeli'); }
                        if (b.blok_tipi === 'eslestirme_tablosu' && (!b.sag_sutun_karisik || b.sag_sutun_karisik.filter(x => x && String(x).trim()).length < 1)) { if (durum === 'ok') durum = 'uyari'; notlar.push('Eşleştirme sağ sütun boş'); }
                    });
                    const sorular = bloklar.map(b => b.soru_metni).filter(Boolean);
                    if (sorular.length !== new Set(sorular).size) { if (durum === 'ok') durum = 'uyari'; notlar.push('Tekrar eden soru'); }
                }
            }
        } catch (e) { durum = 'hata'; notlar.push('Bağlantı hatası'); }
        sonuclar.push({ ...s, durum, notlar: [...new Set(notlar)] });
        setTestSonuclari([...sonuclar]);
        try { localStorage.setItem('zirve_test_durum', JSON.stringify({ sonuclar, toplam: test.length, zaman: Date.now() })); } catch(e){}
        await new Promise(r => setTimeout(r, 350));
    }
    setTestIlerleme(''); setTestModuCalisiyor(false); localStorage.removeItem('zirve_test_durum');
    const ok = sonuclar.filter(x => x.durum === 'ok').length, uyari = sonuclar.filter(x => x.durum === 'uyari').length, hata = sonuclar.filter(x => x.durum === 'hata').length;
    showToast(`Test bitti: ✅${ok} ⚠️${uyari} ❌${hata}`);
};
const testRaporuKopyala = () => {
    if (!testSonuclari || !testSonuclari.length) { showToast("Önce test çalıştırın."); return; }
    const ok = testSonuclari.filter(x => x.durum === 'ok').length;
    const uyari = testSonuclari.filter(x => x.durum === 'uyari');
    const hata = testSonuclari.filter(x => x.durum === 'hata');
    let rapor = `ŞABLON TEST RAPORU\n===================\nToplam test: ${testSonuclari.length}\n✅ Sorunsuz: ${ok}\n⚠️ Uyarı: ${uyari.length}\n❌ Hata: ${hata.length}\n\n`;
    if (hata.length) { rapor += `--- ❌ HATALAR ---\n`; hata.forEach(r => { rapor += `• ${r.ad} [${r.grup}] — ${r.notlar.join(', ')}\n`; }); rapor += `\n`; }
    if (uyari.length) { rapor += `--- ⚠️ UYARILAR ---\n`; uyari.forEach(r => { rapor += `• ${r.ad} [${r.grup}] — ${r.notlar.join(', ')}\n`; }); }
    if (!hata.length && !uyari.length) rapor += `Tüm şablonlar sorunsuz! 🎉`;
    try { navigator.clipboard.writeText(rapor).then(() => showToast("📋 Rapor kopyalandı!"), () => { const ta = document.createElement('textarea'); ta.value = rapor; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); showToast("📋 Rapor kopyalandı!"); }); } catch(e) { showToast("Kopyalanamadı."); }
};

const downloadAsPDF = async (elementId, filename) => {
const element = document.getElementById(elementId);
if (!element) return;
setIsDownloadingPdf(true);
showToast("PDF hazırlanıyor, lütfen bekleyin...");
const noPrintElements = element.querySelectorAll('.no-print');
noPrintElements.forEach(el => el.style.display = 'none');
const printOnlyElements = element.querySelectorAll('.print-only');
printOnlyElements.forEach(el => {
el.classList.remove('print-only');
el.setAttribute('data-pdf-restored', 'true');
});
const opt = {
margin:       [10, 10, 10, 10],
filename:     `${filename.replace(/[^a-z0-9ğüşöçİĞÜŞÖÇ]/gi, '_')}.pdf`,
image:        { type: 'jpeg', quality: 0.98 },
html2canvas:  { scale: 2, useCORS: true, letterRendering: true, backgroundColor: '#ffffff', scrollY: 0 },
jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
};
try {
await html2pdf().set(opt).from(element).save();
showToast("PDF başarıyla indirildi! 📥");
} catch(e) { showToast("PDF oluşturulurken bir hata oluştu."); console.error(e); } 
finally {
noPrintElements.forEach(el => el.style.display = '');
const restoredElements = element.querySelectorAll('[data-pdf-restored="true"]');
restoredElements.forEach(el => { el.classList.add('print-only'); el.removeAttribute('data-pdf-restored'); });
setIsDownloadingPdf(false);
}
};

};

// ── (EK) Çıktıyı düz metne çevir → Kopyala / Prompta geri ekle ──
const matbaaMetneCevir = (res) => {
    if (!res) return '';
    const S = (x) => (x == null ? '' : String(x)).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const L = [];
    if (res.dokuman_basligi) L.push('# ' + S(res.dokuman_basligi));
    if (res.alt_baslik) L.push(S(res.alt_baslik));
    (res.icerik_bloklari || []).forEach((b, i) => {
        if (!b) return;
        L.push('');
        if (b.baslik) L.push('## ' + S(b.baslik));
        if (b.icerik_metni) L.push(S(b.icerik_metni));
        if (b.html_icerik) L.push(S(b.html_icerik));
        if (b.merkez_kavram) L.push('Merkez: ' + S(b.merkez_kavram));
        if (b.soru_metni) L.push((i + 1) + ') ' + S(b.soru_metni));
        if (Array.isArray(b.secenekler) && b.secenekler.length) b.secenekler.forEach((s, j) => L.push('   ' + (['A','B','C','D','E','F'][j] || '-') + ') ' + S(s)));
        if (Array.isArray(b.sol_sutun) && b.sol_sutun.length) L.push('Sol: ' + b.sol_sutun.map(S).join(', '));
        if (Array.isArray(b.sag_sutun_karisik) && b.sag_sutun_karisik.length) L.push('Sağ (karışık): ' + b.sag_sutun_karisik.map(S).join(', '));
        if (Array.isArray(b.kartlar) && b.kartlar.length) b.kartlar.forEach(k => L.push('Kart: ' + S(k.on_yuz) + ' → ' + S(k.arka_yuz)));
        if (b.cevap_anahtari) L.push('✔ Cevap: ' + S(b.cevap_anahtari));
    });
    return L.join('\n').replace(/\n{3,}/g, '\n\n').trim();
};

const promptSorunlari = (metin) => {
    const t = String(metin || '');
    if (!t.trim()) return [];
    const kurallar = [
        { re: /(yandaki|aşağıdaki|yukarıdaki|verilen|soldaki|sağdaki)\s*(resim|resme|resmi|görsel|görsele|görseldeki|fotoğraf|fotograf|şekle bak|şekildeki resim)/i, kotu: 'var olmayan bir resme/görsele atıf', oneri: 'nesnenin adını ya da emojisini yaz (örn: 🍎 elma) veya "SVG şekil çiz" de' },
        { re: /(resim|resmi|fotoğraf|fotograf|illüstrasyon|illustrasyon)\s*(çiz|çizin|ekle|oluştur|üret|bul|koy|yerleştir)/i, kotu: 'gerçek resim/fotoğraf üretimi (yapay zeka çizemez)', oneri: 'basit "inline SVG şekil" veya "çizgi çalışması" iste' },
        { re: /(boyama sayfası|karmaşık çizim|detaylı çizim|gerçekçi çizim|realistik)/i, kotu: 'karmaşık/gerçekçi çizim', oneri: 'basit SVG şekil, çizgi çalışması ya da emoji etkinliği iste' },
        { re: /(sesli|dinlet|şarkı söyle|müzik çal|video|animasyon|hareketli resim|hareketli görsel|\bgif\b)/i, kotu: 'ses/video/animasyon (çıktı yalnızca metin + basit görsel)', oneri: 'şarkı sözü / metin / yönerge olarak iste' },
        { re: /(qr kod|karekod|barkod)/i, kotu: 'QR / barkod üretimi', oneri: 'QR yerine düz bağlantı ya da metin yaz' },
        { re: /\b([3-9]\d|\d{3,})\s*(soru|madde|sayfa)\b/i, kotu: 'tek seferde çok büyük miktar (yanıt yarıda kesilebilir)', oneri: 'en fazla ~20-25 madde iste; gerisi için "devam" yaz' },
    ];
    const bulunan = [];
    kurallar.forEach(k => { const m = t.match(k.re); if (m && !bulunan.some(x => x.kotu === k.kotu)) bulunan.push({ eslesme: m[0], kotu: k.kotu, oneri: k.oneri }); });
    return bulunan;
};

const generateMaterial = async (istekOverride) => {
    // Matbaa: serbest isteği güvenilir yazdırılabilir materyale dönüştürür.
    // istekOverride bir metinse (uyarla/yeniden üret/anında çalışma butonlarından), onu kullan ve kutuya da yaz.
    const _override = (typeof istekOverride === 'string' && istekOverride.trim()) ? istekOverride.trim() : '';
    if(_override){ try{ setMaterialTopic(_override); }catch(e){} }
    const instruction = _override || (materialTopic.trim() || 'Yüklenen dosyayı yaş düzeyine uygun çalışma kâğıdına dönüştür.');
    if (!apiKey.trim()) {
        setMaterialError('Üretim için Ayarlar bölümünden Gemini API anahtarı girilmelidir.');
        showToast('Matbaa için önce API anahtarını ekleyin.');
        return;
    }

    const _serbestIstek = /(çizgi|cizgi|el-göz|el goz|okul öncesi|okul oncesi|kalem tut|motor beceri|boyama|hikaye|masal|şarkı|sarki|sertifika|afiş|afis|pano|çalışma kağıdı|calisma kagidi|etkinlik)/i.test(instruction);
    const isTestRequest = !_serbestIstek && (/\b(test|sınav|sinav|değerlendirme|degerlendirme|quiz|deneme|çoktan|coktan)\b/i.test(instruction)
        || ['test', 'yeni_nesil_test', 'deneme_sinavi'].includes(materialType));
    const countFromText = instruction.match(/\b([1-9]|1\d|2[0-5])\s*(?:adet|soru|madde|soruluk)\b/i);

            if (quoted) {
